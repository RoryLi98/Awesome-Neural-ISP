- id: e2e
  title: End-to-End RAW-to-sRGB
  short: End-to-end ISP
  description: Learned full-pipeline RAW-to-display rendering. Specialized low-light, multi-frame, video and task-driven
    objectives have their own primary categories. Mobile deployment and controllability are cross-cutting collections.
  intro: Learned full-pipeline RAW-to-display rendering.
- id: denoise
  title: RAW Denoising & Noise Modeling
  short: Denoising & noise
  description: Single-image RAW noise removal, sensor-noise calibration and synthesis, including self-supervised denoising.
    Brightness/rendering recovery belongs to low-light; temporal fusion belongs to burst or video.
  intro: Single-image RAW noise removal, sensor-noise calibration and synthesis, including self-supervised denoising.
- id: lowlight
  title: Low-Light Rendering & Exposure Correction
  short: Low-light & exposure
  description: Low-light RAW rendering and exposure correction, including interpretable conventional baselines. RAW-only
    noise estimation stays under denoising; multi-frame fusion and temporally evaluated methods stay under burst or video.
  intro: Low-light RAW rendering and exposure correction, including interpretable conventional baselines.
- id: demosaic
  title: Demosaicing & Remosaicing
  short: Demosaic / remosaic
  description: CFA reconstruction and conversion, including joint demosaicing/denoising and Bayer, Quad, Nona or HybridEVS
    patterns. Dedicated super-resolution and other RAW degradations have separate categories. Burst-based training alone
    does not imply multi-frame inference.
  intro: CFA reconstruction and conversion, including joint demosaicing/denoising and Bayer, Quad, Nona or HybridEVS
    patterns.
- id: restoration
  title: RAW Deblurring & Other Restoration
  short: Other RAW restoration
  description: RAW deblurring, deraining, reflection/moiré removal, under-display restoration and general mixed-degradation
    restoration. Excludes methods whose main objective is demosaicing, denoising or super-resolution.
  intro: RAW deblurring, deraining, reflection/moiré removal, under-display restoration and general mixed-degradation
    restoration.
- id: super-resolution
  title: RAW Super-Resolution & Resampling
  short: RAW SR / resampling
  description: Single-image RAW super-resolution, realistic degradation models and learned RAW downscaling. Joint demosaicing/SR
    belongs here when resolution scaling is central; multi-frame SR belongs to burst or video.
  intro: Single-image RAW super-resolution, realistic degradation models and learned RAW downscaling.
- id: burst
  title: Burst & HDR Imaging
  short: Burst / HDR
  description: Multi-frame still-image fusion for restoration, super-resolution and HDR, plus single-shot sensor-domain
    HDR reconstruction. Includes low-light fusion; continuous sequences with temporal output belong to video.
  intro: Multi-frame still-image fusion for restoration, super-resolution and HDR, plus single-shot sensor-domain HDR
    reconstruction.
- id: video
  title: RAW Video
  short: RAW video
  description: RAW video denoising, enhancement, demoiréing, super-resolution and HDR reconstruction. Temporal output
    and consistency distinguish video from burst-to-one reconstruction. Task-driven video perception stays under machine
    vision.
  intro: RAW video denoising, enhancement, demoiréing, super-resolution and HDR reconstruction.
- id: white-balance
  title: White Balance & Color Constancy
  short: White balance
  description: Illuminant estimation, camera-independent color constancy, mixed lighting and post-capture white-balance
    editing, including relevant datasets. General color grading, LUT enhancement and tone mapping belong to color/tone.
  intro: Illuminant estimation, camera-independent color constancy, mixed lighting and post-capture white-balance editing,
    including relevant datasets.
- id: color
  title: Color Correction, Tone & Retouching
  short: Color / tone / editing
  description: Color calibration, color grading, LUTs, tone mapping and photographic retouching. Includes rendered-RGB
    methods as ISP finishing modules or historical context; these are not full RAW-to-RGB pipelines.
  intro: Color calibration, color grading, LUTs, tone mapping and photographic retouching.
- id: inverse
  title: Inverse ISP & RAW Synthesis
  short: Inverse ISP / RAW synthesis
  description: RGB-to-RAW or linear-color reconstruction, RAW generation and cross-camera RAW translation, including
    sparse-metadata methods without a central learned coding objective. Learned entropy/rate–distortion methods belong
    to compression; bidirectional models are classified by their main evaluated contribution.
  intro: RGB-to-RAW or linear-color reconstruction, RAW generation and cross-camera RAW translation, including sparse-metadata
    methods without a central learned coding objective.
- id: compression
  title: RAW Compression & Joint Coding
  short: RAW compression
  description: Lossless/lossy RAW coding, JPEG-plus-learned-metadata reconstruction and joint rendering/compression.
    A rate, storage or entropy-coding objective distinguishes this category from generic inverse ISP.
  intro: Lossless/lossy RAW coding, JPEG-plus-learned-metadata reconstruction and joint rendering/compression.
- id: task
  title: ISP for Machine Vision
  short: Machine vision
  description: RAW imaging optimized or evaluated for detection, segmentation, recognition, matching, motion or robotic
    action. Task-reward pipeline selection stays here; general-purpose ISP search methods supporting several objectives
    stay under tuning.
  intro: RAW imaging optimized or evaluated for detection, segmentation, recognition, matching, motion or robotic action.
- id: tuning
  title: ISP Parameter & Pipeline Optimization
  short: ISP optimization
  description: Optimization or prediction of conventional/differentiable ISP parameters and module sequences, with proxies,
    search, reinforcement learning or language guidance. Supports general-purpose and multi-objective systems. User-editable
    learned rendering can also appear in the controllable collection.
  intro: Optimization or prediction of conventional/differentiable ISP parameters and module sequences, with proxies,
    search, reinforcement learning or language guidance.
- id: report
  title: Challenges, Surveys & Evaluation
  short: Reports / evaluation
  description: Challenge reports, surveys, evaluation protocols and position papers. A report is counted once; separately
    released solutions are implementation resources nested under that publication. Dataset papers stay with the task
    they benchmark.
  intro: Challenge reports, surveys, evaluation protocols and position papers.
