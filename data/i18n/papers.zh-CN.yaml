LiteISPNet:
  title: 在不精确配准监督下学习 RAW 到 sRGB 映射
  tldr: 联合配准与全局色彩映射，处理 RAW／sRGB 训练对的空间错位与色彩差异；包含轻量 LiteISPNet。
  note: README 还通过百度网盘提供 ZRR（提取码 8sq1）及预处理后的 SR-RAW。
  weight_labels:
  - ZRR / SR-RAW 预训练模型（Google Drive）
AWNet:
  title: AWNet：用于图像 ISP 的注意力小波网络
  tldr: 结合小波变换与注意力，使用 RAW／去马赛克图像双输入，是 AIM 2020 排名前列的方案。
  weight_labels:
  - demosaiced_model（Google Drive）
  - Raw_model（Google Drive）
MW-ISPNet:
  title: MW-ISPNet：AIM 2020 学习型 ISP 获胜方案（见挑战报告）
  tldr: 采用多级小波与残差通道注意力的 U-Net，在 AIM 2020 两个赛道均排名第一。
  weight_labels:
  - 赛道 1 模型（Google Drive）
  - 赛道 2 模型（Google Drive）
PyNET:
  title: 以单个深度学习模型替代移动相机 ISP
  tldr: 在华为 P20 RAW 与佳能 5D Mark IV 照片构成的 ZRR 数据集上，逐层训练倒金字塔多尺度网络。
  note: PyTorch 版本位于 aiff22/PyNET-PyTorch；训练还需要 VGG-19。
  weight_labels:
  - PyNET_pretrained.zip（TensorFlow）
  - pynet_level_0.pth（PyTorch 版本）
PyNET-CA:
  title: PyNET-CA：加入通道注意力的增强 PyNET，用于端到端移动 ISP
  tldr: 为 PyNET 加入通道注意力和子像素上采样，是 AIM 2020 ISP 赛道方案。
  note: 作者提醒，在 PyTorch > 1.4 时可能无法复现实验结果。
  weight_labels:
  - pretrained_model.zip（Dropbox）
Sky Optimization:
  title: 天空优化：低光摄影中具有语义感知能力的天空图像处理
  tldr: 在手机夜景 ISP 中利用轻量分割网络单独处理天空区域，与 Google Night Sight 相关。
CameraNet:
  title: CameraNet：高效相机 ISP 学习的两阶段框架
  tldr: 将 ISP 拆分为分别监督的复原和增强子网络，缓解单个网络同时学习去噪与色彩调整的冲突。
  note: 官方代码基于 TensorFlow 1.15；README 仅提供 HDR+／SID 预处理数据，未找到权重链接。
Deep Camera:
  title: Deep Camera：用于图像信号处理的全卷积神经网络
  tldr: 以单个全卷积网络替代完整相机 ISP 的早期尝试。
HERN:
  title: 用于图像去马赛克与增强的高分辨率网络
  tldr: AIM 2019 RAW 到 RGB 获胜方案，采用高分辨率细节分支与低分辨率全局分支的双分支设计。
  note: README 中挑战权重 114.pth／115.pth 的两个 OneDrive 链接均返回 404（核验日期：2026-10-11）。
W-Net:
  title: W-Net：利用错位数据完成 RAW 到 RGB 映射的两阶段 U-Net
  tldr: AIM 2019 RAW 到 RGB 参赛方案，以两阶段 U-Net 处理手机 RAW 与单反 RGB 之间错位的监督数据。
  weight_labels:
  - 预训练模型（Google Drive）
DeepISP:
  title: DeepISP：迈向端到端图像处理管线学习
  tldr: 最早的端到端学习型 ISP 之一，包含局部去噪／去马赛克和全局色调／色彩调整两阶段，并提供三星 S7 数据集。
DPED:
  title: 利用深度卷积网络在移动设备上生成单反级照片
  tldr: 对手机照片进行 sRGB 到 sRGB 增强，使其达到单反照片风格与质量；采用 DPED 数据集，是 PyNET 学习型 ISP 系列的前身。
  weight_labels:
  - models_orig/{iphone,sony,blackberry}_orig（仓库内）
Scene-Dependent Imaging:
  title: 利用深度神经网络建模相机中依赖场景的成像过程
  tldr: 以深度神经网络建模相机随场景变化的 RAW 到 sRGB 渲染，是学习型 ISP 的早期尝试之一。
Edit-aware RAW:
  title: 编辑感知的 RAW 重建
  tldr: 要求重建 RAW 在后续白平衡、曝光、风格等编辑中仍保持质量，因此针对编辑后的误差进行训练。
  note: 仓库包含 NILUT 与色调曲线辅助模型；主模型需利用 S24 数据自行训练。
MambaRaw:
  title: MambaRaw：通过选择性状态空间建模实现高效 4K RAW 图像重建
  tldr: 以 JPEG 为条件进行 4K RAW 编码与重建，在熵模型中采用选择性状态空间建模。
  note: 每个 λ 值都需要单独训练。
MERIT:
  title: MERIT：多域高效 RAW 图像转换
  tldr: 使用单个模型在多个相机 RAW 域之间高效转换，并发布 MDRAW 数据集。
RAW-Flow:
  title: RAW-Flow：利用确定性潜空间流匹配推进 RGB 到 RAW 图像重建
  tldr: 通过潜空间中的确定性流匹配完成 RGB 到 RAW 重建。
  weight_labels:
  - nikon_d700 / canon_eos_5d 权重（Google Drive）
Raw-JPEG Adapter:
  title: Raw-JPEG Adapter：利用 JPEG 高效压缩 RAW 图像
  tldr: 采用约 3.7 万参数的可逆预处理（逐像素伽马、1D LUT 及可选 DCT），使 RAW 图像能够使用标准 JPEG 存储。
  weight_labels:
  - models/raw_jpeg_adapter_q_*.pth（仓库内）
RawGen:
  title: RawGen：学习相机 RAW 图像生成
  tldr: 三星多伦多 AI 中心的工作：使用 FLUX Kontext LoRA 和 XYZ 空间 VAE 解码器，从文本或 sRGB 生成特定相机的 RAW 图像。
  note: 官方仓库本身不含权重，指向作者仓库 DY112/RawGen。
  weight_labels:
  - kontext_lora.pt + vae_decoder_xyz.pt（Google Drive，作者仓库 DY112/RawGen）
RAWIC:
  title: RAWIC：位深自适应的无损 RAW 图像压缩
  tldr: 对 RAW 图像进行位深自适应的学习型无损压缩。
  note: README 还列有百度网盘镜像。
  weight_labels:
  - 主模型与消融模型（北京大学网盘）
SpiralDiff:
  title: SpiralDiff：结合 LoRA 的螺旋扩散，实现跨相机 RGB 到 RAW 转换
  tldr: 结合强度分层的螺旋扩散与每相机 LoRA，在多个相机之间实现 RGB 到 RAW 转换。
  note: 采用 Apache-2.0 许可证。README 的模型链接 huggingface.co/Chuancy/SpiralDiff 返回 404；检查点实际位于存放 FiveK DNG 数据的数据集仓库中。
  weight_labels:
  - checkpoints.zip（Hugging Face 数据集仓库）
Illum–Sensor Mapping:
  title: 改进 RAW 图像在光照与传感器之间的映射
  tldr: 在不同光照和传感器之间映射 RAW 图像，用于数据增强与跨相机迁移。
Physically-Informed Raw2Raw:
  title: 超越标定：物理知识引导的 RAW 到 RAW 映射学习
  tldr: 在物理约束下学习相机之间的 RAW 到 RAW 映射。
RAW-Diffusion:
  title: RAW-Diffusion：用于高保真 RAW 图像生成的 RGB 引导扩散模型
  tldr: 使用 RGB 引导的扩散模型生成高保真 RAW 图像，为 RAW 目标检测扩充训练数据。
  note: README 未提供权重。
ReRAW:
  title: ReRAW：通过分层采样进行 RGB 到 RAW 重建，用于高效边缘目标检测
  tldr: 通过分层采样训练 RGB 到 RAW 重建模型，为边缘设备上的 RAW 目标检测生成数据。
Learnable CCM RAW Recon:
  title: 用于 RAW 重建的可学习色彩校正矩阵
  tldr: 利用可学习的色彩校正矩阵实现轻量 sRGB 到 RAW 重建。
Prior Metadata RAW Recon:
  title: 先验元数据驱动的 RAW 重建：无需逐图像元数据
  tldr: 使用相机级先验元数据代替逐图像元数据进行 RAW 重建。
Rawformer:
  title: Rawformer：面向可学习相机 ISP 的非配对 RAW 到 RAW 转换
  tldr: 通过非配对跨相机 RAW 到 RAW 转换，使已训练的神经 ISP 能迁移到新传感器。
  note: README 待办列表中的上传预训练模型事项尚未完成。
SEL-CIE:
  title: SEL-CIE：从非线性 sRGB 重建 CIE-XYZ 的知识引导自监督学习框架
  tldr: 以自监督方式从非线性 sRGB 图像重建 CIE XYZ 图像。
sRGB-to-RAW Video:
  title: 利用帧间亲和关系进行 sRGB 到 RAW 视频逆渲染
  tldr: 利用视频帧间的亲和关系，将 sRGB 视频逆渲染为 RAW。
Unsupervised Raw2Raw ISP:
  title: 通过无监督 RAW 到 RAW 映射提升 ISP 模型泛化能力
  tldr: 采用无监督跨相机 RAW 到 RAW 映射，使训练好的 ISP 模型泛化到新传感器。
Beyond R2LCM:
  title: 超越基于学习型元数据的 RAW 图像重建
  tldr: R2LCM 的扩展：利用学习型元数据实现可变码率 RAW 重建，也是 MambaRaw 的对比基线。
Graphics2RAW:
  title: Graphics2RAW：将计算机图形图像映射为传感器 RAW 图像
  tldr: 将计算机图形渲染结果转换为真实感传感器 RAW 图像，用作训练数据。
Metadata RAW (INF):
  title: 通过隐式神经函数进行基于元数据的 RAW 重建
  tldr: 利用隐式神经函数，在元数据引导下重建 RAW。
R2LCM:
  title: 利用学习型紧凑元数据重建 RAW 图像
  tldr: 端到端学习极紧凑的潜在元数据，并与 JPEG 一同存储，实现码率可控的 RAW 重建。
  weight_labels:
  - 索尼模型（Google Drive）
  - 三星模型（Google Drive）
SRISP:
  title: 通过参考引导的动态参数选择实现自监督逆向图像信号处理
  tldr: 在参考图像引导下动态选择参数，执行自监督逆向 ISP。
Content-Aware Metadata:
  title: 利用内容感知元数据学习 sRGB 到 RAW-RGB 逆渲染
  tldr: 学习选取依赖图像内容的采样点作为元数据，提高 sRGB 到 RAW 重建质量。
  note: README 中的数据集链接为空。
MBISPLD:
  title: 通过可学习字典构建基于模型的图像信号处理器
  tldr: 结合可解释传统 ISP 模块与可学习字典，对可逆 RAW 与 RGB 映射进行建模。
  note: mv-lab/AISP/mbispld 目录仅含论文 PDF 和配图。
Overexposure Mask Fusion:
  title: 过曝掩码融合：可泛化逆向 ISP 的多步细化
  tldr: 在逆向 ISP 中单独处理过曝区域，并进行多步细化。
  weight_labels:
  - trained_models/（仓库内，S7 数据）
Reverse Style Transfer ISP:
  title: 通过反向风格迁移逆转图像信号处理器
  tldr: 将 ISP 求逆视为反向风格迁移问题。
CIE XYZ Net:
  title: CIE XYZ Net：面向低层计算机视觉任务的图像逆处理
  tldr: 学习可逆 sRGB 与 CIE XYZ 映射，将已渲染图像逆处理回场景参考空间，用于低层视觉任务。
  note: 论文结果使用 MATLAB 版本；PyTorch 权重是为方便使用提供的移植版本。
  weight_labels:
  - PyTorch/models/model_sRGB-XYZ-sRGB.pth（仓库内）
InvISP:
  title: 可逆图像信号处理
  tldr: 利用可逆网络同时完成 RAW 到 sRGB 渲染与近无损的 sRGB 到 RAW 恢复，并考虑 JPEG 压缩影响。
  weight_labels:
  - pretrained/canon.pth、nikon.pth（仓库内）
Raw Bayer Synthesis for CV-ISP:
  title: 面向计算机视觉的 ISP 管线设计中的 RAW Bayer 图像合成
  tldr: 从 sRGB 合成 Bayer RAW，以设计和评估面向计算机视觉任务的 ISP。
Raw-to-Raw (Semi-Sup.):
  title: 半监督 RAW 到 RAW 映射
  tldr: 利用少量配对数据与大量非配对数据，学习不同相机 RAW 空间之间的映射。
  note: 提供 DNG 数据及预计算映射。
Spatially Aware Metadata:
  title: 用于 RAW 重建的空间感知元数据
  tldr: 将少量空间采样的 RAW 值作为元数据嵌入 JPEG，以实现高质量 RAW 重建。
CycleISP:
  title: CycleISP：通过改进数据合成实现真实图像复原
  tldr: 学习双向 RGB-RAW ISP，在两个域中合成真实感噪声数据，用于训练去噪器。
  weight_labels:
  - 全部模型（Google Drive）
Lossless Mosaic Compression:
  title: 利用卷积神经网络预测对马赛克图像进行无损压缩
  tldr: 通过 CNN 预测实现 Bayer 马赛克图像的无损压缩。
SingleHDR:
  title: 通过学习逆转相机管线进行单图像 HDR 重建
  tldr: 将 LDR 形成过程建模为去量化、线性化、过曝恢复三阶段逆向 ISP，逐步逆转以重建 HDR。
  weight_labels:
  - 模型检查点 ckpt（Google Drive）
Camera Pipeline Simulation:
  title: 通过相机管线模拟生成真实 RGB 图像去噪训练数据
  tldr: 模拟包含 RAW 噪声的完整相机管线，合成 sRGB 去噪训练数据。
Unprocessing:
  title: 面向学习型 RAW 去噪的图像逆处理
  tldr: 对网络 sRGB 图像执行逆 ISP，生成带泊松-高斯噪声的真实感 RAW，用于训练 RAW 去噪器。
  note: 位于 google-research 单一大仓库的子目录中。
  weight_labels:
  - 训练完成的模型（Google Drive）
MeanFlow RAW:
  title: 当极暗场景遇到运动模糊：用于统一 RAW 复原的 MeanFlow
  tldr: 联合处理极暗场景与运动模糊的 RAW 图像复原方法。
NEC-Diff:
  title: NEC-Diff：噪声鲁棒的事件与 RAW 互补扩散，在极暗环境中看清运动
  tldr: 利用扩散模型融合事件相机与 RAW 的互补数据，处理极暗场景中的运动。
  note: 数据集正在分批上传；尚无权重。
RawMetaDiff:
  title: RawMetaDiff：通过元数据引导扩散挖掘双曝光 RAW 中的极暗场景信息
  tldr: 在双曝光 RAW 上进行元数据引导的扩散处理，用于极暗场景。
DarkDiff:
  title: DarkDiff：将扩散模型改用于相机 ISP，推进低光 RAW 增强
  tldr: 将预训练图像扩散模型重新用于低光 RAW 的相机 ISP。
ERIENet:
  title: ERIENet：低光环境中的高效 RAW 图像增强网络
  tldr: 注重低参数量与快速推理的低光 RAW 到 sRGB 增强网络，获 ICVISP 2025 最佳论文。
  note: 仓库含训练和测试代码；未找到权重。
HiMA:
  title: 用于低光 RAW 图像增强的层次化混合架构
  tldr: 通过层次化混合 Transformer 与 Mamba 增强低光 RAW，与 Retinex-RAWMamba 来自相同作者。
  weight_labels:
  - 预训练模型（Google Drive）
  - 预训练模型（百度网盘，提取码 8fem）
ISP-driven LLIE Data:
  title: 通过 ISP 驱动的数据建模实现更真实的低光图像增强
  tldr: 对 ISP 管线建模，合成更真实的低光训练数据。
LDM-ISP:
  title: LDM-ISP：利用潜空间扩散模型改进低光神经 ISP
  tldr: 将潜空间扩散先验引入神经 ISP，以恢复极低光 RAW 中的细节和色彩。
  note: 作者称发布模型为重新训练的版本，得分略高于论文所报结果。
  weight_labels:
  - pretrained_models（OneDrive/SharePoint）
Reconstruction & Denoising in the Dark:
  title: 重新思考暗光中的重建与去噪：新视角、通用架构及其拓展
  tldr: 在通用架构中统一低光 RAW 重建与去噪，重新审视两者关系。
Rectified-Flow LL RAW:
  title: 用于低光 RAW 图像增强的物理引导整流流
  tldr: 利用物理噪声模型引导整流流，对低光 RAW 图像进行增强。
SIED:
  title: 学习在极暗环境中看见
  tldr: 将低光 RAW 增强推进至比 SID 更暗的场景，发布 SIED 数据集及对应增强方法。
  weight_labels:
  - 预训练模型（OneDrive）
  - 镜像（百度网盘，提取码 m9zp）
TS-Diff:
  title: TS-Diff：用于低光 RAW 图像增强的两阶段扩散模型
  tldr: 先在多相机数据上预训练，再在目标相机上快速微调的两阶段扩散方法。
  note: pretrained_models/ 目录仅包含占位文件。
Retinex-RAWMamba:
  title: Retinex-RAWMamba：连接去马赛克与去噪以增强低光 RAW 图像
  tldr: 将 Retinex 分解与 Mamba 架构结合，联合处理去马赛克与去噪。
  note: 各模型检查点还提供百度网盘镜像。
  weight_labels:
  - 索尼模型（Google Drive）
  - 富士模型（Google Drive）
  - MCR 模型（Google Drive）
DiffuseRAW:
  title: DiffuseRAW：用于低光图像的端到端生成式 RAW 图像处理
  tldr: 使用扩散模型直接从低光 RAW 生成 sRGB。
DNF:
  title: DNF：用于暗光成像的解耦与反馈网络
  tldr: 将 RAW 域去噪与 sRGB 域色彩恢复解耦，再以反馈连接联结两个阶段。
  weight_labels:
  - SID 索尼模型（Google Drive）
  - SID 富士模型（Google Drive）
  - MCR 模型（Google Drive）
  - SID 索尼模型（百度网盘，提取码 eoiz）
ExposureDiffusion:
  title: ExposureDiffusion：学习曝光以增强低光图像
  tldr: 将物理曝光过程嵌入扩散模型，逐步把低光 RAW 曝光至正常光照。
  note: 与 R2LCM 为同一作者。
  weight_labels:
  - SID_Pg / SID_PGru / SID_real 等模型（Google Drive）
FDA Low-Light:
  title: 通过特征域适应学习看清低光图像
  tldr: 单阶段低光 RAW 到 sRGB 网络，通过特征域适应解耦去噪与色彩映射，避免两阶段网络的计算开销。
MCR:
  title: 抛弃 Bayer 滤色阵列以看清暗处
  tldr: 采集无 Bayer 滤色阵列的单色传感器与彩色传感器配对数据（MCR），先解码图像，再进行着色。
  note: MCR 数据集也可从百度网盘获取，提取码 22cv。
  weight_labels:
  - MCR_pretrained_model（Google Drive）
  - SID_pretrained_model（Google Drive）
Progressive LL RAW:
  title: 面向 RAW 图像的渐进式联合低光增强与去噪
  tldr: 对 RAW 图像渐进地联合进行低光增强与噪声去除。
RAW LLE (TIP):
  title: 迈向利用 RAW 图像的低光增强
  tldr: 系统比较 RAW 与 sRGB 输入在低光增强中的表现，并提出 RAW 域方法。
Burst Dark Enhancement:
  title: 通过连拍摄影学习增强极暗图像
  tldr: 对极暗 RAW 连拍序列进行由粗到细的增强。
Few-Shot LL RAW:
  title: 面向低光 RAW 图像增强的小样本域适应
  tldr: 采用小样本跨相机域适应进行低光 RAW 增强，获 BMVC 最佳学生论文提名。
RED:
