  - LLRVD 模型（Google Drive）
  - 镜像（百度网盘，提取码 4v88）
Pre/Post-Demosaic Video Denoise:
  title: 结合去马赛克前后噪声去除的 RAW 视频处理
  tldr: 在去马赛克前和后均执行去噪的 RAW 视频处理管线。
VJDD:
  title: 迈向从 RAW 数据获得准确且时序一致的视频复原
  tldr: 对 RAW 视频联合去噪与去马赛克，重点保证时序一致性。
  note: 仓库仅包含 README。
FloRNN:
  title: 通过前瞻前向循环模块模拟后向模块，实现单向视频去噪
  tldr: 在单向循环网络中利用前瞻模块模拟双向行为，支持 CRVD 等 RAW 视频数据。
  weight_labels:
  - 预训练模型（Google Drive）
  - 预训练模型（百度网盘，提取码 ogua）
Real-RawVSR:
  title: Real-RawVSR：真实世界 RAW 视频超分辨率与基准数据集
  tldr: 提供真实世界 RAW 视频超分辨率数据集及对应方法。
