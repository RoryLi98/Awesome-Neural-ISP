# Chinese translations keyed by the exact canonical paper name.
BRACE:
  title: 从 Bricker 到 BRACE：针对闪烁条纹的包围曝光 RAW 数据集与复原模型
  tldr: "针对随曝光变化的闪烁条纹，以频率感知先验和多尺度空间交叉注意力融合包围曝光 RAW，并建立合成/真实 Bricker 数据与条纹频率一致性指标。"
  note: README 中模型与数据下载仍列为待办事项。
BurstGP:
  title: BurstGP：利用生成先验增强 RAW 连拍图像超分辨率
  tldr: "针对连拍超分纹理不足，以多帧扩散先验增强传统重建器，结合退化感知条件和 sRGB 到线性域逆变换，在保留线性域保真度的同时控制生成细节。"
DEBIR:
  title: 动态曝光连拍图像复原
  tldr: "针对固定连拍曝光难适应运动和光照，BAENet 根据预览、运动与增益预测逐帧曝光，通过可微连拍模拟器和分阶段训练联合优化采集与复原。"
  weight_labels:
  - 官方权重（Google Drive）
GenMFSR:
  title: GenMFSR：生成式多帧图像复原与超分辨率
  tldr: "针对多帧 RAW 重建缺少生成先验，配准连拍观测并将生成约束在 RAW 高频区域，联合去噪、去马赛克与超分辨率，同时抑制低频伪影。"
Keyframe SSM Burst SR:
  title: 以关键帧为中心的连拍图像超分辨率状态空间建模
  tldr: "针对连拍超分辨率长序列开销，将主要重建计算集中在关键帧，以 Gather–Aggregate–Scatter 传递亚像素信息，用小波条件状态空间路由强调高频并保留原视角特征。"
LatentBurst:
  title: LatentBurst：面向十六合一 Bayer 图案 CMOS 图像传感器图像的快速高效多帧超分辨率
  tldr: "针对 Hexadeca-Bayer 连拍移动端重建，以潜空间金字塔配准融合和高效 U-Net 处理大运动，并用光流微调及两步蒸馏缩小合成到真实的域差距。"
QMambaBSR:
  title: QMambaBSR：利用查询状态空间模型进行连拍图像超分辨率
  tldr: "针对连拍亚像素细节与随机噪声难分，以帧间查询和帧内状态空间扫描提取一致信息，再根据亚像素分布预测自适应上采样核，重建场景细节。"
Bracket Restoration:
  title: 利用光流引导配准与增强特征聚合改进包围曝光图像复原与增强
  tldr: "针对包围曝光中的噪声、模糊和错位，IREANet 用光流指导可变形配准及空间注意力，再以增强残差块和单向循环聚合特征，结合 Bayer 保持增强训练。"
BurstM:
  title: BurstM：结合光流与傅里叶空间的深度连拍多尺度超分辨率
  tldr: "针对连拍超分辨率的倍率灵活性，以光流对齐帧并预测连续傅里叶系数表示高频纹理，使同一模型支持多个输出倍率。"
  weight_labels:
  - SyntheticBurst 模型（Google Drive）
  - BurstSR 模型（Google Drive）
Burstormer:
  title: Burstormer：用于连拍图像复原与增强的 Transformer
  tldr: "针对复杂连拍运动与帧间通信，采用 Transformer 结合可变形配准、参考特征增强和循环连拍采样，逐步融合局部及非局部信息后上采样。"
  note: 其他任务的权重列在相应子目录的 README 中。
  weight_labels:
  - 合成连拍超分辨率检查点（OneDrive）
Efficient Raw HDR:
  title: 从真实世界 RAW 图像高效重建 HDR
  tldr: "针对 RAW HDR 部署开销与鬼影，RepUNet 采用结构重参数化及运动配准损失，并提供 RealRaw-HDR 数据生成流程和真实拍摄基准。"
FBANet:
  title: 迈向真实世界连拍图像超分辨率：基准与方法
  tldr: "针对真实连拍密集配准难可靠的问题，结合单应配准与联邦亲和融合，发布 RealBSR-RAW/RGB 数据，用于研究真实退化和多帧互补细节。"
  note: 模型检查点的 Google Drive 副本返回 404（核验日期：2026-10-11）。
  weight_labels:
  - RealBSR 检查点 model_best.pth（百度网盘，提取码 f9ew）
GMTNet:
  title: 用于连拍复原与增强的门控多分辨率迁移网络
  tldr: "针对退化连拍的精细重建，分别以多尺度特征配准、转置注意力合并和分辨率迁移上采样完成对齐、聚合及输出恢复。"
KBNet:
  title: 核感知的连拍盲超分辨率
  tldr: "针对未知模糊下连拍超分失效，估计模糊核先验并用其调制金字塔可变形配准，将退化信息纳入 RAW 多帧融合。"
Raw/sRGB HDR Video:
  title: 结合 RAW 与 sRGB 域大规模动态数据集的 HDR 视频重建
  tldr: "针对动态 HDR 视频真实监督不足，以交错传感器同步捕获不同曝光，建立 85 个场景的 RAW/sRGB 目标；Raw-HDRNet 用金字塔光流引导可变形卷积对齐邻帧。"
RawHDR:
  title: RawHDR：从单张 RAW 图像重建高动态范围图像
  tldr: "针对单张 RAW 的高光与阴影恢复，学习困难/容易曝光区域掩码，结合通道间强度引导和全局空间引导，并提供 RAW/HDR 配对数据。"
  weight_labels:
  - 预训练模型（OneDrive）
Self-Supervised Burst SR:
  title: 自监督连拍超分辨率
  tldr: "针对连拍超分缺少高分辨率参考，用可学习前向成像模型仅从含噪低分辨率连拍建立自监督，利用混叠高频恢复细节，并适配真实动态运动。"
Single-Shot HDR Demosaic:
  title: 针对时变曝光联合去马赛克与去鬼影，实现单次拍摄 HDR 成像
  tldr: "针对时间变化 Quad-Bayer 曝光的鬼影，提取马赛克多曝光特征，以多尺度 Transformer 对齐空间与颜色位移，并提供对应传感器数据用于联合 HDR 去马赛克。"
  weight_labels:
  - 预训练模型 best_psnr_mu.pt（Google Drive）
2StageAlign:
  title: 面向大位移连拍图像重建的可微两阶段配准方案
  tldr: "针对连拍大位移配准成本，先用可微渐进块匹配进行图块级对齐，再于完整分辨率特征中隐式细化像素配准，用于联合去噪与去马赛克。"
  weight_labels:
  - experiments/.../models（仓库内）
BIPNet:
  title: 连拍图像复原与增强
  tldr: "针对连拍互补细节与退化的区分，先以边缘增强模块配准，再构造伪连拍特征，逐级自适应聚合并提高分辨率，实现复原与增强。"
  note: 各子任务权重列在 Burst_Super_Resolution／Burst De-noising 子目录的 README 中。
  weight_labels:
  - 合成连拍超分辨率模型 BIPNet.ckpt（OneDrive）
BSRT:
  title: BSRT：结合 Swin Transformer 与光流引导可变形配准改进连拍超分辨率
  tldr: "针对连拍运动与细节融合，以 Swin Transformer 主干结合金字塔光流引导可变形配准，建模长程结构并聚合多帧互补纹理。"
  weight_labels:
  - 全部预训练权重（Google Drive）
HDR+SR Bursts:
  title: 从 RAW 连拍图像同时获得高动态范围与超分辨率
  tldr: "针对 HDR 与分辨率分开处理的问题，联合处理手持包围曝光 RAW 连拍，利用空间和曝光互补性同时重建高分辨率 HDR 彩色图像。"
DBSR:
  title: 深度连拍超分辨率
  tldr: "针对多帧 RAW 数字变焦，以光流配准噪声帧、注意力融合后生成去噪放大 RGB，并提供手机连拍与单反高分辨率参考配对的 BurstSR 数据。"
  note: 挑战赛工具包：goutamgmb/NTIRE21_BURSTSR。
  weight_labels:
  - 模型库（由安装脚本自动下载）
Deep-Rep:
  title: 多帧超分辨率与去噪的深度重参数化
  tldr: "针对物理多帧融合与学习先验结合，以学习误差度量和潜图像特征重新参数化 MAP 目标，将成像模型移入潜空间，统一用于连拍去噪和超分辨率。"
  weight_labels:
  - 模型库（由安装脚本自动下载）
EBSR:
  title: EBSR：利用可变形配准进行特征增强连拍超分辨率
  tldr: "针对连拍纹理配准与重建，结合特征增强金字塔可变形配准、跨非局部融合和长程拼接重建，并以级联残差路径改善阶段间信息传递。"
  weight_labels:
  - 合成赛道模型（Google Drive）
  - 真实赛道模型（Google Drive）
GCP-Net:
  title: 利用绿色通道先验对真实世界连拍图像联合去噪与去马赛克
  tldr: "针对真实连拍噪声下结构恢复，利用 Bayer 绿色通道采样更密、质量更好的先验指导联合去噪去马赛克，用可靠观测辅助缺失颜色重建。"
  weight_labels:
  - experiments/gcpnet_model/600000_G.pth（仓库内）
Lucas-Kanade Reloaded:
  title: Lucas-Kanade 重装上阵：从 RAW 连拍图像进行端到端超分辨率
  tldr: "针对亚像素配准与可解释重建，将可学习 Lucas–Kanade 配准和图像先验纳入端到端 RAW 算法，利用连拍混叠中的额外信息恢复高分辨率。"
Merging-ISP:
  title: Merging-ISP：多曝光高动态范围图像信号处理
  tldr: "针对 HDR 融合与 ISP 分步处理的误差传播，以统一神经管线联合学习多曝光合并、去马赛克和渲染，直接从 RAW 观测生成最终 HDR 图像。"
Tri-Exposure Quad-Bayer HDR:
  title: 利用三曝光 Quad-Bayer 传感器重建 HDR 视频
  tldr: "针对交错多曝光下的运动 HDR 重建，以三曝光 Quad-Bayer 网络分解子任务，并用平衡高光与阴影贡献的 LDR 重建损失缓解动态范围导致的训练偏差。"
BPN:
  title: 利用基预测网络实现高效大核连拍去噪
  tldr: "针对大核连拍去噪输出张量过大的问题，预测共享全局基核和逐像素混合系数，通过低维分解利用时空自相似性，减少内存和计算。"
  note: README 和 scripts/download_models.sh 中的 Google Drive 模型文件链接返回 404（核验日期：2026-10-11）。
Decoupled Burst Denoising:
  title: 面向真实世界 RAW 连拍去噪的解耦学习方案
  tldr: "针对运动估计与传感器噪声相互干扰，设计分别学习运动和噪声统计的多帧 CNN，并在合成及真实动态 RAW 序列上评估解耦融合。"
Deep Snapshot HDR:
  title: 利用多曝光滤色阵列实现深度单次拍摄 HDR 成像
  tldr: "针对多曝光 CFA 的缺失颜色与曝光融合，以亮度归一化输入和损失联合学习 HDR 重建，使亮暗区域误差贡献不受绝对辐射值主导。"
TSWT Burst:
  title: 通过时间移位小波变换进行连拍去噪
  tldr: "针对可变长度连拍去噪的效率，用时间移位处理小波特征，以高频子带保留局部细节、低频子带描述结构，并利用真实噪声模型训练。"
Iterative Residual Burst:
  title: 面向连拍摄影应用的迭代残差卷积网络
  tldr: "针对深度连拍处理缺乏物理结构，将近端梯度式优化展开为迭代残差 CNN，结合逐帧前向成像模型处理去噪与去马赛克，不固定帧数和顺序。"
Night Sight:
  title: 极低光下的手持移动摄影
  tldr: "针对手持低光下噪声与运动模糊，以运动测量决定曝光和帧数，噪声感知配准融合多帧，再用学习式白平衡与专门色调映射恢复颜色并保留夜景观感。"
Deep Burst Denoising:
  title: 深度连拍去噪
  tldr: "针对任意帧数的噪声融合，在单帧去噪器上加入循环全卷积整合，逐步利用历史观测，并验证其在去噪与超分辨率中的应用。"
KPN:
  title: 利用核预测网络进行连拍去噪
  tldr: "针对手持连拍联合配准和去噪，从噪声帧与噪声水平预测空间变化时空卷积核，并结合真实噪声模拟及退火损失减少训练局部最优。"
  note: 仅提供训练代码与合成数据管线。
Neural Block-wise Auto-exposure:
  title: 用于单次拍摄高动态范围成像的神经分块自动曝光
  tldr: "针对单次 HDR 采集的局部亮度差异，根据预览图及其曝光时间预测每个不重叠 16×16 传感器块的曝光，并比较 RAW 与 sRGB 预览条件。"
  note: 2026-10-09 发布，2026-10-16 修订。2026-10-28 核验时，论文与仓库检索均未发现实现代码或预训练检查点链接。
Adaptive Color Grading:
  title: 自适应色彩分级
  tldr: "针对阴影与高光需独立调色，以标注视频帧训练 K 近邻预测色调区域阈值，将各区域 CIELAB 调整合成为单个可部署 3D LUT，并提供开放调色工具。"
  note: 仓库包含示例训练数据；RAW HDR 视频数据集计划托管于 HDRVS 页面。
PrefLUT:
  title: PrefLUT：从成对偏好获得可复用、可细化的个性化色彩编辑
  tldr: "针对单次参考无法积累用户偏好，将喜欢与不喜欢的图像对编码为可复用、可更新的画像，控制 LUT 与强度预测，无需逐用户优化，并设计受控偏好验证协议。"
  weight_labels:
  - weights/preflut.pt（仓库内）
LoopLUT:
  title: LoopLUT：通过渐进区域细化的 3D 查找表实现实时 4K 图像增强
  tldr: "针对快速 LUT 缺少局部自适应，以全局 LUT 串联区域条件残差 LUT，低分辨率门控划分区域，使高分辨率渲染仅需少量固定查表次数。"
FlowTool:
  title: FlowTool：通过流匹配控制图像精修工具参数
  tldr: "针对图像与指令驱动的可编辑工具参数预测，以视觉语言主干和扩散 Transformer 构建条件 rectified flow，经分阶段流匹配与奖励后训练直接建模联合参数分布。"
Synthetic Dense Illuminant:
  title: 通过基于物理的合成数据进行稠密光源估计的通用管线
  tldr: "针对逐像素光源真值采集昂贵，从物理渲染三维场景推导稠密光源色度，生成 74,321 张受控照明图像，预训练单光源及多光源估计器。"
C2LUT:
  title: 用于相机色彩校正的光源自适应 3D 查找表
  tldr: "针对光源光谱变化下的颜色校正，以光源色度表征控制非线性 3D LUT，并用 Tucker 分解压缩计算，提供 1,473 种光源光谱用于评测。"
  note: 代码将在论文录用后发布。
Multispectral CC:
  title: 利用多光谱传感器进行移动相机色彩校正
  tldr: "针对 RGB 颜色歧义，端到端联合处理高分辨率 RGB 和辅助低分辨率多光谱数据，并按不同相机响应从光谱数据构建训练与评测集。"
  note: 数据集位于 Hugging Face：LucaCogo/MobileSpectralCCDataset。
  weight_labels:
  - pretrained/（仓库内，每款相机一个文件夹）
RL-AWB:
  title: RL-AWB：面向低光夜间场景自动白平衡校正的深度强化学习
  tldr: "针对噪声夜景白平衡，从显著灰像素统计估计起步，以强化学习预测逐图参数，无需推理时参考光源，并提供多传感器夜间数据。"
  note: 另提供 download.sh／download.bat 一键下载脚本。
  weight_labels:
  - NCC 模型（Dropbox）
SAFE:
  title: SAFE：利用可学习色彩空间与场景感知特征调制，实现纯色场景色彩恒常性
  tldr: "针对大面积纯色导致色度线索塌缩，以四 token 场景感知光照表征结合可学习颜色空间归一化，根据场景复杂度重加权估计线索。"
VLM-CC:
  title: 先白平衡、后调整：通过视觉语言评估实现跨相机色彩恒常性
  tldr: "针对跨相机白平衡泛化，先粗校正，再以视觉语言模型感知评估迭代细调，通过轻量适配提供反馈，避免直接回归光源 RGB。"
  note: 采用 Apache-2.0 许可证。
  weight_labels:
  - LoRA 适配器（Hugging Face）
WB Color Space:
  title: 面向照片白平衡编辑的感知启发色彩空间设计
  tldr: "针对白平衡编辑中亮度与颜色纠缠，学习带可调色度映射的感知 HSI 空间，并设计适配的 Mamba 网络，通过表示设计改善校正。"
  weight_labels:
  - models/best.pth（仓库内）
ABC-Former:
  title: ABC-Former：结合交互式通道注意力的辅助双模态跨域白平衡 Transformer
  tldr: "针对白平衡忽略全局颜色趋势，以双模态跨域 Transformer 融合 sRGB、CIELab 和 RGB 直方图信息，通过交互通道注意力传递互补全局线索。"
  note: README 还提供另一个模型文件夹。
  weight_labels:
  - 预训练模型（Google Drive）
Camera-Agnostic WB Pref.:
  title: 学习与相机无关的白平衡偏好
  tldr: "针对跨相机审美白平衡不一致，在相机无关空间学习从中性校正到偏好校正的紧凑后映射，可接在现有 AWB 后用于未见传感器。"
  note: 受许可限制，仅发布灰世界基线部分。
CCMNet:
  title: CCMNet：利用已标定色彩校正矩阵实现跨相机色彩恒常性
  tldr: "针对未知相机光源估计，利用已标定 CCM 将标准光源颜色投影至传感器空间，并通过相机与 CCM 插值增强减少过拟合，实现无需重训的跨相机估计。"
  weight_labels:
  - models/test_*.pth（仓库内，留一法）
GCC:
  title: GCC：通过扩散生成色卡实现生成式色彩恒常性
  tldr: "针对跨相机光源估计，以扩散模型确定性补绘色卡再读取颜色，用拉普拉斯分解保留色卡结构，并以掩码增强处理标注不准。"
  note: README 还提供 Gehler 训练模型和预处理数据集（Hugging Face）。
  weight_labels:
  - NUS-8 训练模型（Hugging Face）
  - 演示（Hugging Face Spaces）
IFFCC:
  title: 积分式快速傅里叶色彩恒常性
  tldr: "针对傅里叶颜色恒常性难处理混合光源，以积分 UV 直方图加速任意区域统计，并行进行傅里叶卷积，高效生成空间平滑光源图。"
Revisiting MIWB:
  title: 重新审视用于多光源白平衡校正的图像融合
  tldr: "针对多光源白平衡线性融合不足，以紧凑 Transformer 建模五种白平衡预设间的空间依赖，并提供一万六千余张带校正参考的多光源图像。"
  weight_labels:
  - weights/（仓库内，每个约 38 KB）
Time-Aware AWB:
  title: 移动摄影中的时间感知自动白平衡
  tldr: "针对轻量手机光源估计，将颜色、时间、位置和拍摄元数据输入约五千参数模型，并采集 3,224 张带上下文元数据的手机图像。"
  note: 相同内容也位于 SamsungLabs/time-aware-awb。
  weight_labels:
  - models/model-awb*.pt（仓库内）
AID:
  title: 用于多光源白平衡的注意力光照分解模型
  tldr: "针对多光源分离，用槽注意力分别表示各光源并预测色度与权重图，以质心匹配损失约束槽激活，再融合空间光照图。"
  note: README 表示因专利原因无法发布代码，仅提供演示。
Dual-Exposure Illuminant:
  title: 优化双曝光 HDR 成像中的光源估计
  tldr: "针对 HDR 曝光互补信息未用于白平衡，提取双曝光特征并接入 MLP 和卷积颜色恒常性估计器，利用已有双曝光观测推断光源。"
NightCC:
  title: NightCC：通过自适应通道掩蔽实现夜间色彩恒常性
  tldr: "针对无标注夜景光源估计，用自适应通道掩码与逐像素光照不确定性约束日到夜域适配，抑制多光源训练中的不可靠伪标签。"
NILUT:
  title: NILUT：用于图像增强的条件神经隐式 3D 查找表
  tldr: "针对多颜色风格 LUT 存储开销，以小型隐式神经函数表示连续三维颜色变换，通过条件控制共享多种风格并连续混合。"
  weight_labels:
  - models/nilutx3style.pt 等（仓库内）
WB LUTs:
  title: WB LUTs：用于白平衡查找表的对比学习
  tldr: "针对高分辨率实时白平衡，以对比学习和难例挖掘训练 3D LUT 校正器，增强紧凑查表预测，避免全分辨率密集网络推理。"
DeNIM:
  title: 通过确定性神经光照映射实现高效自动白平衡校正
  tldr: "针对白平衡校正随分辨率开销增加，学习标准光源及输出校正投影矩阵，以确定性颜色映射处理图像，并兼容已有 AWB 主干。"
  weight_labels:
  - weights.zip（Dropbox）
LLF-LUT:
  title: 当查找表遇见局部拉普拉斯滤波：用于色调映射的金字塔重建网络
  tldr: "针对 HDR 色调映射效率与局部边缘保留，以低分辨率 Transformer 预测逐像素基 LUT 权重，再用学习式局部拉普拉斯滤波细化金字塔高频，减少高分辨率卷积。"
  note: 由于公司政策，NeurIPS 版本未发布，仅发布 TPAMI 版本。
  weight_labels:
  - TPAMI 预训练模型（Google Drive）
  - 镜像（百度网盘，提取码 fegh）
Style-AWB:
  title: 将场景光照建模为风格以校正自动白平衡
  tldr: "针对混合光照白平衡，多头提取光照风格并预测预设白平衡图像的空间融合权重，无需显式光源估计，同时支持单光源与多光源。"
  note: 基于 mixedillWB 框架，在 Afifi 等人的合成混合光源数据集上评估。
  weight_labels:
  - models/download.py（脚本下载，图像块大小 64／128）
AdaInt:
  title: AdaInt：为实时图像增强的 3D 查找表学习自适应间隔
  tldr: "针对 LUT 均匀采样利用率，以可微自适应间隔变换学习三维颜色空间非均匀采样点，可接入已有实时 LUT 增强器。"
  weight_labels:
  - pretrained/AiLUT-*.pth（仓库内）
Enriched Illuminants:
  title: 学习丰富光源分布以实现跨传感器与单传感器色彩恒常性
  tldr: "针对跨传感器光源样本不足，对已白平衡 RAW/sRGB 施加传感器无关随机光源，并用共享主干、阶段专属注意力的级联模型高效学习。"
MIMT:
  title: MIMT：通过局部表面与光源色彩的多任务学习实现多光源色彩恒常性
  tldr: "针对多光源下表面颜色与光照混淆，加入无彩色像素检测和表面相似性辅助任务，并以局部特征保持约束维持光照变化下的表面一致性。"
Mixed-Illuminant AWB:
  title: 混合光源场景的自动白平衡校正
  tldr: "针对空间混合光照无法用单一光源校正，先渲染多种预设白平衡，再学习逐像素融合图，生成局部校正结果。"
  weight_labels:
  - models/WB_model_*.pth（仓库内）
SepLUT:
  title: SepLUT：用于实时图像增强的可分离图像自适应查找表
  tldr: "针对 LUT 存储与颜色表达的权衡，将增强分为分量独立的 1D LUT 和分量相关的 3D LUT，学习图像自适应的可分离级联变换。"
  weight_labels:
  - pretrained/SepLUT-*.pth（仓库内）
C5:
  title: 跨相机卷积色彩恒常性
  tldr: "针对未知传感器光源估计，推理时加入该相机的额外无标注图像进行传导式适配，使颜色特征匹配测试传感器光谱特性。"
  weight_labels:
  - models/C5_m_7_h_64*.pth（仓库内）
CLCC:
  title: CLCC：用于色彩恒常性的对比学习
  tldr: "针对颜色恒常性特征易受外观干扰，以 RAW 颜色增强构建对比样本，学习光源相关表示，提高训练光源稀疏区域的稳健性。"
INTEL-TAU:
  title: INTEL-TAU：色彩恒常性数据集
  tldr: "针对相机和场景泛化评测，发布三款相机的 7,022 张高分辨率图像及光源参考，提供手机颜色阴影校正前后版本并评测已有估计器。"
LSMI:
  title: 用于混合光照白平衡算法开发的大规模多光源数据集 LSMI
  tldr: "针对真实混合光照监督不足，采集 7,486 张多相机多场景图像，通过不同灯光组合差分获得真值，并比较逐像素神经白平衡与图块处理。"
  note: 获取数据集需要提交申请表。
  weight_labels:
  - U-Net 预训练参数（OneDrive）
Multi-color Balance:
  title: 用于色彩恒常性的多色平衡
  tldr: "针对单白点校正无法约束其他颜色，根据多个目标与参考颜色对应计算 n 色变换，准确校正锚点并推广至其他颜色。"
Two-Camera AWB:
  title: 利用双相机信息进行光源估计
  tldr: "针对光源估计的光谱歧义，将两种传感器观测输入小型网络，利用响应差异估计光源，并提供双摄数据与单图重模型比较。"
3D-LUT:
  title: 学习图像自适应 3D 查找表，实现高性能实时照片增强
  tldr: "针对高分辨率增强计算开销，联合学习基 3D LUT 和预测图像相关权重的小型 CNN，以融合查表替代逐像素密集神经处理。"
  weight_labels:
  - pretrained_models/{sRGB,XYZ}（仓库内）
Bag of Color Features:
  title: 用于色彩恒常性的色彩特征袋
  tldr: "针对轻量光源估计，将局部颜色特征池化为词袋并以自注意力重加权，在不依赖全局空间布局的情况下推广统计颜色线索。"
C4:
  title: 级联卷积色彩恒常性
  tldr: "针对跨场景相机光源回归不稳定，以加权乘累加损失训练相关的级联卷积假设，显式进行由粗到细的校正。"
  weight_labels:
  - 预训练模型（OneDrive）
CSRNet:
  title: 用于高效全局图像精修的条件序列调制
  tldr: "针对逐像素独立修图的效率，以全局条件特征调制逐像素 MLP，通过紧凑基础网络和条件网络学习全局颜色与色调操作。"
  weight_labels:
  - experiments/pretrain_models/csrnet.pth（仓库内）
CURL:
  title: CURL：用于全局图像增强的神经曲线层
  tldr: "针对学习增强的可解释性，在 RGB、HSV 和 CIELab 联合预测调整曲线，以多颜色空间损失训练，并与局部多尺度主干结合。"
  weight_labels:
  - pretrained_models/adobe_dpe（仓库内）
Deep WB Editing:
  title: 深度白平衡编辑
  tldr: "针对相机渲染后白平衡难修改，用端到端网络预测室内与室外白平衡结果并映射至全分辨率，在 sRGB 上支持校正和中间色温编辑。"
  weight_labels:
  - PyTorch/models/net*.pth（仓库内）
DeepLPF:
  title: DeepLPF：用于图像增强的深度局部参数化滤镜
  tldr: "针对照片局部调整，以网络回归椭圆、渐变和多项式滤镜参数，再按空间区域应用可解释滤镜，实现局部自动增强。"
  weight_labels:
  - pretrained_models/adobe_dpe（仓库内）
Few-Shot CC (Multi-Domain):
  title: 用于准确、小样本色彩恒常性的多域学习
  tldr: "针对新相机少样本颜色恒常性，共享特征提取器和光源估计器，仅学习相机专属通道重加权，在未知设备上只更新小规模适配参数。"
Interactive WB:
  title: 相机渲染图像的交互式白平衡
  tldr: "针对拍摄后用户白平衡控制，将非线性颜色映射直接联系到用户选择的参考颜色，无需 RAW 即可交互调整相机渲染图像。"
  note: 非深度学习方法；模型为 MATLAB .mat 文件。
  weight_labels:
  - models/model*.mat（仓库内）
Metric-Learning Illuminant:
  title: 基于深度度量学习的端到端光源估计
  tldr: "针对光源特征受场景外观影响，联合训练光源引导三元组网络与回归，聚合照明一致样本，无需额外光源分类阶段。"
Multi-Hypothesis CC:
  title: 色彩恒常性的多假设方法
  tldr: "针对跨相机光源歧义，以候选光源分别校正图像，用相机无关 CNN 评估无彩色似然，再根据后验分布学习最终估计。"
Temporal CC Benchmark:
  title: 时序色彩恒常性基准
  tldr: "针对时序光源估计缺少统一评测，提供 600 段真实手机取景序列、固定划分和时序基线，在共同协议下比较二十余种方法。"
Convolutional Mean:
  title: 卷积均值：用于光源估计的简单卷积神经网络
  tldr: "针对低时延光源估计，以约一千一百参数 CNN 处理 48×32 缩略图，评估无需高分辨率深主干的精度与开销权衡。"
Patch-wise Bright Pixels CC:
  title: 利用图像块级亮像素实现快速色彩恒常性
  tldr: "针对快速免训练光源估计，降采样分块并按各块亮度选取部分最亮像素，再仅对选中观测计算灰世界统计。"
Quasi-Unsupervised CC:
  title: 准无监督色彩恒常性
  tldr: "针对缺少光源标签，从近似白平衡网络图像的灰度版本训练无彩色像素检测 CNN，再据选中像素估计光源，并支持后续监督微调。"
Separate Illuminants:
  title: 学习分离单张图像中的多个光源
  tldr: "针对单图双光源分离，以物理启发网络和损失预测逐像素反射色度，再结合光源分离公式恢复各单光源下的场景外观。"
SIIE:
  title: 面向深度神经网络模型的传感器无关光照估计
  tldr: "针对逐传感器重训白平衡，学习保留 RAW 线性的传感器无关工作空间，先规范化未知相机颜色，再用共享神经光源估计器。"
  note: PyTorch 版本请参阅 README 中的 Colab。
  weight_labels:
  - models/*.mat（仓库内，留一数据集训练）
WB Augmenter:
  title: 还有什么能欺骗深度学习？应对色彩恒常性误差对深度神经网络性能的影响
  tldr: "针对白平衡错误降低识别性能，模拟真实颜色恒常性退化而非普通颜色抖动，比较增强训练与预校正对分类、分割鲁棒性的作用。"
  note: 数据增强工具支持 MATLAB／Python／PyTorch；不需要权重。
WB_sRGB:
  title: 当色彩恒常性出错：校正白平衡不当的图像
  tldr: "针对非线性相机处理后白平衡难恢复，从六万五千余组错误/正确图像对检索近邻并拟合非线性颜色映射，支持未见相机校正。"
  weight_labels:
  - WB_sRGB_Python/models/*.npy（仓库内）
Exposure:
  title: Exposure：白盒照片后处理框架
  tldr: "针对偏好修图缺少前后配对数据，以对抗目标训练强化学习代理选择可解释滤镜和参数，学习参考照片集的风格分布。"
  note: 按 README 说明运行 evaluate.py 即会使用预训练模型。
  weight_labels:
  - exposure_models 发布版本
Meta-Learning CC:
  title: 将相机自适应色彩恒常性建模为小样本元学习问题
  tldr: "针对未知相机快速适配，将光源回归按色温组织为具有物理意义的任务，跨相机元学习后仅需少量目标设备样本微调。"
Semantic WB:
  title: 语义白平衡：利用卷积神经网络实现语义色彩恒常性
  tldr: "针对颜色统计中的光源歧义，将分割语义与颜色、空间信息共同输入 CNN，联合估计光源颜色和伽马参数。"
  note: 第三方 PyTorch 复现。
FC4:
  title: FC4：具有置信度加权池化的全卷积色彩恒常性
  tldr: "针对图像区域提供的光源信息不等，以全卷积网络预测局部光源和置信度，通过置信度加权池化形成全局估计并端到端训练。"
  weight_labels:
  - ColorChecker 预训练模型（GitHub Release）
FFCC:
  title: 快速傅里叶色彩恒常性
  tldr: "针对快速且带不确定性的光源估计，在傅里叶域对周期对数色度直方图定位，预测光源后验，并支持时间平滑和校准训练。"
  note: 提供 MATLAB 训练／调参代码。
HDRNet:
  title: 用于实时图像增强的深度双边学习
  tldr: "针对手机实时近似复杂修图算子，在低分辨率双边网格预测局部仿射系数，再切片应用于全分辨率，从示例编辑学习内容自适应变换。"
  note: google/hdrnet 的 README 仍指向已不在该仓库中的 pretrained_models 文件夹；下载脚本位于 mgharbi/hdrnet。
  weight_labels:
  - 原 TensorFlow 仓库的 pretrained_models/download.py（脚本从 MIT CSAIL 下载）
Recurrent CC:
  title: 循环色彩恒常性
  tldr: "针对光源估计未利用取景历史，以卷积 LSTM 和模拟序列训练 RCC-Net，联合学习时空线索并与单帧及时序基线比较。"
Unsupervised CC:
  title: 用于色彩恒常性的无监督学习
  tldr: "针对缺少标定光源标签，先近似训练图像未知光照再学习估计器参数，并扩展为利用未标定图像进行跨传感器迁移。"
Structured-Output CC:
  title: 用于计算色彩恒常性的深度结构化输出回归学习
  tldr: "针对光源颜色分量存在相关性，将 CNN 特征学习与结构化多输出回归结合，学习颜色维度间依赖，避免将各分量独立预测。"
CCC:
  title: 卷积色彩恒常性
  tldr: "针对光源估计欠约束，将其转为二维对数色度定位，训练判别卷积模型区分正确与错误白平衡假设。"
Chroma from Luminance CC:
  title: 通过学习从亮度预测色度实现色彩恒常性
  tldr: "针对轻量且不依赖空间语义的光源估计，学习以像素亮度为条件的自然图像色度似然，并端到端优化统计以降低场景光源误差。"
CNN CC (Bianco):
  title: 利用卷积神经网络实现色彩恒常性
  tldr: "针对光源估计依赖手工特征，以卷积、最大池化和回归输出构成浅层图块 CNN，联合学习空间颜色特征与光照预测，并探索局部光源估计。"
  note: 第三方复现。
Modular Neural ISP:
  title: 模块化神经图像信号处理
  tldr: "针对整体式神经 ISP 难以控制中间过程的问题，将去噪、颜色处理、照片风格处理和上采样拆成可替换学习模块，支持更换风格模块与交互编辑，并可从 RAW 反复重新渲染。"
  note: 官方仓库宣布论文已被 SIGGRAPH Asia 2026 录用（核验日期：2026-10-28）；提供独立编辑图形界面。
  weight_labels:
  - denoising/models/*.pth（lite/base/large）
  - photofinishing/models/*.pth（多种风格）
ParamISP:
  title: ParamISP：利用相机参数学习正向与逆向 ISP
  tldr: "针对 ISP 映射随 ISO、曝光等拍摄参数变化的问题，ParamNet 将 EXIF 参数编码为控制特征，调制正向和逆向 ISP 网络，支持参数感知重建、RAW 域处理和跨相机外观迁移。"
  weight_labels:
  - 官方权重（Google Drive，逆向与正向）
Uni-ISP:
  title: Uni-ISP：迈向多移动相机 ISP 的统一学习
  tldr: "针对每款相机单独训练 ISP 难以扩展的问题，以设备嵌入为条件联合学习正向和逆向映射；发布多手机同步采集的 FiveCam RAW–sRGB 数据，并评估新设备适配与跨相机渲染。"
MetaISP:
  title: MetaISP：利用全局场景结构实现准确的多设备色彩渲染
  tldr: "针对神经 ISP 忽略不同手机语义感知颜色风格的问题，采用受交叉协方差启发的注意力提取全局语义，并以目标设备元数据控制渲染；缺少光源信息时进行估计，实现单模型多设备颜色重现。"
  weight_labels:
  - MetaISPNet 权重（Google Drive）
CtrlISP:
  title: CtrlISP：通过可控神经 ISP 挽救低光 RAW 图像
  tldr: "针对极低光增强输出固定、用户难以调节的问题，串联可微 ISP 模块：DenoiseNet 通过空间交互与引导处理暗电流阴影噪声，ColorNet 预测颜色渲染参数，使亮度与风格可调。"
JD3Net:
  title: 利用空间下采样各向同性网络实现高效深度去马赛克
  tldr: "针对去马赛克计算成本，先进行空间降采样，再用数学架构设计的各向同性全卷积网络处理，评估降采样对去马赛克和联合去噪效率及质量的影响。"
Pixel-bin Unified Demosaic:
  title: 面向像素合并图像传感器去马赛克的可扩展轻量统一架构
  tldr: "针对每种像素合并 CFA 需独立网络的问题，设计模块化轻量统一去马赛克架构，并以无需训练的 CFA 识别模块检测输入图案，支持扩展到 Quad、Nona 等传感器。"
R3 Bayer Deraining:
  title: R3：重建、RAW 与雨——直接在 Bayer 域去雨
  tldr: "针对 ISP 颜色混合、裁剪和细节损失妨碍去雨的问题，先在 Bayer 域复原再渲染，并提供比特深度匹配的 RAW/sRGB 雨景基准与颜色不变的信息守恒评估指标。"
SegDem:
  title: SegDem：让分割帮助去马赛克
  tldr: "针对去马赛克缺少显式场景结构信息的问题，以实例分割预训练区域和边界表征，再将解码器迁移至 RAW 重建，在 CNN、Transformer 和状态空间主干及多种 CFA 上验证。"
Smartphone RAW Degradation:
  title: 面向真实智能手机超分辨率的 RAW 域退化模型
  tldr: "针对 RAW 超分辨率合成退化不真实的问题，标定设备专属模糊与噪声，并将已渲染图像逆处理为手机 RAW，训练马赛克域超分辨率后在未参与训练的设备实拍图像上评测。"
Structural Guidance JDD:
  title: 结构引导的统一联合去马赛克与去噪
  tldr: "针对稀疏含噪 CFA 缺少结构监督的问题，将马赛克、CFA 掩码和噪声水平统一输入，经可训练适配器对齐预训练结构编码器的域，再残差融合结构与复原特征。"
ASRD:
  title: 通过基于小波的循环重建学习任意尺度 RAW 图像下采样
  tldr: "针对任意倍率 RAW 缩小的结构纹理损失，以小波低频缩放和高频预测模块进行递归重建，加入高频能量约束，并提供非整数倍率 Real-NIRD 实拍基准。"
  note: 代码即将发布。
BMTNet:
  title: 用于轻量 Quad Bayer HybridEVS 去马赛克的二值化 Mamba-Transformer
  tldr: "针对 Quad Bayer HybridEVS 去马赛克开销，结合二值 Mamba 投影与 Swin Transformer，同时保留全精度选择性扫描，以较低计算成本建模全局和局部关系。"
  weight_labels:
  - 预训练模型（Google Drive）
Camera-Specific RAW SR Sim:
  title: 面向 RAW 域图像超分辨率的相机特定成像模拟
  tldr: "针对相机专用 RAW 超分训练对难采集，以子图分解加速物理模拟；LatentKAN 结合阶段监督迭代特征融合及可学习 Kolmogorov–Arnold 激活，缓解频谱偏置。"
DSDNet:
  title: DSDNet：通过双色彩空间协同进行 RAW 域去摩尔纹
  tldr: "针对去摩尔纹与颜色保真冲突的问题，以动态调制协同注意力融合 RAW 和 YCbCr 双流，并用亮度–色度自适应 Transformer 解耦两类表征，分别约束亮度与颜色。"
  weight_labels:
  - 预训练模型（Google Drive）
  - 镜像（百度网盘，提取码 ewnv）
FrENet:
  title: 利用自适应频率调制高效去除 RAW 图像模糊
  tldr: "针对 RAW 去模糊效率与频率选择问题，在频域处理特征，并根据频谱位置自适应调制不同分量，完成 RAW-to-RAW 复原，也验证对 sRGB 去模糊的扩展。"
  note: README 要求将预训练模型放入 checkpoints，但未提供下载链接。
QB HybridEVS SSM:
  title: 通过状态空间增强交叉注意力实现轻量 Quad Bayer HybridEVS 去马赛克
  tldr: "针对 HybridEVS 事件像素缺失与去马赛克耦合的问题，TSANet 先补全再重建颜色，以 Cross-Swin State Block 结合位置先验、交叉注意力和线性复杂度状态空间建模。"
QRNet:
  title: 对双曝光 Quad-Bayer 图案建模以联合去噪与去模糊
  tldr: "针对短曝光噪声与长曝光模糊的权衡，建立双曝光 Quad Bayer 物理采集模型并训练分层 CNN，以 B2QB 从 Bayer 合成训练观测，联合去噪与去模糊。"
  note: D2 数据集约 43.5 GB，百度网盘提取码 0fbf。
  weight_labels:
  - QRNet 预训练模型（百度网盘，提取码 l5nw）
Quad/Nona JDD:
  title: 考察单 Bayer、Quad-Bayer 与 Nona-Bayer 图案的联合去马赛克与去噪
  tldr: "针对不同 CFA 联合复原缺乏统一比较的问题，系统评测 Single、Quad 和 Nona Bayer，并设计兼顾坏点校正的 maskout 训练，采集 638 张具有挑战场景的 RAW 数据。"
  weight_labels:
  - PyTorch/models/iso{400..3200}.pth（仓库内）
RAW Reflection Removal:
  title: 从 RAW 照片中去除反射
  tldr: "针对真实反射分离的歧义，以光度和几何准确的 RAW 混合合成数据训练，并可加入反向视角照片作为上下文；低分辨率分离模型结合学习式上采样恢复完整分辨率。"
RawNIND:
  title: 从 RAW 自然图像噪声数据集学习联合去噪、去马赛克与压缩
  tldr: "针对去噪跨传感器和渲染风格泛化的问题，发布自然 RAW 配对数据并比较 Bayer 与线性 RGB 复原；联合学习 RAW 去噪与压缩，提高率失真效率并保留后续处理空间。"
  note: 权重采用 GPL3 与 CC-BY-4.0 双重许可。
  weight_labels:
  - 预训练模型（Google Drive）
RDDM:
  title: RDDM：将 RAW 域扩散模型用于真实世界图像复原
  tldr: "针对 RAW 分布与预训练扩散域不一致的问题，设计 RAW VAE 编码并解码到增强线性图像，以可配置多 Bayer LoRA 适配 CFA，结合可扩展合成流程构建训练对。"
  note: 仓库目前仅包含 README 与图片。
Train on RAW & HDR:
  title: 在 RAW 与 HDR 图像上训练复原神经网络
  tldr: "针对 RAW/HDR 网络应在线性域还是显示编码域训练的问题，在去噪、去模糊和超分辨率中比较线性损失与 PQ、PU21、μ-law 编码，分析感知均匀表示对学习的影响。"
BSRAW:
  title: BSRAW：改进盲 RAW 图像超分辨率
  tldr: "针对真实 RAW 盲超分辨率的退化失配，在 ISP 非线性处理前模拟传感器噪声、失焦和曝光等退化，训练 RAW 模型，并提供 DSLM 实拍评测数据。"
  note: 代码与退化工具位于 mv-lab/AISP 的 imresutils 中。
Combine DM & DN:
  title: 如何最佳结合去马赛克与去噪？
  tldr: "针对去噪与去马赛克顺序选择，分析插值后噪声统计并比较低复杂度管线；中等噪声采用适配后的后级去噪，高噪声则先部分去噪、去马赛克后再次去噪。"
DemosaicFormer:
  title: DemosaicFormer：面向 HybridEVS 相机的由粗到细去马赛克网络
  tldr: "针对 HybridEVS 颜色重建与缺陷像素问题，采用粗去马赛克和像素校正两阶段结构，并以多尺度门控模块交换跨分辨率特征，完成由粗到细的重建。"
  weight_labels:
  - 模型（Google Drive）
DREUDC:
  title: 用于屏下相机 RAW 图像复原的面板特定退化表征
  tldr: "针对不同屏下 OLED 面板造成的退化差异，以无监督三元组损失学习面板隐式表征，再作为先验指导轻量复原 Transformer，并采集对齐的真实传感器级屏下图像。"
  weight_labels:
  - 数据集与预训练模型（Google Drive）
Efficient Blind RAW Restoration:
  title: 迈向高效深度盲 RAW 图像复原
  tldr: "针对跨相机盲复原的退化泛化问题，在 RAW 域模拟传感器噪声、运动模糊与相机抖动，以多传感器数据训练，在非线性 ISP 处理前恢复细节。"
RBSFormer:
  title: RBSFormer：用于 RAW 图像超分辨率的增强 Transformer 网络
  tldr: "针对 sRGB 域复杂 ISP 退化影响超分辨率的问题，使用增强交叉协方差注意力与门控前馈模块构建 RAW Transformer，结合 RAW 增强和混合集成改善重建。"
RRID:
  title: RAW 与 sRGB 域的图像去摩尔纹
  tldr: "针对单域去摩尔纹信息不足的问题，结合 RAW 与 sRGB，以跳连中的门控反馈和频率选择模块分别处理特征，再用 RGB 引导神经 ISP 恢复设备相关颜色。"
  weight_labels:
  - 预训练模型（Dropbox）
Inheriting Bayer's Legacy:
  title: 继承 Bayer 的传统：Quad Bayer 图像传感器的联合重马赛克与去噪
  tldr: "针对 Quad Bayer 难以复用标准 Bayer ISP 的问题，以双头网络联合重马赛克与去噪，结合 Swin 与小波处理，并通过摩尔纹和拉链伪影难例后训练改善困难区域。"
JDD Double DIP:
  title: 利用双深度图像先验联合去马赛克与去噪
  tldr: "针对缺少外部训练数据的联合去噪去马赛克，直接在单张 RAW 观测上优化两个深度图像先验网络，并评估不同噪声类型和强度下的重建能力。"
JDD Two-stage:
  title: 联合去马赛克与去噪受益于两阶段训练策略
  tldr: "针对 CFA 观测保留与联合训练稳定性，先在无噪声数据上训练传统插值加残差 CNN 的去马赛克器，再训练第二个 CNN 去除插值噪声，并与端到端联合学习比较。"
  weight_labels:
  - Demosaic/{lightweight,normal}.pkl 与 Denoise/（仓库内）
Moiré-Free Demosaick:
  title: 迈向无摩尔纹且保留细节的去马赛克
  tldr: "针对摩尔纹抑制与细节保留的冲突，解耦光谱和空间特征聚合，加强颜色维度的全局交互并保留局部空间对比，用于去马赛克及联合去噪。"
RAW Rain Removal:
  title: 利用 RAW 图像端到端去除雨纹
  tldr: "针对先 ISP 后去雨造成的信息损失，联合学习 RAW 处理和雨纹去除，在 RAW 空间合成雨纹训练对，并检验跨相机与不同渲染管线的泛化。"
SDAT:
  title: SDAT：通过子数据集交替训练改进图像去马赛克
  tldr: "针对去马赛克训练的数据偏置，将数据划分为具有不同偏置的子集并交替优化，在不修改架构的情况下验证对多种重建主干的改善。"
Unified Demosaicing (KD):
  title: 面向 Bayer 与非 Bayer 图案传感器的高效统一去马赛克
  tldr: "针对 Bayer 与非 Bayer 传感器模型重复的问题，KLAP 仅适配少量 CFA 专属滤波器，其推理期元学习版本进一步处理真实传感器中的未知伪影。"
VD_raw:
  title: 通过通道与空间调制去除重拍屏幕 RAW 图像和视频中的摩尔纹
  tldr: "针对 RAW 各颜色通道摩尔纹特性不同的问题，通过通道和空间调制融合颜色分离与混合分支，并提供对齐 RAW 视频数据及交替图案辅助的时间配准方法。"
  weight_labels:
  - 完整模型（百度网盘，提取码 f5g4）
  - 基线模型检查点（仓库内）
CDLNet:
  title: CDLNet：用于盲去噪与去马赛克的噪声自适应卷积字典学习网络
  tldr: "针对去噪网络可解释性与噪声适配问题，将卷积字典学习迭代展开为可训练网络，用于去噪及联合去马赛克，并评估不同模型规模与无监督训练。"
  weight_labels:
  - trained_nets/{CDLNet-s2030, JDD_CDLNet-s0120}（仓库内）
RSTCANet:
  title: 用于图像去马赛克的残差 Swin Transformer 通道注意力网络
  tldr: "针对去马赛克中空间依赖与通道交互的联合建模，堆叠残差 Swin Transformer 块并在相邻块间加入通道注意力，以紧凑网络重建缺失颜色。"
  weight_labels:
  - dm_model_zoo/RSTCANet_{B,S,L}.pth（仓库内）
TENet:
  title: 重新思考基于学习的去马赛克、去噪与超分辨率管线
  tldr: "针对去噪、去马赛克与超分辨率顺序不清的问题，比较不同管线，并以可移除任务头施加中间监督，支持 DN→SR→DM 顺序，发布 PixelShift200 评测数据。"
  note: README 提供 PixelShift200 与 DIV2K 数据链接。
BJDD / PIPNet:
  title: 超越联合去马赛克与去噪：面向像素合并图像传感器的处理管线
  tldr: "针对含噪像素合并传感器的重建问题，结合深度和空间注意力及感知损失完成联合去噪去马赛克，并扩展为手机图像重建与增强管线。"
  weight_labels:
  - Quad-Bayer 权重（Google Drive）
  - Bayer 权重（Google Drive）
ISP-Agnostic UDC:
  title: 面向屏下相机的 ISP 无关图像重建
  tldr: "针对屏下复原与设备渲染风格耦合的问题，在传统 ISP 前恢复 RAW，保留后续渲染自由度，并以 HDR 显示器采集与增强流程获得多样高反差真实数据。"
JDD in the Wild:
  title: 真实环境中的联合去马赛克与去噪：在真值不确定时训练
  tldr: "针对干净真值本身有误差的问题，以两阶段概率退化和共轭先验描述不确定性，通过 ELBO 训练联合复原网络，并以弱先验微调适配分布外输入。"
JDNDMSR:
  title: 用于联合图像去马赛克、去噪与超分辨率的端到端学习
  tldr: "针对去噪、去马赛克与超分辨率分步处理的误差累积，以单个 CNN 联合学习三项任务，比较不同任务组合和损失，并验证平均绝对误差监督的作用。"
  weight_labels:
  - models/jdndmsr+_model.h5 等（仓库内）
Joint DM + HDR:
  title: 单次拍摄中的深度联合去马赛克与高动态范围成像
  tldr: "针对空间变化曝光中颜色稀疏及像素过欠曝的问题，以空间变化卷积处理 Bayer 结构，通过曝光引导抑制无效观测，联合优化单次拍摄 HDR 与去马赛克。"
Jointly Deblur-Demosaick-Denoise:
  title: 学习联合去除 RAW 图像模糊、马赛克与噪声
  tldr: "针对已知模糊下分步处理产生伪影的问题，设计可解释的联合去马赛克去模糊模块，以真实逆 ISP 生成 RAW 训练，并校正实拍相机颜色相关点扩散模糊。"
SAGAN (Nona-Bayer):
  title: SAGAN：用于带噪 Nona-Bayer 重建的对抗空间非对称注意力
  tldr: "针对 Nona-Bayer 重建伪影，利用空间非对称注意力学习双向变换和大核全局上下文，并结合对抗学习联合去噪与全彩重建。"
DM-or-DN First:
  title: 重访一个老难题：先去马赛克还是先去噪？
  tldr: "针对去马赛克与去噪顺序争议，系统回顾并评测含噪马赛克管线，分析插值后噪声，说明先去马赛克时传统去噪器需要的统计适配。"
JDSR:
  title: 联合去马赛克与超分辨率：网络设计与感知优化
  tldr: "针对 CFA 联合重建与放大的感知质量，结合预去马赛克网络及残差密集压缩激励模块，以相对判别器和预激励感知损失改善纹理区域。"
Raw Image Deblurring:
  title: RAW 图像去模糊
  tldr: "针对非线性渲染前去模糊的研究缺口，建立 RAW/已处理图像配对的 Deblur-RAW 数据及 RAW 复原网络，并检验跨传感器迁移和现有模型使用 RAW 训练的收益。"
SGNet (JDD):
  title: 利用自引导进行联合去马赛克与去噪
  tldr: "针对 Bayer 绿色采样更密的结构，先恢复绿色再引导其他缺失颜色，并以密度图引导适应不同空间频率，扩展到联合去噪去马赛克及超分辨率。"
  note: 仓库 README 仅有待办事项，代码尚未发布。
Deep Demosaicing for Edge:
  title: 面向边缘部署的深度去马赛克
  tldr: "针对边缘设备去马赛克开销与拉链、伪色问题，设计紧凑深度重建模型并分析伪影形成，评估重建精度和计算需求的权衡。"
JDD Burst Fine-tune:
  title: 通过微调 RAW 连拍图像联合去马赛克与去噪
  tldr: "针对合成训练与真实传感器噪声的差距，直接从马赛克连拍学习联合去噪去马赛克，无需 RGB 真值，并通过连拍专属自监督微调适配当前拍摄。"
Real Scene SR with Raw:
  title: 迈向利用 RAW 图像的真实场景超分辨率
  tldr: "针对真实超分辨率退化失配与辐射信息损失，模拟相机成像生成训练数据，以双 CNN 利用 RAW，再用空间变化颜色变换校正超分辨率输出。"
  note: 仓库包含 TPAMI 2021 扩展版代码。README 中 ×2／×4 模型文件夹的 Google Drive 链接返回 404（核验日期：2026-10-11）。
Zoom to Learn:
  title: 通过变焦学习，学习如何变焦
  tldr: "针对真实数字变焦缺少高分辨率参考和轻微错位问题，以光学变焦采集 SR-RAW 图像对，并设计上下文双边 CoBi 损失训练对小位移鲁棒的深度超分模型。"
  note: README 提供 SR-RAW 数据集（Google Drive／百度网盘，提取码 wi02）和快速推理说明。
DMCNN:
  title: 学习用于去马赛克的深度卷积网络
  tldr: "针对不同 CFA 布局重建难统一的问题，训练深层 CNN 去马赛克并联合优化 CFA 设计与重建，进一步评测空间变化曝光和颜色条件下的单次 HDR 成像。"
Kokkinos Demosaick:
  title: 利用级联卷积残差去噪网络进行深度图像去马赛克
  tldr: "针对联合复原的可解释性与训练数据需求，将正则化优化过程展开为级联卷积残差去噪器，在保留显式迭代去马赛克结构的同时学习图像先验。"
Residual JDSR:
  title: 用于联合去马赛克与超分辨率的深度残差网络
  tldr: "针对放大过程加重去马赛克伪影的问题，以残差 CNN 直接从低分辨率 Bayer 重建高分辨率 RGB，一步联合恢复缺失颜色与空间细节。"
  note: 第三方 PyTorch 复现。
  weight_labels:
  - 第三方复现权重（百度网盘）
DemosaicNet:
  title: 深度联合去马赛克与去噪
  tldr: "针对联合去噪去马赛克的困难纹理与噪声，通过大规模难例挖掘训练卷积重建模型，直接处理含噪马赛克，并支持 Bayer 和 X-Trans 图案。"
  note: PyTorch 版本未实现噪声感知模型；请参考较早的 Caffe 仓库 mgharbi/demosaicnet_caffe。
2-Shots in the Dark:
  title: 2-Shots in the Dark：以最少数据采集实现低光去噪
  tldr: "针对相机专用去噪训练数据采集昂贵的问题，每个 ISO 仅需一张噪声图和一张暗帧；以泊松分布模拟散粒噪声，以傅里叶域频谱采样保留信号无关噪声的空间与统计结构，合成去噪训练数据。"
  weight_labels:
  - SID/ELD、LRID 模型与暗场资源（Google Drive）
Color-Blind LL Cameras:
  title: 为什么低光相机会色盲：消除 RAW 去噪中的色彩偏差
  tldr: "针对盲低光去噪跨相机时的严重偏色，分析黑电平误差造成的颜色偏置，并以网络从噪声输入估计全局黑电平偏差，减少对相机专用标定的依赖。"
GALOSH:
  title: GALOSH：通过适合并行计算的局部收缩，对 RAW Bayer 与 sRGB 图像进行免训练盲去噪
  tldr: "针对学习式去噪的数据需求与非局部搜索开销，逐图估计泊松–高斯噪声，经广义 Anscombe 稳定化后对亮度作局部 Walsh–Hadamard 收缩，再进行亮度引导的色度回归，支持并行与定点实现。"
  note: 无需训练，也没有网络权重；Releases 提供 Windows 可执行程序。
Nonlocal MatchFilter:
  title: 用于 RAW 图像去噪的可学习非局部特征匹配与滤波
  tldr: "针对 RAW 去噪中自相似先验与深度特征的结合问题，在多尺度学习特征上执行邻域匹配、协同滤波和聚合，将经典非局部图块去噪流程转为可训练网络模块。"
  weight_labels:
  - GitHub Releases（含权重）
PNNP:
  title: 从暗场帧学习物理知识引导的噪声模型，用于低光 RAW 图像去噪
  tldr: "针对噪声建模依赖干净/噪声配对数据的问题，从暗帧训练物理信息神经代理，结合物理引导噪声解耦、物理感知代理模型和可微分布损失，并发布 LRID 数据集。"
  note: 提供索尼 A7S2 与 IMX686 的 PNNP 权重；PNNP 本身的训练代码未开源。
  weight_labels:
  - 模型检查点与资源（百度网盘，提取码 vmcl）
  - LRID 数据集（Hugging Face）
RPG-VST:
  title: RPG-VST：用于盲 RAW 去噪的鲁棒泊松-高斯方差稳定化
  tldr: "针对异常观测使盲噪声标定不稳定，逐 CFA 平面以带物理约束的 Student-t 对数方差拟合泊松–高斯参数，再按稳定化噪声可靠性选择鲁棒或最小二乘拟合，接入冻结去噪器。"
Noise Modeling in One Hour:
  title: 一小时噪声建模：最小化自监督低光 RAW 去噪的准备工作
  tldr: "针对相机噪声合成的标定与采样准备繁琐的问题，通过噪声性质分析省去显式系统增益标定和信号无关噪声建档，构建去噪训练数据，将准备时间由数天缩短至数小时。"
  weight_labels:
  - 预训练模型检查点（Google Drive）
YOND:
  title: YOND：摆脱相机专属数据依赖的实用盲 RAW 图像去噪
  tldr: "针对未知相机去噪依赖专用数据的问题，结合由粗到细噪声估计、期望匹配方差稳定变换和 SNR 引导网络，校正稳定化偏差，并支持自动适配与手动调节去噪强度。"
  weight_labels:
  - SNR-Net 权重与训练数据（百度网盘，提取码 nn4v）
  - 在线演示（Hugging Face Spaces）
DualDn:
  title: DualDn：通过可微 ISP 实现双域去噪
  tldr: "针对 RAW 细节保留与 sRGB 感知质量难兼顾的问题，以可微 ISP 连接 RAW 和 sRGB 两级去噪器并联合训练，同时提供真实采集的相机无关去噪数据集。"
  note: 两个模型都采用 Restormer 主干，在 MIT-Adobe FiveK 上训练；README 表格还提供测试集和可视化结果。
  weight_labels:
  - pretrained_model.zip，合成数据测试（OneDrive）
  - DualDn_Big.pth，真实拍摄数据／DND（OneDrive）
Non-parametric Noise:
  title: 非参数传感器噪声建模与合成
  tldr: "针对参数分布难完整描述传感器噪声，直接从拍摄数据估计逐强度概率质量函数并在 ISO 间插值，还支持仅有噪声图像时追加合成噪声。"
SeNM-VAE:
  title: SeNM-VAE：利用层次化变分自编码器进行半监督噪声建模
  tldr: "针对有限配对数据的噪声学习，以变分图模型描述干净与退化图像的条件分布，用联合目标整合配对和非配对样本，合成去噪及超分辨率训练对。"
Contrastive LL Denoise:
  title: 用于低光 RAW 去噪的对比学习
  tldr: "针对极暗噪声下高频细节易丢失的问题，设计去噪对比正则，使复原特征靠近干净图像、远离噪声输入，并用 Wnet 特征嵌入网络提取高频信息。"
LED:
  title: "让显式标定隐式化：标定去噪器而非噪声模型"
  tldr: "针对传感器噪声显式标定耗时且跨相机迁移困难的问题，先在虚拟相机上预训练，再以少量真实图像对微调、隐式标定去噪器，并通过结构调整缩短信号合成与真实噪声的差距。"
  note: 自 2025 年 12 月起还包含 UltraLED 代码与数据。
  weight_labels:
  - 模型库（Google Drive）
  - 相关文件（百度网盘，提取码 iay5）
  - 按相机／方法整理的权重表
LLD (Physics-Guided ISO Noise):
  title: 面向极低光摄影的物理引导、ISO 相关传感器噪声建模
  tldr: "针对不同 ISO 下复杂传感器噪声难以统一建模的问题，以各类物理噪声源和 ISO 依赖性约束归一化流组件，并采集配对图像、平场与偏置帧，用于噪声学习与去噪评测。"
  note: 仓库主要用于发布数据集。
LRD:
  title: 迈向通用低光 RAW 噪声合成与建模
  tldr: "针对简单分布难以描述信号无关噪声的问题，结合物理散粒噪声模型与学习式生成噪声模型，并以多尺度傅里叶 Transformer 判别器约束噪声分布，发布 LRD 用于跨传感器评测。"
  note: 噪声合成模型因商业许可限制未发布。
  weight_labels:
  - RAW 去噪模型（Google Drive）
  - 镜像（百度网盘，提取码 ujzm）
ELMformer:
  title: ELMformer：利用局部乘性 Transformer 高效复原 RAW 图像
  tldr: "针对单通道 RAW 的颜色结构与高效复原需求，提出 ELMformer Transformer：以双向融合投影结合空间与颜色信息，以局部乘性自注意力传递相关特征，同时用于去噪和去模糊。"
  note: 仓库仅包含 README。
Noise2NoiseFlow:
  title: Noise2NoiseFlow：无需干净图像的真实相机噪声建模
  tldr: "针对真实噪声建模缺少干净参考的问题，仅用噪声图像对联合训练 Noise Flow 归一化流和去噪器，支持弱监督噪声合成与复原，避免依赖干净/噪声配对真值。"
PMN:
  title: 增强低光 RAW 去噪的可学习性：真实配对数据与噪声建模的结合
  tldr: "针对真实配对数据量少、噪声分布复杂导致难学的问题，解耦噪声后进行散粒噪声增强和暗电流阴影校正，同时扩充训练变化、降低去噪映射复杂度。"
  note: README 提供 ISO 噪声参数与数据；预训练权重在后续 PNNP／LRID 版本中发布。
Pseudo-ISP:
  title: Pseudo-ISP：从彩色图像去噪器学习伪相机内信号处理管线
  tldr: "针对 sRGB 去噪器遇到新传感器或 ISP 时的噪声失配，从噪声输入和伪干净输出学习伪 ISP 与 RAW 噪声模型，再利用非配对干净图像交替进行合成数据生成与去噪器适配。"
  weight_labels:
  - 预训练去噪模型（百度网盘，提取码 6aj4）
Rethinking Noise Synthesis:
  title: 重新思考 RAW 去噪中的噪声合成与建模
  tldr: "针对传感器参数噪声模型不准确的问题，直接从真实传感器噪声采样，以图案对齐的图块采样保留空间相关性，以高比特重建补足量化掩盖的变化，合成真实 RAW 噪声。"
  weight_labels:
  - 预训练模型（百度网盘，提取码 v4dh）
CA-NoiseGAN:
  title: 学习相机感知的噪声模型
  tldr: "针对固定统计分布难以覆盖真实传感器噪声的问题，从实测数据训练相机感知 GAN 噪声模型，用单一生成模型表达多相机和增益设置下的不同噪声特性。"
  note: README 中模型检查点文件夹的 Google Drive 链接返回 404（核验日期：2026-10-11）。
ELD:
  title: 用于极低光 RAW 去噪的基于物理的噪声形成模型
  tldr: "针对极低光合成训练忽略相机电子噪声的问题，建立包含散粒、长尾读出、行和量化噪声的 CMOS 模型及可复现标定流程，并发布多相机数据集检验合成噪声到真实拍摄的泛化。"
  note: TPAMI 2021 扩展版的 arXiv 编号为 2108.02158；亦可通过 Vandermode/NoiseModel 仓库访问。
  weight_labels:
  - ELD 数据与预训练模型（Google Drive）
  - 镜像（百度网盘，提取码 0lby）
MWRCANet:
  title: "NTIRE 2020 真实图像去噪挑战：数据集、方法与结果"
  tldr: "针对真实 Bayer 噪声，结合多级小波分解与残差通道注意力聚合复原特征；所链接 NTIRE 2020 报告记载该 RAW 赛道方案及 SIDD+ 评测协议。"
  weight_labels:
  - RAW 模型 dn_mwrcanet_raw_c1.pth（Google Drive）
  - 镜像（百度网盘，提取码 0odp）
PMRID:
  title: 移动设备上的实用深度 RAW 图像去噪
  tldr: "针对多 ISO RAW 去噪网络难以轻量部署的问题，以标定的传感器噪声合成训练数据，并用 k-Sigma 变换统一不同增益下的噪声变化，使紧凑网络覆盖较大 ISO 范围并报告手机时延。"
  weight_labels:
  - models/torch_pretrained.ckp + mge_pretrained.ckp（仓库内）
  - 基准数据（Kaggle 镜像；README 还列有 OneDrive）
Bayer Unify Aug:
  title: 通过 Bayer 图案统一化与 Bayer 保持增强学习 RAW 图像去噪
  tldr: "针对不同 Bayer 图案难以混合训练、RGB 增强操作会破坏 CFA 的问题，结合 BayerUnify 图案统一和 Bayer 保持增强，再训练改进 U-Net，支持异构 RAW 数据的联合去噪学习。"
  note: 仓库仅包含 BayerUnify/Aug 工具函数。
NODE:
  title: NODE：利用噪声分解网络进行极低光 RAW 图像去噪
  tldr: "针对极低光下坏点、读出和散粒噪声共同放大的问题，以多任务 RAW 域网络显式分别估计坏点噪声、Gaussian 读出噪声与 Poisson 散粒噪声，再重建干净图像。"
Noise Flow:
  title: Noise Flow：利用条件归一化流进行噪声建模
  tldr: "针对 Gaussian 近似无法充分表达真实噪声的问题，将条件归一化流与信号相关物理噪声组件结合，用紧凑模型学习以相机和增益为条件的分布，支持噪声密度估计与采样。"
  note: 自动下载 SIDD_Medium_Raw；未找到单独的权重链接。
SIDD:
  title: 面向智能手机相机的高质量去噪数据集
  tldr: "针对手机真实去噪缺少可靠参考图像的问题，设计系统性的干净真值估计流程，从五款手机、十个场景采集约三万张噪声图像，提供 RAW/sRGB 去噪数据与评测基准。"
  note: 仓库包含真值估计代码；数据集位于 SIDD 网站。
DRIFT:
  title: DRIFT：深度复原、ISP 融合与色调映射
  tldr: "针对手机多帧复原与色调渲染的联合需求，以感知对抗损失训练 MFP 网络完成配准、去噪、去马赛克和超分辨率，再由独立色调映射网络提供可调且与参考管线一致的高分辨率输出。"
NPR Color Bias:
  title: 超越像素保真度：最小化夜间摄影渲染中的感知失真与色彩偏差
  tldr: "针对夜景高反差下的偏色与感知失真，提出 pHVI-ISPNet：结合 HVI 色彩空间、RAW 特征处理与小波特征传播，并采用随曝光变化的损失权重和特征分布损失，兼顾细节恢复与颜色恒常性。"
RPBA-Net:
  title: RPBA-Net：用于 RAW 域 ISP 增强的可解释残差金字塔双边仿射网络
  tldr: "针对 RAW 增强中模块割裂、映射难解释和部署开销的问题，预测恒等映射引导的残差仿射校正与金字塔双边网格，通过引导驱动的自适应切片和跨尺度融合，联合恢复颜色、全局色调与局部纹理。"
VAR-ISP:
  title: 用于 RAW 到 sRGB 图像信号处理的视觉自回归先验
  tldr: "针对配准不准与元数据缺失的 RAW-to-sRGB 重建，将冻结的视觉自回归模型适配为 RAW 条件的逐尺度预测器，并以小波分解的颜色损失分别约束低频色调和色度边缘，用少量可训练参数利用生成先验。"
EGUOT-ISP:
  title: 专家引导的非平衡最优传输：利用非配对及配对数据学习 ISP
  tldr: "针对成对 RAW–sRGB 数据采集昂贵的问题，以非平衡最优传输训练现有 ISP 架构，并用颜色、结构和频域专家判别器提供针对性约束；同时支持配对与非配对训练，降低目标域异常样本的影响。"
  note: 仓库目前仅包含 README。
EvRAW:
  title: EvRAW：事件引导的结构与色彩建模，用于 RAW 到 sRGB 图像重建
  tldr: "针对动态 RAW-to-sRGB 的运动模糊与偏色，以事件运动线索增强结构，通过区域伽马校正和通道颜色解码恢复颜色，并采集像素对齐 RAW/事件数据。"
ISPDiffuser:
  title: ISPDiffuser：利用纹理感知扩散模型与直方图引导的色彩一致性学习 RAW 到 sRGB 映射
  tldr: "针对细节重建与颜色迁移相互干扰的问题，先用带纹理增强损失的扩散模型恢复灰度细节，再以直方图引导模块和颜色一致性损失完成灰度到 sRGB 映射，分别约束纹理和颜色。"
  weight_labels:
  - ZRR / MAI 权重（Google Drive）
  - 镜像（百度网盘，提取码 f1gv）
RGB-Event ISP:
  title: RGB-Event ISP：数据集与基准
  tldr: "针对事件引导 ISP 缺乏数据与评测基准的问题，采集覆盖 24 个场景的 3,373 组像素对齐 RAW/事件数据，提供以色卡为参考的传统管线、神经 ISP 基线和事件引导模型，用于分析事件信息的作用。"
  note: 数据集位于 Hugging Face 的 yunfanlu/RGB-Event-ISP-Dataset 及百度网盘；仅限非商业研究用途。
SemiISP:
  title: SemiISP/SemiIE：利用一对多 sRGB 到 RAW 映射实现半监督 ISP 与图像增强
  tldr: "针对个性化 ISP 成对训练数据不足的问题，学习一对多 sRGB-to-RAW 重建，用合成配对数据与真实配对数据共同进行半监督训练，使已有 ISP 和图像增强模型能够利用额外 sRGB 图像。"
DiR:
  title: 面向相机 ISP 管线的退化无关表征学习
  tldr: "针对传感器噪声、去马赛克和 ISP 参数共同造成的复杂退化，进一步提炼自监督基线特征以获得退化无关表征，提升盲复原、检测和实例分割在未知成像条件下的泛化能力。"
FourierISP:
  title: 在傅里叶域解耦风格与结构以增强 RAW 到 sRGB 映射
  tldr: "针对手机 RAW 与单反 RGB 在颜色和空间结构上的差异，采用相位增强、幅度细化和颜色适配三个子网络，在傅里叶域分别优化结构与外观后再融合，减轻共享表征的任务冲突。"
  note: README 明确说明不会发布模型检查点，需要自行训练。
Real-World Camera Pipeline:
  title: 端到端真实世界相机成像管线
  tldr: "针对真实相机中的空间相关光学失真与压缩冗余，RealCamNet 用坐标感知模块校正暗角和暗电流阴影，用坐标无关映射压缩模块处理色调与冗余，并采集真实数据进行端到端率失真评测。"
RMFA-Net:
  title: RMFA-Net：面向真实 RAW 到 RGB 图像重建的神经 ISP
  tldr: "针对黑电平、CFA 结构与曝光不均处理不当造成的偏色和细节损失，结合隐式黑电平校正、保留高频信息的三通道拆分和基于 Retinex 的显式色调映射，并提供轻量部署版本。"
Simple ISP:
  title: 利用全局上下文引导的简洁图像信号处理
  tldr: "针对图块训练缺少全局光照信息的问题，从完整 RAW 提取全局上下文来引导轻量 ISP，使颜色与色调估计利用整幅图像；该模块也可接入其他神经 ISP 架构。"
Back to the Future ISP:
  title: 回到未来：不依赖深度学习的夜间摄影渲染 ISP
  tldr: "针对夜景神经 ISP 的数据需求、计算成本和可解释性问题，构建无需训练数据、参数较少的浅层传统处理管线，并通过 NTIRE 夜景渲染主观评测验证视觉效果，为学习式方法提供参考。"
Contrastive Subspace ISP:
  title: 面向相机图像信号处理的深度对比图像块子空间学习
  tldr: "针对同一图像中噪声和伪影分布不均的问题，PSL-AE 以对比学习将噪声与干净图块映射到局部子空间，再训练各聚类的解码器，实现随图块变化的复原。"
Single-Frame HDR ISP:
  title: 面向高动态范围场景的端到端单帧图像信号处理
  tldr: "针对 HDR 场景依赖多帧采集的问题，以多帧融合结果监督单帧 Bayer ISP，通过亮度增强与相机颜色设置的多头混合模块处理阴影、高光和颜色，结合监督、无监督及对抗损失训练。"
CBUnet:
  title: 通过级联色彩与亮度补偿渲染夜间图像
  tldr: "针对夜间光源复杂且数据不足的问题，串联颜色补偿与亮度补偿网络分别建模两类属性，并发布带专家白平衡和色调标注的高分辨率夜景 RAW–RGB 数据集 NR2R。"
  note: README 列出了第二阶段及其他权重。
  weight_labels:
  - 第一阶段 cube++.pth（Google Drive）
CRISPnet:
  title: CRISPnet：色彩渲染 ISP 网络
  tldr: "针对传统手机 ISP 随场景调整颜色的特性，以图像元数据和分类得到的全局语义共同指导颜色渲染，并采集不同光照、曝光及增益下的真实与 HDR 显示器数据进行评测。"
Day-to-Night:
  title: 用于训练夜间神经 ISP 的日转夜图像合成
  tldr: "针对夜景神经 ISP 训练数据采集昂贵的问题，将日间 RAW 转为带不同噪声水平的夜间 RAW，生成对齐的干净/噪声图像对，再结合少量真实夜景数据训练 ISP。"
  note: README 提及 pretrained_* 目录，但仓库中未找到权重文件，且数据集链接为空。
Deep-FlexISP:
  title: Deep-FlexISP：夜间摄影渲染的三阶段框架
  tldr: "针对夜景噪声、颜色和亮度相互干扰的问题，将 RAW 去噪、白平衡与 Bayer-to-sRGB 映射拆为级联子网络，通过弱耦合任务分解简化训练，并为中间处理与风格调整提供自由度。"
  note: 包含 2022 年模型的 Docker 镜像链接（Google Drive）返回 404（核验日期：2026-10-11）；仓库 Night_Photography_2023 目录提供的是团队 2023 年参赛模型检查点。
ISPW / LiteISP-in-the-wild:
  title: 将智能手机变成单反相机：在真实环境中学习 ISP
  tldr: "针对手机与单反弱配对图像的颜色及空间错位，结合颜色条件 ISP、参数化颜色对齐和全局上下文 Transformer 预测器，以掩码配准损失剔除不可靠运动区域，并发布 ISPW 数据集。"
  note: 仓库目前仅提供 ISPW 数据集下载；README 表示代码即将发布。
RAWtoBit:
  title: RAWtoBit：完全端到端的相机 ISP 网络
  tldr: "针对神经 ISP 通常未联合优化压缩的问题，直接学习 RAW 到码流的率失真优化网络，并以分别专长于 ISP 和压缩的两个教师模型进行蒸馏，将两项任务纳入统一管线。"
Shallow Night Pipeline:
  title: 用于夜间摄影渲染的浅层相机管线
  tldr: "针对夜景主观渲染缺少明确真值的问题，以局部亮度增强、全局直方图调整和暗区更强的去噪构建低参数手工管线，在改善动态范围的同时避免画面灰白和亮区细节损失。"
  note: 论文称录用后发布代码；尚未找到仓库。
StereoISP:
  title: StereoISP：重新思考双相机系统的图像信号处理
  tldr: "针对单视图 ISP 未利用双摄额外观测的问题，利用双目视差联合处理两路 RAW，完成去噪和去马赛克，并在合成双目 RAW 数据上评估这一初步管线。"
LiteISPNet:
  title: 在不精确配准监督下学习 RAW 到 sRGB 映射
  tldr: "针对颜色差异妨碍跨相机配准监督的问题，联合学习 RAW-to-sRGB 与图像配准，用目标引导的全局颜色模块在不移动像素的情况下先匹配颜色，从而训练轻量 ISP 主干。"
  note: README 还通过百度网盘提供 ZRR（提取码 8sq1）及预处理后的 SR-RAW。
  weight_labels:
  - ZRR / SR-RAW 预训练模型（Google Drive）
AWNet:
  title: AWNet：用于图像 ISP 的注意力小波网络
  tldr: "针对 RAW 细节恢复与大感受野的计算成本问题，结合小波变换、注意力和全局上下文模块，利用多尺度分解重建纹理，并通过非局部特征学习颜色映射。"
  weight_labels:
  - demosaiced_model（Google Drive）
  - Raw_model（Google Drive）
MW-ISPNet:
  title: "AIM 2020 学习式图像信号处理管线挑战"
  tldr: "针对 AIM 2020 手机 RAW 到单反 RGB 的重建任务，MW-ISPNet 结合 U-Net、多级小波和残差通道注意力进行复原与颜色渲染；所链接文献为记载该方案的挑战报告。"
  weight_labels:
  - 赛道 1 模型（Google Drive）
  - 赛道 2 模型（Google Drive）
PyNET:
  title: 以单个深度学习模型替代移动相机 ISP
  tldr: "针对手工调节手机 ISP 各阶段的复杂性，使用逐层训练的金字塔 CNN 从手机 RAW 直接重建单反风格 RGB，联合学习复原与渲染，并发布含一万组图像对的 ZRR 数据集。"
  note: PyTorch 版本位于 aiff22/PyNET-PyTorch；训练还需要 VGG-19。
  weight_labels:
  - PyNET_pretrained.zip（TensorFlow）
  - pynet_level_0.pth（PyTorch 版本）
PyNET-CA:
  title: "PyNET-CA：结合通道注意力的增强 PyNET，用于端到端移动图像信号处理"
  tldr: "针对 PyNET 的特征选择与上采样重建问题，在金字塔 CNN 中加入通道注意力和亚像素重建模块，形成端到端手机 RAW-to-RGB 模型，并在 AIM 神经 ISP 挑战中评测。"
  note: 作者提醒，在 PyTorch > 1.4 时可能无法复现实验结果。
  weight_labels:
  - pretrained_model.zip（Dropbox）
Sky Optimization:
  title: 天空优化：低光摄影中具有语义感知能力的天空图像处理
  tldr: "针对夜空噪声与颜色处理需要独立于前景的问题，从部分标注构建天空掩码数据集，训练低分辨率分割网络，再以加权引导滤波细化上采样，支持仅对天空调整白平衡、色调和噪声。"
CameraNet:
  title: CameraNet：高效相机 ISP 学习的两阶段框架
  tldr: "针对复原保真度与外观增强目标不一致的问题，将 ISP 拆成分别监督、渐进训练的两个 CNN 模块：先恢复传感器图像，再学习颜色和外观增强，降低单网络同时处理多任务的训练难度。"
  note: 官方代码基于 TensorFlow 1.15；README 仅提供 HDR+／SID 预处理数据，未找到权重链接。
Deep Camera:
  title: Deep Camera：用于图像信号处理的全卷积神经网络
  tldr: "针对顺序 ISP 各阶段误差累积的问题，以单个全卷积网络端到端联合学习坏点校正、去噪、白平衡、曝光校正、去马赛克、颜色变换和伽马编码，直接从 Bayer 数据重建 RGB。"
HERN:
  title: 用于图像去马赛克与增强的高分辨率网络
  tldr: "针对高分辨率图块训练显存占用大且不稳定的问题，以高低分辨率双路径融合局部多尺度特征与全局信息，并采用渐进训练稳定优化，实现联合去马赛克与增强。"
  note: README 中挑战权重 114.pth／115.pth 的两个 OneDrive 链接均返回 404（核验日期：2026-10-11）。
W-Net:
  title: W-Net：利用错位数据完成 RAW 到 RGB 映射的两阶段 U-Net
  tldr: "针对跨相机训练对配准不准且缺少元数据的问题，串联两个 U-Net，并设计对错位较不敏感、对颜色更敏感的损失；通过不同损失训练模型的集成完成 RAW-to-RGB 重建。"
  weight_labels:
  - 预训练模型（Google Drive）
DeepISP:
  title: DeepISP：迈向端到端图像处理管线学习
  tldr: "针对低光 RAW 复原与颜色渲染分开优化的问题，联合学习局部去噪、去马赛克和全局颜色调整，并采集三星 S7 低光与正常曝光图像对，用于评估完整神经成像管线。"
DPED:
  title: 利用深度卷积网络在移动设备上生成单反级照片
  tldr: "针对手机照片与单反照片的外观差距，在多手机配对数据集上以内容、颜色和对抗纹理损失训练残差 CNN，同时改善颜色与清晰度；其输入为已处理照片，任务属于 RGB 图像增强。"
  weight_labels:
  - models_orig/{iphone,sony,blackberry}_orig（仓库内）
Scene-Dependent Imaging:
  title: 利用深度神经网络建模相机中依赖场景的成像过程
  tldr: "针对自动模式成像变换随场景变化、固定辐射响应模型难以描述的问题，利用多尺度可学习直方图层将全局和局部上下文嵌入像素特征，同时学习 RAW-to-sRGB 与逆向映射。"
Edit-aware RAW:
  title: 编辑感知的 RAW 重建
  tldr: "针对重建 RAW 在后续编辑中失真的问题，以随机采样参数的模块化可微 ISP 模拟多种调整，通过编辑后误差训练，使复原不局限于默认渲染。"
  note: 仓库包含 NILUT 与色调曲线辅助模型；主模型需利用 S24 数据自行训练。
MambaRaw:
  title: MambaRaw：通过选择性状态空间建模实现高效 4K RAW 图像重建
  tldr: "针对 JPEG 辅助 4K RAW 重建的熵建模成本，在信息密集图块上进行选择性状态空间扫描，并用能量感知残差细化联合建模空间与能量上下文。"
  note: 每个 λ 值都需要单独训练。
MERIT:
  title: MERIT：多域高效 RAW 图像转换
  tldr: "针对每对相机独立训练转换器难扩展，以多尺度大核条件注意力和传感器噪声对齐损失训练共享 RAW 生成器，并提供五传感器配对与非配对 MDRAW 数据。"
RAW-Flow:
  title: RAW-Flow：利用确定性潜空间流匹配推进 RGB 到 RAW 图像重建
  tldr: "针对 RGB-to-RAW 逆问题的细节与颜色歧义，采用跨尺度 RGB 上下文引导的确定性潜空间流匹配，以双域自编码器及特征对齐稳定 RGB 与 RAW 间的传输。"
  weight_labels:
  - nikon_d700 / canon_eos_5d 权重（Google Drive）
Raw-JPEG Adapter:
  title: Raw-JPEG Adapter：利用 JPEG 高效压缩 RAW 图像
  tldr: "针对线性 RAW 难用标准 JPEG 高效存储，学习紧凑可逆的空间及可选频域变换，将参数写入 JPEG 注释字段，在兼容标准编解码器的同时支持 RAW 重建。"
  weight_labels:
  - models/raw_jpeg_adapter_q_*.pth（仓库内）
RawGen:
  title: RawGen：学习相机 RAW 图像生成
  tldr: "针对 RAW 数据稀缺且生成模型偏向已渲染图像，在潜空间和像素域适配扩散先验，支持文本到 RAW 及 sRGB 逆处理，并以多渲染到同一线性场景的训练对约束物理一致性。"
  note: 官方仓库本身不含权重，指向作者仓库 DY112/RawGen。
  weight_labels:
  - kontext_lora.pt + vae_decoder_xyz.pt（Google Drive，作者仓库 DY112/RawGen）
RAWIC:
  title: RAWIC：位深自适应的无损 RAW 图像压缩
  tldr: "针对不同比特深度 RAW 的无损压缩，将 Bayer 打包为 RGGB 图块，以逐图块比特深度调制学习式熵模型，使概率估计适应局部信号范围。"
  note: README 还列有百度网盘镜像。
  weight_labels:
  - 主模型与消融模型（北京大学网盘）
SpiralDiff:
  title: SpiralDiff：结合 LoRA 的螺旋扩散，实现跨相机 RGB 到 RAW 转换
  tldr: "针对亮度相关逆重建难度和多相机适配，以信号相关扩散权重结合相机感知 LoRA，用少量传感器专属参数适配共享 RGB-to-RAW 模型。"
  note: 采用 Apache-2.0 许可证。README 的模型链接 huggingface.co/Chuancy/SpiralDiff 返回 404；检查点实际位于存放 FiveK DNG 数据的数据集仓库中。
  weight_labels:
  - checkpoints.zip（Hugging Face 数据集仓库）
Illum–Sensor Mapping:
  title: 改进 RAW 图像在光照与传感器之间的映射
  tldr: "针对 RAW 受传感器光谱与光源共同影响，采集 390 种照明、四款相机和 18 个场景，改进光源及传感器映射，并检验生成数据对神经 ISP 训练的作用。"
Physically-Informed Raw2Raw:
  title: 超越标定：物理知识引导的 RAW 到 RAW 映射学习
  tldr: "针对跨相机与光源变化下的颜色一致性，用轻量神经物理模型模拟指定光照 RAW 并估计设备变换，支持物理测量初始化以及配对或非配对训练。"
RAW-Diffusion:
  title: RAW-Diffusion：用于高保真 RAW 图像生成的 RGB 引导扩散模型
  tldr: "针对标注 RAW 数据稀缺，将多分辨率 RGB 引导特征注入反向扩散残差块，生成传感器专用 RAW，并构建 BDD100K-RAW 与 Cityscapes-RAW 用于检测训练。"
  note: README 未提供权重。
ReRAW:
  title: ReRAW：通过分层采样进行 RGB 到 RAW 重建，用于高效边缘目标检测
  tldr: "针对边缘检测器缺少训练 RAW，以多头网络预测伽马空间 RAW 候选，并按亮度分层选取训练样本，改善亮像素重建后用于检测预训练。"
Learnable CCM RAW Recon:
  title: 用于 RAW 重建的可学习色彩校正矩阵
  tldr: "针对驾驶感知缺少 RAW 数据，以单卷积层实现可学习颜色校正矩阵近似逆 ISP，低成本生成模拟 RAW，并评估其对检测器预训练的作用。"
Prior Metadata RAW Recon:
  title: 先验元数据驱动的 RAW 重建：无需逐图像元数据
  tldr: "针对逐图元数据开销，从离线 RAW 参考中搜索相似像素，将检索先验送入神经重建器，并压缩参考池以降低搜索和存储成本。"
Rawformer:
  title: Rawformer：面向可学习相机 ISP 的非配对 RAW 到 RAW 转换
  tldr: "针对已有神经 ISP 难适配新传感器，采用 Transformer 编码解码器进行非配对 RAW-to-RAW 转换，将新相机观测映射到原 ISP 的传感器域。"
  note: README 待办列表中的上传预训练模型事项尚未完成。
SEL-CIE:
  title: SEL-CIE：从非线性 sRGB 重建 CIE-XYZ 的知识引导自监督学习框架
  tldr: "针对线性颜色重建配对数据不足，将知识引导自监督与已有 sRGB/XYZ 配对数据结合，联合重建 CIE XYZ 及重渲染 sRGB，并在 sRGB2XYZ 评测。"
sRGB-to-RAW Video:
  title: 利用帧间亲和关系进行 sRGB 到 RAW 视频逆渲染
  tldr: "针对视频逆渲染的时序一致性，利用运动提取时间亲和先验，再根据前帧学习场景及位置相关空间映射，并建立 RAW 视频逆渲染基准。"
Unsupervised Raw2Raw ISP:
  title: 通过无监督 RAW 到 RAW 映射提升 ISP 模型泛化能力
  tldr: "针对无相机配对数据的 ISP 迁移，以 CSTPP 预测逐图块颜色空间变换参数，使用 CycleGAN 式训练，适应空间变化光照并转换传感器域。"
Beyond R2LCM:
  title: 超越基于学习型元数据的 RAW 图像重建
  tldr: "针对 JPEG 辅助 RAW 重建的元数据效率，采用非对称多分辨率特征和条件上下文模型编码紧凑潜元数据，以迭代编码掩码实现单模型可变码率。"
Graphics2RAW:
  title: Graphics2RAW：将计算机图形图像映射为传感器 RAW 图像
  tldr: "针对图形渲染与真实传感器 RAW 的差异，用少量目标相机 RAW-DNG 样本将同一场景映射至多相机与光源，并发布 292 张真实感 CG 图像用于低光训练。"
Metadata RAW (INF):
  title: 通过隐式神经函数进行基于元数据的 RAW 重建
  tldr: "针对稀疏元数据辅助 RAW 重建，以隐式神经函数从坐标及对应 sRGB 值预测 RAW，在当前图像元数据上自监督拟合，无需预训练相机 ISP。"
R2LCM:
  title: 利用学习型紧凑元数据重建 RAW 图像
  tldr: "针对保留 JPEG 时 RAW 辅助存储开销，学习紧凑潜元数据和 sRGB 引导熵上下文模型，根据区域信息量分配比特，改善单位存储的重建质量。"
  weight_labels:
  - 索尼模型（Google Drive）
  - 三星模型（Google Drive）
SRISP:
  title: 通过参考引导的动态参数选择实现自监督逆向图像信号处理
  tldr: "针对无元数据和配对数据的逆 ISP，根据参考 RAW 动态选择逆管线参数，生成匹配其传感器及环境的 RAW 风格图像，并评估检测训练用途。"
Content-Aware Metadata:
  title: 利用内容感知元数据学习 sRGB 到 RAW-RGB 逆渲染
  tldr: "针对 RAW 元数据采样效率，联合学习内容感知采样与重建网络，选择更有价值的原始 RAW 样本，并用在线微调进一步适配当前图像。"
  note: README 中的数据集链接为空。
MBISPLD:
  title: 通过可学习字典构建基于模型的图像信号处理器
  tldr: "针对 ISP 可逆性与可解释性的结合，在模型驱动双向 RAW/RGB 管线中学习参数字典，通过字典采样生成合理增强数据，支持少标注训练。"
  note: mv-lab/AISP/mbispld 目录仅含论文 PDF 和配图。
Overexposure Mask Fusion:
  title: 过曝掩码融合：可泛化逆向 ISP 的多步细化
  tldr: "针对 RGB 饱和区域逆重建，先预测去马赛克 RAW，再以过曝掩码进行多步细化，使感知监督可用，并可接入其他重建主干。"
  weight_labels:
  - trained_models/（仓库内，S7 数据）
Reverse Style Transfer ISP:
  title: 通过反向风格迁移逆转图像信号处理器
  tldr: "针对 ISP 操作能否视作可移除风格的问题，RST-ISP-Net 用自适应特征归一化进行端到端逆风格迁移，并在 AIM 逆 ISP 任务中研究 sRGB-to-RAW。"
CIE XYZ Net:
  title: CIE XYZ Net：面向低层计算机视觉任务的图像逆处理
  tldr: "针对 RAW 目标依赖特定传感器的问题，学习将非线性 sRGB 逆处理为统一 CIE XYZ，为低层复原与颜色视觉任务提供场景参考表示。"
  note: 论文结果使用 MATLAB 版本；PyTorch 权重是为方便使用提供的移植版本。
  weight_labels:
  - PyTorch/models/model_sRGB-XYZ-sRGB.pth（仓库内）
InvISP:
  title: 可逆图像信号处理
  tldr: "针对另存完整 RAW 的空间开销，采用可逆神经 RAW/sRGB 管线并加入可微 JPEG 模拟，在压缩失真下联合训练渲染与 RAW 重建。"
  weight_labels:
  - pretrained/canon.pth、nikon.pth（仓库内）
Raw Bayer Synthesis for CV-ISP:
  title: 面向计算机视觉的 ISP 管线设计中的 RAW Bayer 图像合成
  tldr: "针对 RAW 感知标注数据不足，通过额外去马赛克变换约束 GAN 的 RGB-to-Bayer 生成，支持任意尺寸图像，并评测合成 RAW 的端到端检测训练。"
Raw-to-Raw (Semi-Sup.):
  title: 半监督 RAW 到 RAW 映射
  tldr: "针对少配对跨传感器颜色映射，结合小规模配对集与较大的各相机非配对集训练，并采集双手机 RAW 数据评估半监督转换。"
  note: 提供 DNG 数据及预计算映射。
Spatially Aware Metadata:
  title: 用于 RAW 重建的空间感知元数据
  tldr: "针对空间变化色调映射难以逆处理，将分布于图像各处的少量 RAW 样本作为元数据保存，再辅助重建，降低采集阶段计算和存储开销。"
CycleISP:
  title: CycleISP：通过改进数据合成实现真实图像复原
  tldr: "针对渲染域简单噪声合成不真实，学习相机正逆向映射并在中间注入传感器噪声，生成一致的 RAW/sRGB 噪声与干净训练对。"
  weight_labels:
  - 全部模型（Google Drive）
Lossless Mosaic Compression:
  title: 利用卷积神经网络预测对马赛克图像进行无损压缩
  tldr: "针对 RAW 无损压缩的空间光谱冗余，以高阶非线性 CNN 预测马赛克样本并无损编码残差，针对传感器颜色图案建模相关性。"
SingleHDR:
  title: 通过学习逆转相机管线进行单图像 HDR 重建
  tldr: "针对 LDR 渲染造成的信息损失，用三个专属 CNN 逆转量化、非线性相机响应和裁剪，再联合微调，减少物理结构化 HDR 重建中的阶段误差。"
  weight_labels:
  - 模型检查点 ckpt（Google Drive）
Camera Pipeline Simulation:
  title: 通过相机管线模拟生成真实 RGB 图像去噪训练数据
  tldr: "针对 JPEG 去噪训练噪声不真实，模拟 RAW 噪声及后续完整相机管线，通过消融分析真实去马赛克与去噪模拟对训练数据的作用。"
Unprocessing:
  title: 面向学习型 RAW 去噪的图像逆处理
  tldr: "针对 RAW 去噪数据不足，对普通照片逆转色调、颜色和增益处理后注入传感器噪声，并经正向 ISP 计算损失，使训练考虑后续照片渲染。"
  note: 位于 google-research 单一大仓库的子目录中。
  weight_labels:
  - 训练完成的模型（Google Drive）
MeanFlow RAW:
  title: 当极暗场景遇到运动模糊：用于统一 RAW 复原的 MeanFlow
  tldr: "针对极暗与运动模糊耦合退化，以域条件校准的 RAW tokenizer 对齐曝光域，再用单次求值 MeanFlow 增强，结合物理引导细化，并建立保留传感器噪声的 SIDED 运动退化基准。"
NEC-Diff:
  title: NEC-Diff：噪声鲁棒的事件与 RAW 互补扩散，在极暗环境中看清运动
  tldr: "针对极暗运动场景的强噪声，使用扩散框架融合互补的事件与 RAW 观测恢复结构，并建立 REAL 数据集，提供 0.001–0.8 lux 下 47,800 组像素对齐 RAW、事件和参考数据。"
  note: 数据集正在分批上传；尚无权重。
RawMetaDiff:
  title: RawMetaDiff：通过元数据引导扩散挖掘双曝光 RAW 中的极暗场景信息
  tldr: "针对极暗双曝光错位，以 RAW 元数据引导扩散：通道颜色迁移对齐全局统计，元数据归一化交叉注意力建立空间对应并恢复暗部细节，发布约千组 DERaw 数据。"
DarkDiff:
  title: DarkDiff：将扩散模型改用于相机 ISP，推进低光 RAW 增强
  tldr: "针对像素回归 ISP 易过度平滑的问题，将预训练生成扩散模型重新适配为低光 RAW 成像管线，利用已有图像先验恢复暗区感知细节和颜色，并在多个低光 RAW 基准评估。"
ERIENet:
  title: ERIENet：低光环境中的高效 RAW 图像增强网络
  tldr: "针对低光 RAW 增强的计算开销，采用全并行多尺度架构与通道感知残差密集卷积块，并以绿色通道引导分支利用 Bayer 中更丰富的绿色采样信息，辅助高效重建。"
  note: 仓库含训练和测试代码；未找到权重。
HiMA:
  title: 用于低光 RAW 图像增强的层次化混合架构
  tldr: "针对低光质量与效率的矛盾，在分层大小尺度块中结合通道注意力和 Mamba，以局部分布调整学习区域亮度及对比度统计，并通过多先验融合维持域一致性。"
  weight_labels:
  - 预训练模型（Google Drive）
  - 预训练模型（百度网盘，提取码 8fem）
ISP-driven LLIE Data:
  title: 通过 ISP 驱动的数据建模实现更真实的低光图像增强
  tldr: "针对低光合成数据与真实成像失配的问题，先将正常曝光图像逆处理为 RAW，再施加退化并改变白平衡、色调和伽马等 ISP 阶段，生成训练对，以卷积 U-Net 验证数据有效性。"
LDM-ISP:
  title: LDM-ISP：利用潜空间扩散模型改进低光神经 ISP
  tldr: "针对极暗 RAW 缺少可恢复细节的问题，训练轻量调制模块将 RAW 信息注入预训练潜扩散 U-Net，并将潜空间低频内容生成与解码阶段高频细节保留分开处理。"
  note: 作者称发布模型为重新训练的版本，得分略高于论文所报结果。
  weight_labels:
  - pretrained_models（OneDrive/SharePoint）
Reconstruction & Denoising in the Dark:
  title: 重新思考暗光中的重建与去噪：新视角、通用架构及其拓展
  tldr: "针对串联去噪与重建不能充分共享信息的问题，以颜色与噪声感知主干连接轻量任务头，采用任务专属监督和双头交互，在特征层面联合学习两项任务。"
Rectified-Flow LL RAW:
  title: 用于低光 RAW 图像增强的物理引导整流流
  tldr: "针对全局噪声标定忽略像素差异的问题，建立加性与乘性噪声模型并逐像素标定、合成，结合物理引导 rectified flow 完成增强，并采集 Sony A7S II 室内 LLID 基准。"
SIED:
  title: 学习在极暗环境中看见
  tldr: "针对低至 0.0001 lux 的增强缺少数据，以标定合成流程构建三个照度区间的 RAW/sRGB 配对 SIED 数据；扩散模型结合自适应光照校正与颜色一致性损失恢复曝光和颜色。"
  weight_labels:
  - 预训练模型（OneDrive）
  - 镜像（百度网盘，提取码 m9zp）
TS-Diff:
  title: TS-Diff：用于低光 RAW 图像增强的两阶段扩散模型
  tldr: "针对扩散增强跨相机适配困难的问题，在虚拟传感器上预训练相机特征整合模块，再平均并用少量目标 RAW 微调；颜色校正器在扩散过程中动态调整全局颜色分布。"
  note: pretrained_models/ 目录仅包含占位文件。
Retinex-RAWMamba:
  title: Retinex-RAWMamba：连接去马赛克与去噪以增强低光 RAW 图像
  tldr: "针对 RAW 去噪、去马赛克和曝光校正的耦合，设计适配不同 CFA 的 Mamba 架构，以 Retinex 分解模块解耦光照与反射，降低对手动线性增亮的依赖。"
  note: 各模型检查点还提供百度网盘镜像。
  weight_labels:
  - 索尼模型（Google Drive）
  - 富士模型（Google Drive）
  - MCR 模型（Google Drive）
DiffuseRAW:
  title: DiffuseRAW：用于低光图像的端到端生成式 RAW 图像处理
  tldr: "针对在已处理图像上使用生成先验难以应对极暗信号的问题，直接以低光 RAW 微调预训练潜扩散模型，生成长曝光风格的处理图像，端到端学习 RAW 到输出的成像管线。"
DNF:
  title: DNF：用于暗光成像的解耦与反馈网络
  tldr: "针对去噪与颜色映射混合造成的域歧义，分离 RAW 域去噪与 sRGB 重建，并在阶段间反馈特征，避免仅传递中间图像导致的信息损失，以较少参数完成低光增强。"
  weight_labels:
  - SID 索尼模型（Google Drive）
  - SID 富士模型（Google Drive）
  - MCR 模型（Google Drive）
  - SID 索尼模型（百度网盘，提取码 eoiz）
ExposureDiffusion:
  title: ExposureDiffusion：学习曝光以增强低光图像
  tldr: "针对通用扩散需从纯噪声开始、推理步骤多的问题，将物理曝光过程嵌入扩散，直接从噪声输入逐步恢复，并以自适应残差层抑制已充分曝光区域的过度修正。"
  note: 与 R2LCM 为同一作者。
  weight_labels:
  - SID_Pg / SID_PGru / SID_real 等模型（Google Drive）
FDA Low-Light:
  title: 通过特征域适应学习看清低光图像
  tldr: "针对两阶段低光网络计算量大、单阶段又存在域歧义的问题，以干净 RAW 监督去噪编码器，经适配行缓存的 Lineformer 转换特征；推理时移除 RAW 监督分支，保留单阶段效率。"
MCR:
  title: 抛弃 Bayer 滤色阵列以看清暗处
  tldr: "针对 Bayer 滤光片损失光子的问题，以神经模拟器从彩色 RAW 合成单色 RAW，再用通道注意力融合两者增强低光图像；采集真实单色/彩色配对 MCR 数据用于训练。"
  note: MCR 数据集也可从百度网盘获取，提取码 22cv。
  weight_labels:
  - MCR_pretrained_model（Google Drive）
  - SID_pretrained_model（Google Drive）
Progressive LL RAW:
  title: 面向 RAW 图像的渐进式联合低光增强与去噪
  tldr: "针对高分辨率 RAW 联合增强在新相机上需大量重采数据的问题，结合系数估计分支与联合增强去噪分支，同时处理亮度、颜色和噪声，降低相机专用适配的数据需求。"
RAW LLE (TIP):
  title: 迈向利用 RAW 图像的低光增强
  tldr: "针对 RAW 增强优势来源不清及实际输入受限的问题，提出因子化增强模型量化分析 RAW 属性；REENet 在训练时利用 RAW 信息，测试时可仅输入 sRGB。"
Burst Dark Enhancement:
  title: 通过连拍摄影学习增强极暗图像
  tldr: "针对极暗连拍噪声高且细节弱的问题，粗网络先预测低分辨率干净 RAW，再由精细网络恢复纹理；以排列不变的特征融合聚合多帧信息，避免依赖输入顺序。"
Few-Shot LL RAW:
  title: 面向低光 RAW 图像增强的小样本域适应
  tldr: "针对低光增强模型跨相机失效的问题，用源相机标注数据结合不超过十组目标样本进行少样本域适配，并采集 Nikon 短长曝光配对数据验证跨相机迁移。"
RED:
  title: 实时复原极暗图像
  tldr: "针对极暗复原推理慢且依赖外部曝光增益的问题，将主要计算放在粗尺度并支持多尺度并行，以仅依赖输入的放大模块估计增益，降低高分辨率增强成本。"
  note: 仓库另含 SID／SGN／DID 的对比训练脚本。
  weight_labels:
  - demo_imgs/weights（仓库内，由 demo.py 直接加载）
Adaptive Low-Light RAW:
  title: 学习用于极低光 RAW 图像处理的自适应模型
  tldr: "针对 RAW 增亮依赖手设参数的问题，亮度预测模块估计场景目标曝光，曝光迁移模块完成渲染，并设计图像增强向量及 Campus 数据集进行监督，实现内容自适应亮度控制。"
EEMEFN:
  title: EEMEFN：通过边缘增强多曝光融合网络进行低光图像增强
  tldr: "针对单张极暗 RAW 细节与边缘难恢复的问题，构建多曝光表示并融合互补特征，再通过边缘增强分支细化结构，将曝光处理与边界重建结合。"
  note: 发表于 AAAI 2020，无 arXiv 版本。
  weight_labels:
  - 索尼／富士模型（MEGA）
LLPackNet:
  title: 迈向快速轻量的暗光图像复原
  tldr: "针对暗图复原计算量大且需手设增益的问题，以打包/解包操作将主要特征处理移至低分辨率，并从输入估计放大因子，降低计算量与曝光配置负担。"
Short/Long Raw Pairs:
  title: 利用短曝光与长曝光 RAW 图像对进行低光图像复原
  tldr: "针对短曝光噪声与长曝光模糊的互补关系，模拟低光成像生成真实退化训练对，训练 LSFNet 处理配准与融合，联合抑制运动模糊、噪声和颜色失真。"
Low-Light Camera Pipeline:
  title: 学习用于极低光成像的数字相机管线
  tldr: "针对极低光传统管线输出昏暗且噪声大的问题，以结合逐像素与感知特性的损失训练神经相机管线，将短曝光 RAW 转为充分曝光的 sRGB，并同时进行保真度与主观评测。"
Moving Objects in the Dark:
  title: 学习在黑暗中看清运动物体
  tldr: "针对运动低光场景缺少真实配对视频的问题，以分光光学系统同步采集亮暗视频，并用结合二维与三维操作的全卷积网络学习 RAW-to-RGB 时空增强。"
  weight_labels:
  - python download_model.py（脚本下载）
Seeing Motion in the Dark:
  title: 在黑暗中看清运动
  tldr: "针对动态场景无法取得长曝光视频真值的问题，以静态 RAW 视频训练孪生网络并加入时间稳定性损失，使模型泛化到运动场景，同时发布 DRV 低光视频基准。"
  weight_labels:
  - 预训练模型（Google Drive）
