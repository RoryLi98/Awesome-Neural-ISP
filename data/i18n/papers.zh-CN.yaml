# Chinese translations keyed by the exact canonical paper name.
BRACE:
  title: 从 Bricker 到 BRACE：针对闪烁条纹的包围曝光 RAW 数据集与复原模型
  tldr: 针对拍摄屏幕时滚动快门与屏幕调光导致的闪烁条纹，提供包围曝光 RAW 数据集与复原模型。
  note: README 中模型与数据下载仍列为待办事项。
BurstGP:
  title: BurstGP：利用生成先验增强 RAW 连拍图像超分辨率
  tldr: 在 RAW 连拍超分辨率中引入生成先验。
DEBIR:
  title: 动态曝光连拍图像复原
  tldr: 在动态曝光条件下复原连拍图像，与 ParamISP 出自同一团队。
  weight_labels:
  - 官方权重（Google Drive）
GenMFSR:
  title: GenMFSR：生成式多帧图像复原与超分辨率
  tldr: 进行生成式多帧图像复原与超分辨率。
Keyframe SSM Burst SR:
  title: 以关键帧为中心的连拍图像超分辨率状态空间建模
  tldr: 以关键帧为中心建立状态空间模型，进行多帧 RAW 超分辨率，降低长序列计算量。
LatentBurst:
  title: LatentBurst：面向十六合一 Bayer 图案 CMOS 图像传感器图像的快速高效多帧超分辨率
  tldr: 面向十六合一 Hexadeca-Bayer 图像传感器的高效多帧超分辨率。
QMambaBSR:
  title: QMambaBSR：利用查询状态空间模型进行连拍图像超分辨率
  tldr: 采用基于查询的状态空间模型实现连拍超分辨率。
Bracket Restoration:
  title: 利用光流引导配准与增强特征聚合改进包围曝光图像复原与增强
  tldr: 基于光流引导配准的 NTIRE 2024 包围曝光图像复原方案。
BurstM:
  title: BurstM：结合光流与傅里叶空间的深度连拍多尺度超分辨率
  tldr: 将傅里叶空间处理与光流结合，进行多尺度连拍超分辨率。
  weight_labels:
  - SyntheticBurst 模型（Google Drive）
  - BurstSR 模型（Google Drive）
Burstormer:
  title: Burstormer：用于连拍图像复原与增强的 Transformer
  tldr: BIPNet 的 Transformer 版本，采用多尺度局部与非局部配准。
  note: 其他任务的权重列在相应子目录的 README 中。
  weight_labels:
  - 合成连拍超分辨率检查点（OneDrive）
Efficient Raw HDR:
  title: 从真实世界 RAW 图像高效重建 HDR
  tldr: 从真实智能手机 RAW 图像高效重建 HDR。
FBANet:
  title: 迈向真实世界连拍图像超分辨率：基准与方法
  tldr: 提出真实世界连拍超分辨率数据集 RealBSR 与联合仿射融合网络。
  note: 模型检查点的 Google Drive 副本返回 404（核验日期：2026-10-11）。
  weight_labels:
  - RealBSR 检查点 model_best.pth（百度网盘，提取码 f9ew）
GMTNet:
  title: 用于连拍复原与增强的门控多分辨率迁移网络
  tldr: 通过门控多分辨率特征迁移进行连拍复原与增强。
KBNet:
  title: 核感知的连拍盲超分辨率
  tldr: 通过估计模糊核进行连拍盲超分辨率。
Raw/sRGB HDR Video:
  title: 结合 RAW 与 sRGB 域大规模动态数据集的 HDR 视频重建
  tldr: 提供涵盖 RAW 与 sRGB 两个域的大规模 HDR 视频重建数据集及方法。
RawHDR:
  title: RawHDR：从单张 RAW 图像重建高动态范围图像
  tldr: 利用 RAW 的高位深，从单张 RAW 分别恢复高光与暗部，重建 HDR 图像。
  weight_labels:
  - 预训练模型（OneDrive）
Self-Supervised Burst SR:
  title: 自监督连拍超分辨率
  tldr: 仅使用多帧 RAW 以自监督方式训练连拍超分辨率，无需高分辨率真值。
Single-Shot HDR Demosaic:
  title: 针对时变曝光联合去马赛克与去鬼影，实现单次拍摄 HDR 成像
  tldr: 面向空间变化曝光的传感器，联合执行去马赛克与去鬼影。
  weight_labels:
  - 预训练模型 best_psnr_mu.pt（Google Drive）
2StageAlign:
  title: 面向大位移连拍图像重建的可微两阶段配准方案
  tldr: 在较大位移下利用可微两阶段配准，联合进行连拍去噪与去马赛克。
  weight_labels:
  - experiments/.../models（仓库内）
BIPNet:
  title: 连拍图像复原与增强
  tldr: 通过伪连拍特征融合，在统一框架内处理连拍超分辨率、去噪与低光增强。
  note: 各子任务权重列在 Burst_Super_Resolution／Burst De-noising 子目录的 README 中。
  weight_labels:
  - 合成连拍超分辨率模型 BIPNet.ckpt（OneDrive）
BSRT:
  title: BSRT：结合 Swin Transformer 与光流引导可变形配准改进连拍超分辨率
  tldr: NTIRE 2022 连拍超分辨率冠军，采用 Swin Transformer 与光流引导的可变形配准。
  weight_labels:
  - 全部预训练权重（Google Drive）
HDR+SR Bursts:
  title: 从 RAW 连拍图像同时获得高动态范围与超分辨率
  tldr: 单次处理具有不同曝光的 RAW 连拍序列，同时输出 HDR 与超分辨率图像。
DBSR:
  title: 深度连拍超分辨率
  tldr: 利用光流配准与注意力融合实现多帧 RAW 超分辨率，发布真实世界 BurstSR 数据集并组织 NTIRE 2021 赛道。
  note: 挑战赛工具包：goutamgmb/NTIRE21_BURSTSR。
  weight_labels:
  - 模型库（由安装脚本自动下载）
Deep-Rep:
  title: 多帧超分辨率与去噪的深度重参数化
  tldr: 在学习得到的深度重参数化空间中进行多帧最大后验优化，统一连拍超分辨率与去噪，入选 ICCV 2021 口头报告。
  weight_labels:
  - 模型库（由安装脚本自动下载）
EBSR:
  title: EBSR：利用可变形配准进行特征增强连拍超分辨率
  tldr: NTIRE 2021 连拍超分辨率获胜方案，采用可变形配准与特征增强。
  weight_labels:
  - 合成赛道模型（Google Drive）
  - 真实赛道模型（Google Drive）
GCP-Net:
  title: 利用绿色通道先验对真实世界连拍图像联合去噪与去马赛克
  tldr: 借助绿色通道先验，对真实世界连拍图像进行联合去噪与去马赛克。
  weight_labels:
  - experiments/gcpnet_model/600000_G.pth（仓库内）
Lucas-Kanade Reloaded:
  title: Lucas-Kanade 重装上阵：从 RAW 连拍图像进行端到端超分辨率
  tldr: 将 Lucas-Kanade 配准展开为可学习的多帧 RAW 超分辨率管线。
Merging-ISP:
  title: Merging-ISP：多曝光高动态范围图像信号处理
  tldr: 在单个网络中结合多曝光 HDR 合并与 ISP，直接从多帧 RAW 输出渲染后的 HDR 图像。
Tri-Exposure Quad-Bayer HDR:
  title: 利用三曝光 Quad-Bayer 传感器重建 HDR 视频
  tldr: 利用交错三曝光 Quad-Bayer 传感器，在单帧内重建 HDR 视频。
BPN:
  title: 利用基预测网络实现高效大核连拍去噪
  tldr: 预测一组共享基核及其系数，实现高效的大卷积核连拍去噪。
  note: README 和 scripts/download_models.sh 中的 Google Drive 模型文件链接返回 404（核验日期：2026-10-11）。
Decoupled Burst Denoising:
  title: 面向真实世界 RAW 连拍去噪的解耦学习方案
  tldr: 将真实世界 RAW 连拍去噪拆分成可分别学习的子问题。
Deep Snapshot HDR:
  title: 利用多曝光滤色阵列实现深度单次拍摄 HDR 成像
  tldr: 对多曝光滤色阵列联合进行去马赛克与融合，实现单次拍摄 HDR 成像。
TSWT Burst:
  title: 通过时间移位小波变换进行连拍去噪
  tldr: 利用时间移位小波变换进行连拍去噪。
Iterative Residual Burst:
  title: 面向连拍摄影应用的迭代残差卷积网络
  tldr: 利用迭代残差网络进行连拍去噪与去马赛克。
Night Sight:
  title: 极低光下的手持移动摄影
  tldr: Google Night Sight 手机成像管线，通过多帧融合与学习型自动白平衡实现手持极低光摄影。
Deep Burst Denoising:
  title: 深度连拍去噪
  tldr: 使用循环网络逐帧融合连拍图像，实现多帧去噪。
KPN:
  title: 利用核预测网络进行连拍去噪
  tldr: 接收噪声水平输入，预测逐像素卷积核，对多帧 RAW 进行配准与去噪。
  note: 仅提供训练代码与合成数据管线。
Neural Block-wise Auto-exposure:
  title: 用于单次拍摄高动态范围成像的神经分块自动曝光
  tldr: 根据预览图及其曝光时间，预测不重叠 16×16 传感器块的曝光时间；比较 RAW 与 sRGB 预览输入对单次拍摄 HDR 的影响。
  note: 2026-10-09 发布，2026-10-16 修订。2026-10-28 核验时，论文与仓库检索均未发现实现代码或预训练检查点链接。
Adaptive Color Grading:
  title: 自适应色彩分级
  tldr: 开源调色工具，将图像分为四个色调区域，为每区设置 CIELAB 偏移并合成为单个 3D LUT；K 近邻模型根据标注视频帧，为新图像预测区域阈值。
  note: 仓库包含示例训练数据；RAW HDR 视频数据集计划托管于 HDRVS 页面。
PrefLUT:
  title: PrefLUT：从成对偏好获得可复用、可细化的个性化色彩编辑
  tldr: 将用户偏好／非偏好图像对编码为可复用的 260 字节配置，以此为条件预测可导出的 3D LUT 与编辑强度，无需逐用户优化。
  weight_labels:
  - weights/preflut.pt（仓库内）
LoopLUT:
  title: LoopLUT：通过渐进区域细化的 3D 查找表实现实时 4K 图像增强
  tldr: 先应用全局 3D LUT，再应用由低分辨率门控选定区域色彩统计生成的残差 LUT；门控权重构成单位分解，因此每个 4K 图像像素只需 K 次查表。
FlowTool:
  title: FlowTool：通过流匹配控制图像精修工具参数
  tldr: 采用条件整流流（视觉语言模型主干与扩散 Transformer）生成精修工具参数，替代自回归多模态大模型推理，并在 MIT-Adobe FiveK 等数据集上评估。
Synthetic Dense Illuminant:
  title: 通过基于物理的合成数据进行稠密光源估计的通用管线
  tldr: 从基于物理的三维渲染场景提取逐像素光源色度图，渲染 74,321 张图像预训练单光源和多光源估计器，分别获得最高 28% 和 57% 的提升。
C2LUT:
  title: 用于相机色彩校正的光源自适应 3D 查找表
  tldr: 使用随场景光源调整的 3D LUT 进行相机色彩校正。
  note: 代码将在论文录用后发布。
