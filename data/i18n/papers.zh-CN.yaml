APP (Beyond RGB):
  title: 超越 RGB：用于 RAW 目标检测的自适应并行处理
  tldr: "针对人眼导向 ISP 不适合检测，以任务优化 RAW 适配模块并行处理输入并自适应融合分支输出，为检测器提供互补表征。"
Bayer-Domain Video CV:
  title: 通过快速运动估计与学习型感知残差实现高效 Bayer 域视频计算机视觉
  tldr: "针对视频感知冗余计算，直接输入 Bayer 并用快速并行运动估计传播特征，以轻量感知残差网络修正不准运动造成的特征误差。"
  note: 同团队相关工作：利用运动估计实现高效 Bayer 域计算机视觉，arXiv 2501.15119。
Dark-ISP:
  title: Dark-ISP：增强 RAW 图像处理以实现低光目标检测
  tldr: "针对低光渲染与检测目标不一致，将线性标定及非线性色调模块可微化、内容自适应化，通过物理先验和 Self-Boost 机制协同训练各阶段。"
  note: README 另有 Google Drive 链接，并称其为官方实现。
  weight_labels:
  - 模型检查点（百度网盘，提取码 2025）
HDR Tone Mapping for Detection:
  title: 用于高动态范围目标检测的实时场景自适应色调映射
  tldr: "针对 HDR RAW 与 LDR 预训练检测器的差距，结合神经光度标定和尺度不变局部色调映射，通过任务微调迁移检测，并在 Jetson 上评估实时约束。"
  weight_labels:
  - tmo_pre.pt（仓库 pretrained_model/ 内）
  - 含检测器的完整模型（Google Drive）
RAW Keypoints:
  title: RAW Bayer 图像的关键点检测与描述
  tldr: "针对机器人局部特征依赖完整 ISP 的开销，设计保留通道信息的两种 RAW 卷积核，联合学习 Bayer 关键点与描述子，并评测旋转及尺度鲁棒性。"
RAW-Bench:
  title: RAW-Adapter：将预训练视觉模型适配至相机 RAW 图像及其基准
  tldr: "针对 RAW 鲁棒性评测不足，扩展学习式 ISP 输入适配和模型适配，提供 17 类传感器域退化及 RAW 增强，评估成像与环境变化下的预训练视觉模型。"
  note: RAW-Bench 标为即将发布。
SFA RAW Detection:
  title: RAW 图像目标检测中的空间频率感知
  tldr: "针对检测中频谱操作缺少直观结构，将各频带逆变换为空间图，再与空间特征融合，利用轮廓和纹理线索进行 RAW 增强。"
γ-Quant:
  title: γ-Quant：迈向低比特模式识别的可学习量化
  tldr: "针对低带宽传感器识别，学习任务专属非线性量化替代固定均匀分级，并比较四比特 RAW 检测与十二比特参考的性能。"
  note: 目前仅发布惯性传感器部分；视觉实验代码计划稍后发布。
AdaptiveISP:
  title: AdaptiveISP：学习用于目标检测的自适应图像信号处理器
  tldr: "针对不同场景需不同处理结构与设置，以检测奖励训练强化学习策略选择 ISP 模块和参数，联合优化管线顺序及设置。"
  note: README 中两个检查点的文字标签与文件名对应关系颠倒；下载后请按文件名区分。
  weight_labels:
  - ckpt-lod-df-1.0（Release）
  - ckpt-lod-df-0.98（Release）
  - yolov3.pt（Release）
ISP-Teacher:
  title: ISP-Teacher：结合解耦正则化的图像信号处理，用于无监督域适应暗光目标检测
  tldr: "针对日间检测迁移至无标注暗场景，以 ISP 引导教师学生学习并加入解耦正则，将成像变换与无监督域适配结合，减少目标域标注需求。"
  note: 发表于 AAAI 2024 论文集，无 arXiv 版本；README 另有 Google Drive 镜像。
  weight_labels:
  - BDD100k 预训练模型（百度网盘，提取码 1234）
RAW-Adapter:
  title: RAW-Adapter：将预训练视觉模型适配至相机 RAW 图像
  tldr: "针对复用 sRGB 预训练检测与分割模型，学习 ISP 输入适配器和模型中间适配器，同时调整 RAW 输入分布与任务特征。"
  note: README 无权重；扩展版 RAW-Bench 位于 arXiv 2503.17027。
ρ-Vision:
  title: 利用相机 RAW 快照进行高效视觉计算
  tldr: "针对无 ISP 视觉缺少 RAW 数据，以 CycleGAN 目标训练模块化 CycleR2R 非配对 RAW/RGB 映射，用模拟 RAW 将已有检测器与压缩模型适配传感器观测。"
  note: MultiRAW 数据集也位于南京大学网盘。
  weight_labels:
  - 预训练模型（南京大学网盘）
DynamicISP:
  title: DynamicISP：用于图像识别的动态控制图像信号处理器
  tldr: "针对任务感知 ISP 的轻量需求，根据上一帧识别结果动态控制当前帧传统 ISP 参数，在保留低成本模块的同时提高适应性。"
Fully-Quantized Face Detector:
  title: 考虑移动图像传感器特性的全量化常开人脸检测器
  tldr: "针对传感器内常开人脸检测，以传感器感知合成 RAW 训练浅层三值权重网络，在严格计算和带宽限制下评估 ISP 前低比特检测。"
ISP-less CV:
  title: 实现无需 ISP 的低功耗计算机视觉
  tldr: "针对无 ISP 低功耗视觉缺少训练集，将已有 RGB 数据逆处理为 RAW，结合直接推理与像素内模拟去马赛克，提供 RAW COCO 并评估精度、能耗和带宽。"
LIS:
  title: 暗光中的实例分割
  tldr: "针对低光分割中的特征噪声，结合自适应加权降采样、平滑导向卷积及扰动抑制学习，并提供合成 RAW 增强和两千余组配对实例标注图像。"
  note: README 表格提供多种主干网络的模型链接。
  weight_labels:
  - Mask R-CNN 及其他模型（百度网盘）
RAOD / ROD:
  title: 迈向 RAW 目标检测：新基准与新模型
  tldr: "针对检测未充分利用 HDR 传感器信息，建立 ROD RAW 基准，以逐图自适应动态范围模块和检测器联合优化，并分析纹理与像素分布的影响。"
  note: RAOD 代码随 TA-ISP 仓库分发，含华为第三方声明；ROD 数据位于百度网盘，提取码 udqg。
Raw Instinct:
  title: Raw Instinct：相信分类器，跳过转换
  tldr: "针对分类是否需要 RGB 转换的问题，在配对 RAW/RGB 数据上训练两种 CNN，对比准确率与总时延，并发布直接传感器域识别数据集。"
  note: 数据集已在 Kaggle 发布，名称 raw-instinct。
Raw or Cooked:
  title: 生图还是熟图？RAW 图像目标检测
  tldr: "针对人眼优化预处理未必适合检测，联合学习 RAW 处理操作与检测器权重，并在 PASCALRAW 上比较传统 RGB 及已有 RAW 方法。"
Rawgment:
  title: Rawgment：考虑噪声的 RAW 增强，使识别适应多样环境
  tldr: "针对识别模型面对未知采集条件，在 RAW 增强中显式计入噪声并对齐增强后的噪声量，缩小域差距，减少逐环境采集需求。"
Shadow Detection in RAW:
  title: 用于 RAW 图像阴影检测的自适应光照映射
  tldr: "针对 ISP 牺牲全局对比影响阴影检测，将 HDR RAW 自适应映射到多个亮度区间，以阴影反馈联合训练映射与检测，并建立七千张 RAW 基准。"
All You Need is RAW:
  title: 你只需要 RAW：利用相机成像管线抵御对抗攻击
  tldr: "针对对抗扰动防御，将 RGB 经学习映射投影至 Bayer RAW 再由相机管线渲染，利用 RAW 分布作模型无关预处理先验，无需攻击专属训练。"
GenISP:
  title: GenISP：用于低光机器认知的神经 ISP
  tldr: "针对跨传感器低光检测，先转到设备无关颜色空间，再分两级预测全局颜色参数，以预训练检测器指导训练，并提供带标注 RAW-NOD 数据。"
  note: 第三方复现；数据集位于 igor-morawski/RAW-NOD。
IA-YOLO:
  title: 面向恶劣天气目标检测的图像自适应 YOLO
  tldr: "针对雾天与暗场景检测，由小型 CNN 预测可微图像滤波参数，与 YOLOv3 联合训练，以检测反馈学习逐图增强，无需干净图像监督。"
  weight_labels:
  - 测试集与模型（Google Drive）
  - 镜像（百度网盘，提取码 iayl）
Log-Gradient Input:
  title: 利用对数梯度输入图像提高 tinyML 计算机视觉的能效与鲁棒性
  tldr: "针对 tinyML 输入带宽与光照敏感性，以量化对数梯度图输入 CNN，评估首层极低比特量化、剪枝潜力及曝光变化下的识别稳定性。"
Dirty Pixels:
  title: Dirty Pixels：迈向端到端图像处理与感知
  tldr: "针对成像与识别分开优化，以可微架构联合训练去马赛克、去噪、去模糊、色调映射和分类，使用下游任务监督并在合成及实拍数据验证。"
  note: 采用 MIT 许可证。
  weight_labels:
  - README：代码、数据与训练完成的模型
ISP Distillation:
  title: ISP 蒸馏
  tldr: "针对跳过 ISP 后的识别性能下降，用无人工标签的 RAW/RGB 图像对，将 RGB 教师预测蒸馏到 RAW 学生，完成输入域适配。"
Lightweight HDR ISP:
  title: 通过傅里叶对抗网络构建轻量 HDR 相机 ISP，实现动态照明条件下的鲁棒感知
  tldr: "针对光照变化下的感知，先平衡亮度再利用频率先验去噪，以傅里叶频谱对抗学习约束轻量 CNN，并评测对检测和分割的影响。"
LOD:
  title: 构建极低光环境下的目标检测
  tldr: "针对极低光检测缺少基准，采集低光/正常光 RAW 配对及目标标注，评测传感器域处理，分析增强选择与检测性能的关系。"
  note: 数据集仓库提供百度网盘下载，提取码 2021；AdaptiveISP 等项目提供整理版本。
MAET:
  title: 结合正交切线正则性的多任务自编码变换，用于暗光目标检测
  tldr: "针对暗场景目标与光照退化表征纠缠，联合检测和自编码变换并施加正交切空间正则，借助合成低光从普通标注检测集训练。"
  note: 百度网盘镜像提取码为 1234。
  weight_labels:
  - MAET-COCO（Google Drive）
  - MAET-EXDark（Google Drive）
Matching in the Dark:
  title: 暗光中的匹配：用于低光场景图像对匹配的数据集
  tldr: "针对极暗场景局部匹配，建立 MID RAW 图像对数据，对比八种增强与十一种匹配流程，研究保留的传感器精度能否改善特征对应。"
  note: 仓库仅提供 MID 数据集（Google Drive，约 460 GB），无模型。
Optical Flow in the Dark:
  title: 暗光中的光流
  tldr: "针对先增强可能破坏运动一致性，利用物理 RAW 噪声合成训练数据，直接学习含噪低光光流，并采集覆盖多曝光的真实 RAW 基准。"
ISP4ML:
  title: ISP4ML：理解图像信号处理在高效深度学习视觉系统中的作用
  tldr: "针对分类所需 ISP 阶段不清，模拟可配置传感器及 ISP，在多种管线设置下训练 ImageNet CNN，量化精度与处理成本关系。"
Reconfiguring Pipeline:
  title: 为计算机视觉重配置成像管线
  tldr: "针对视觉系统能耗，以可逆成像模拟测试八类算法，提出摄影与视觉双模式，通过可调分辨率和 ADC 精度实现无 ISP 低功耗传感器配置。"
POS-ISP:
  title: POS-ISP：面向任务感知 ISP 的序列级管线优化
  tldr: "针对管线搜索反复执行的开销，一次预测完整 ISP 模块顺序与参数，以序列级强化学习仅根据最终任务奖励优化，无需中间监督。"
  weight_labels:
  - weights/*.pth（仓库内：LOD / LIS / KITTI）
ChameleonTuner:
  title: ChameleonTuner：主观场景中的自动 ISP 色彩调优
  tldr: "针对视角与视野差异使逐像素 LUT 标定不可靠的问题，建立区域颜色对应，在专用 3D LUT 参数空间进行多目标搜索，实现无像素对齐参考的可解释主观颜色调优。"
  note: 仓库表示代码即将发布。
Language Color ISP Tuning:
  title: 基于语言的色彩 ISP 调优
  tldr: "针对文字描述难直接对应 ISP 参数的问题，实现可微颜色处理模块，以预训练视觉语言模型的图文目标为损失，通过梯度下降调整传统渲染参数，匹配用户描述的风格。"
MLLM ISP Tuning:
  title: 结合动态偏好学习的多模态大语言模型引导 ISP 超参数优化
  tldr: "针对 ISP 搜索缺少语义理解与偏好反馈的问题，引入多模态大模型生成的场景和质量描述，并结合动态样本对生成与 DPO 对齐偏好，减少人工偏好标注需求。"
RL Photo-Finishing Tuning:
  title: 用于照片精修调优的目标条件强化学习
  tldr: "针对不可微照片处理管线搜索耗时的问题，以目标图像为条件训练强化学习策略，把渲染管线视为黑盒，迭代预测参数，支持对齐目标和风格参考且无需可微代理。"
  weight_labels:
  - envs/checkpoints/best_model*.zip（仓库内）
Sequence-Specific ISP Prior:
  title: 学习利用序列特定先验知识优化图像处理管线
  tldr: "针对 ISP 参数搜索忽略模块结构的问题，利用处理模块先后关系和参数相似性顺序预测超参数，并在检测、分割及图像质量目标上评估结构先验的作用。"
Attention-aware ISP Tuning:
  title: 用于图像处理管线超参数预测的注意力感知学习
  tldr: "针对所有图像共用固定 ISP 设置的问题，以多注意力网络建立 RAW 内容到参数空间的映射，并利用下游任务反馈端到端训练，为检测、分割和人眼观看预测逐图设置。"
DRL-ISP:
  title: DRL-ISP：基于深度强化学习的多目标相机 ISP
  tldr: "针对不同视觉目标需要不同处理的问题，深度强化学习代理根据任务奖励，从 51 个学习式或传统 ISP 工具中迭代选择操作，同时确定处理顺序及复原、颜色等工具组合。"
  note: 包含 scripts/4.copy_weights.sh 与预处理数据链接（SharePoint）。
Neural Photo-Finishing:
  title: 神经照片精修
  tldr: "针对传统照片处理需保留细粒度控制又不可求导，为各处理步骤设计神经代理并级联，支持图像视频风格迁移、ISP 滑杆参数回归与照片导向神经去马赛克。"
HDR Pipeline Opt.:
  title: 端到端高动态范围相机管线优化
  tldr: "针对 HDR 成像与下游任务分开优化的问题，以混合零阶和一阶块坐标下降联合调节 ISP 参数及检测器权重，并在 RAW 数据中模拟信噪比转换区伪影以考虑传感器特性。"
ReconfigISP:
  title: ReconfigISP：可重配置的相机图像处理管线
  tldr: "针对固定 ISP 结构难以适应不同传感器和任务的问题，训练传统模块的可微代理并进行可微架构搜索，同时调整模块组合和参数，以代理校准维持搜索过程的准确性。"
  note: README 提供一加数据集（Google Drive）。
RL Self-Enhancing ISP:
  title: 通过强化学习实现自增强相机图像与信号处理
  tldr: "针对图块伪影和异质噪声，聚类变分自编码特征，以软演员–评论家代理将噪声图块向邻近干净子空间变换，通过递归自增强和奖励驱动去块效应改善结果。"
HW-in-the-loop ISP:
  title: 硬件在环的端到端相机图像处理管线优化
  tldr: "针对可微代理与实际硬件 ISP 存在偏差的问题，将零阶随机多目标优化器直接连接硬件，根据检测、分割或观看目标反馈进行参数调优，避免代理误差。"
Differentiable Proxies:
  title: 利用可微代理优化黑盒图像处理超参数
  tldr: "针对任意目标下的黑盒 ISP 调优，以硬件在环训练 CNN 直接映射配置到评价指标，再进行一阶搜索，无需显式近似每个底层图像变换。"
ISP IQ Tuning:
  title: 利用非线性优化自动调整 ISP 图像质量
  tldr: "针对 ISP 模块依赖专家长时间手调的问题，结合自动参考生成、图像质量目标和非线性优化，以黑盒方式调节去噪、去马赛克和锐化模块，减少人工配置工作量。"
EMOVIS:
  title: EMOVIS：情绪优化的图像处理
  tldr: "针对成像管线缺少情绪表达控制的问题，通过标定用户实验将四类目标情绪映射到饱和度、局部色调、锐度等参数，在传统硬件处理阶段中实现情绪导向渲染。"
  note: 这是传统免训练 ISP 控制基线，并非神经 ISP；官方处理代码已公开，无需学习型模型检查点（核验日期：2026-10-28）。
PQDynamicISP:
  title: PQDynamicISP：追求感知质量、适配不同图像传感器的动态控制 ISP
  tldr: "针对传统 ISP 表达能力有限、完整神经渲染器过重的问题，动态预测轻量处理函数的全局与局部参数，以单条受控管线适配图像内容和不同传感器。"
  note: 属于依据图像内容自动控制，并未提供面向用户的编辑界面，因此归入 ISP 参数调优。2026-10-28 未找到官方实现。
BinRVR:
  title: 二值化高效 RAW 视频复原及其拓展
  tldr: "针对 RAW 视频复原开销，设计二值信息交互模块联合建模时空特征，并以激活分布感知二值卷积减轻量化误差，支持多比特精度选择与多种视频复原任务。"
  note: 仓库目前仅包含 README。
RawHDRV:
  title: 从单曝光 RAW 序列重建高动态范围视频
  tldr: "针对单曝光 RAW 视频的高光恢复，分别对齐 Bayer 通道，以曝光感知权重融合，并用曝光互补掩码修复饱和区域；发布逐帧带 HDR 参考的手机 RAW 视频数据。"
Real-Time Raw2Raw Mobile Denoise:
  title: 面向移动设备极低光超高清视频的高效实时 RAW 到 RAW 去噪
  tldr: "针对商业 ISP 中超高清低光视频的实时与功耗限制，结合跨传感器数据构建、移动端低复杂度网络和训练后重参数化、结构重整及量化，提供可嵌入现有管线的 RAW-to-RAW 方案。"
DarkVRAI:
  title: DarkVRAI：利用拍摄条件调制与连拍顺序选择性扫描进行低光 RAW 视频去噪
  tldr: "针对低光视频难配准与时序信息利用不足的问题，用拍摄元数据指导配准和去噪，并设计按连拍顺序的选择性扫描 BOSS 建模长程时序关系。"
RViDeformer:
  title: RViDeformer：高效 RAW 视频去噪 Transformer 与更大规模基准数据集
  tldr: "针对真实运动去噪数据不足与注意力计算昂贵的问题，重拍屏幕构建 ReCRVD，并设计融合局部、降采样全局及邻帧窗口的多分支时空 Transformer，以重参数化降低推理开销。"
  weight_labels:
  - RViDeformer 与 ISP 权重（Google Drive）
  - 镜像（百度网盘，提取码 4g5b）
Alignment-free Raw Video Demoire:
  title: 无需配准的 RAW 视频去摩尔纹
  tldr: "针对视频去摩尔纹显式配准开销大的问题，DemMamba 结合频率辅助空间处理与时序 Mamba，通过双向时间扫描和通道注意力融合帧间信息，保持输出一致性。"
BRVE:
  title: 二值化低光 RAW 视频增强
  tldr: "针对二值网络难以完成时序融合且量化损失大的问题，用空间与时间移位实现低成本对齐和融合，并以分布感知二值卷积补偿低光 RAW 视频增强中的量化损失。"
  note: README 还提供第二组模型，位于 Google Drive／百度网盘，提取码 wq1u。
  weight_labels:
  - LLRVD 模型（Google Drive）
  - 镜像（百度网盘，提取码 4v88）
Pre/Post-Demosaic Video Denoise:
  title: 结合去马赛克前后噪声去除的 RAW 视频处理
  tldr: "针对视频噪声水平变化与纹理保留的问题，加权组合去马赛克前后的自相似去噪器，并在两级前加入时间轨迹预滤波；噪声越强越侧重前级 RAW 去噪。"
VJDD:
  title: 迈向从 RAW 数据获得准确且时序一致的视频复原
  tldr: "针对 RAW 视频联合去噪去马赛克中的闪烁问题，以潜空间状态传播复用前帧信息，设计数据时间一致性与关系感知一致性损失，减轻不准光流监督造成的误差。"
  note: 仓库仅包含 README。
FloRNN:
  title: 通过前瞻前向循环模块模拟后向模块，实现单向视频去噪
  tldr: "针对双向循环去噪需要离线处理、时延和内存高的问题，结合前向循环与近未来前瞻模块，利用前向变形和边界扩展补偿运动缺失像素，实现固定时延的视频去噪。"
  weight_labels:
  - 预训练模型（Google Drive）
  - 预训练模型（百度网盘，提取码 ogua）
Real-RawVSR:
  title: Real-RawVSR：真实世界 RAW 视频超分辨率与基准数据集
  tldr: "针对真实 RAW 视频超分辨率缺少数据，以分光双相机采集 450 组低高分辨率视频对；双分支网络协同配准并融合打包 RGGB 与原始 Bayer 序列，重建高分辨率 sRGB。"
  note: 数据集位于百度网盘，提取码 hxyl。
  weight_labels:
  - 训练完成的模型（Google Drive）
Starlight Denoising:
  title: 星空下的舞蹈：星光条件下的视频去噪
  tldr: "针对低于 0.001 lux 的星光视频噪声，用 GAN 调整物理相机噪声模型，结合合成视频与真实噪声静态图训练去噪器，并采集运动星光视频验证极端照度表现。"
  weight_labels:
  - 噪声模型与去噪器（Google Drive）
EMVD:
  title: 通过循环时空融合实现高效多阶段视频去噪
  tldr: "针对移动端 RAW 视频去噪成本，依次执行历史帧递归融合、融合表示去噪和高频细化；各阶段在可学习可逆线性变换域运行，降低复杂度并支持端到端训练。"
  note: 非官方 PyTorch 复现；官方代码尚未开源。
RViDeNet:
  title: 动态场景基准数据集与监督式 RAW 视频去噪
  tldr: "针对动态场景难取得干净真值的问题，通过可控运动的逐静态时刻重复拍摄建立 CRVD；利用时空与通道相关性分别处理打包 Bayer 子序列，再融合 RAW 并可输出 sRGB。"
  weight_labels:
  - 训练完成的模型（Google Drive）
  - 训练完成的模型（百度网盘，提取码 xssc）
High-Sensitivity Noise Video:
  title: 通过探索高感光度相机噪声增强低光视频
  tldr: "针对高增益下简单噪声假设失效的问题，从物理来源建立高感光噪声模型并合成亮暗视频，用基于 LSTM 的网络联合学习时序去噪与亮度恢复。"
