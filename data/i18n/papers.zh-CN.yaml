  title: DynamicISP：用于图像识别的动态控制图像信号处理器
  tldr: 依据前一帧识别结果动态调整传统 ISP 参数。
Fully-Quantized Face Detector:
  title: 考虑移动图像传感器特性的全量化常开人脸检测器
  tldr: 围绕移动图像传感器输出特性设计全量化常开人脸检测器，研究低比特传感器输入。
ISP-less CV:
  title: 实现无需 ISP 的低功耗计算机视觉
  tldr: 省去 ISP，直接在 RAW 上运行计算机视觉任务以降低能耗。
LIS:
  title: 暗光中的实例分割
  tldr: 结合自适应下采样、平滑去噪特征与 LIS 数据集，进行低光 RAW 实例分割。
  note: README 表格提供多种主干网络的模型链接。
  weight_labels:
  - Mask R-CNN 及其他模型（百度网盘）
RAOD / ROD:
  title: 迈向 RAW 目标检测：新基准与新模型
  tldr: 提出 24 比特高动态范围 RAW 检测数据集 ROD，以及可学习 RAW 预处理模块。
  note: RAOD 代码随 TA-ISP 仓库分发，含华为第三方声明；ROD 数据位于百度网盘，提取码 udqg。
Raw Instinct:
  title: Raw Instinct：相信分类器，跳过转换
  tldr: 直接在 RAW 图像上训练分类器，并比较省去 ISP 转换时的准确率。
  note: 数据集已在 Kaggle 发布，名称 raw-instinct。
Raw or Cooked:
  title: 生图还是熟图？RAW 图像目标检测
  tldr: 比较 RAW 图像与经过 ISP 处理的图像作为目标检测输入的效果。
Rawgment:
  title: Rawgment：考虑噪声的 RAW 增强，使识别适应多样环境
  tldr: 在 RAW 域进行考虑噪声的数据增强，提高不同光照条件下识别的鲁棒性。
Shadow Detection in RAW:
  title: 用于 RAW 图像阴影检测的自适应光照映射
  tldr: 通过自适应光照映射在 RAW 图像中检测阴影。
All You Need is RAW:
  title: 你只需要 RAW：利用相机成像管线抵御对抗攻击
  tldr: 将图像映射回 RAW 并重新经过 ISP，以防御对抗攻击。
GenISP:
  title: GenISP：用于低光机器认知的神经 ISP
  tldr: 面向低光检测的精简神经 ISP，首先进行设备无关的色彩空间转换，并发布 RAW-NOD 数据集。
  note: 第三方复现；数据集位于 igor-morawski/RAW-NOD。
IA-YOLO:
  title: 面向恶劣天气目标检测的图像自适应 YOLO
  tldr: 使用小型网络预测可微 ISP 滤波参数，并与 YOLO 联合训练以处理雾天与低光场景。
  weight_labels:
  - 测试集与模型（Google Drive）
  - 镜像（百度网盘，提取码 iayl）
Log-Gradient Input:
  title: 利用对数梯度输入图像提高 tinyML 计算机视觉的能效与鲁棒性
  tldr: 采用对数梯度图像替代 ISP 处理后的图像作为 tinyML 输入，从而允许更低位宽。
Dirty Pixels:
  title: Dirty Pixels：迈向端到端图像处理与感知
  tldr: 将 ISP 与分类／检测网络联合端到端训练，在低光与噪声场景中优于分别优化。
  note: 采用 MIT 许可证。
  weight_labels:
  - README：代码、数据与训练完成的模型
ISP Distillation:
  title: ISP 蒸馏
  tldr: 将 RGB 模型蒸馏为 RAW 输入模型，从而跳过 ISP。
Lightweight HDR ISP:
  title: 通过傅里叶对抗网络构建轻量 HDR 相机 ISP，实现动态照明条件下的鲁棒感知
  tldr: 面向感知任务设计轻量 HDR 相机 ISP。
LOD:
  title: 构建极低光环境下的目标检测
  tldr: 提供低光／正常光配对 RAW 检测数据集 LOD，并研究 RAW 预处理对检测的影响。
  note: 数据集仓库提供百度网盘下载，提取码 2021；AdaptiveISP 等项目提供整理版本。
MAET:
  title: 结合正交切线正则性的多任务自编码变换，用于暗光目标检测
  tldr: 利用物理 ISP 模型合成低光退化，再通过多任务自编码变换学习暗光目标检测特征。
  note: 百度网盘镜像提取码为 1234。
  weight_labels:
  - MAET-COCO（Google Drive）
  - MAET-EXDark（Google Drive）
Matching in the Dark:
  title: 暗光中的匹配：用于低光场景图像对匹配的数据集
  tldr: 提供低光 RAW 图像对的特征匹配数据集。
  note: 仓库仅提供 MID 数据集（Google Drive，约 460 GB），无模型。
Optical Flow in the Dark:
  title: 暗光中的光流
  tldr: 合成低光 RAW 训练数据，研究极暗条件下的光流估计。
ISP4ML:
  title: ISP4ML：理解图像信号处理在高效深度学习视觉系统中的作用
  tldr: 定量分析各 ISP 模块对下游深度神经网络准确率与能耗的影响。
Reconfiguring Pipeline:
  title: 为计算机视觉重配置成像管线
  tldr: 分析视觉任务需要哪些 ISP 阶段，并提出简化的低功耗管线。
POS-ISP:
  title: POS-ISP：面向任务感知 ISP 的序列级管线优化
  tldr: 一次前向传播即可预测整个 ISP 模块序列及全部参数，并利用下游任务奖励进行优化。
  weight_labels:
  - weights/*.pth（仓库内：LOD / LIS / KITTI）
ChameleonTuner:
  title: ChameleonTuner：主观场景中的自动 ISP 色彩调优
  tldr: 面向主观评价场景自动调整 ISP 色彩参数。
  note: 仓库表示代码即将发布。
Language Color ISP Tuning:
  title: 基于语言的色彩 ISP 调优
  tldr: 使用视觉语言模型，根据对目标外观的自然语言描述自动调整色彩 ISP 参数。
MLLM ISP Tuning:
  title: 结合动态偏好学习的多模态大语言模型引导 ISP 超参数优化
  tldr: 利用多模态大语言模型评估图像并动态学习偏好，引导 ISP 超参数搜索。
RL Photo-Finishing Tuning:
  title: 用于照片精修调优的目标条件强化学习
  tldr: 通过目标条件强化学习自动调整照片精修／后端 ISP 参数，与 AdaptiveISP 出自同一团队。
  weight_labels:
  - envs/checkpoints/best_model*.zip（仓库内）
Sequence-Specific ISP Prior:
  title: 学习利用序列特定先验知识优化图像处理管线
  tldr: 利用 ISP 模块顺序的先验知识预测参数，与 Attention-aware ISP Tuning 出自同一团队。
Attention-aware ISP Tuning:
  title: 用于图像处理管线超参数预测的注意力感知学习
  tldr: 根据图像内容预测 ISP 超参数，并利用注意力建模参数之间的关系。
DRL-ISP:
  title: DRL-ISP：基于深度强化学习的多目标相机 ISP
  tldr: 通过强化学习从工具箱中选择 ISP 模块，同时兼顾检测、分割和深度估计等多个目标。
  note: 包含 scripts/4.copy_weights.sh 与预处理数据链接（SharePoint）。
Neural Photo-Finishing:
  title: 神经照片精修
  tldr: 为相机照片精修管线构建可微代理，从目标图像反求管线参数。
HDR Pipeline Opt.:
  title: 端到端高动态范围相机管线优化
  tldr: 面向 HDR 场景端到端优化相机管线，同时涵盖传感器曝光与 ISP 参数。
ReconfigISP:
  title: ReconfigISP：可重配置的相机图像处理管线
  tldr: 利用可微代理与类似神经架构搜索的方法，自动选择 ISP 模块组合及参数，并发布一加相机数据。
  note: README 提供一加数据集（Google Drive）。
RL Self-Enhancing ISP:
  title: 通过强化学习实现自增强相机图像与信号处理
  tldr: 使用强化学习调整相机和 ISP 参数。
HW-in-the-loop ISP:
  title: 硬件在环的端到端相机图像处理管线优化
  tldr: 将真实硬件 ISP 纳入优化环路，通过进化策略为下游任务调整参数。
Differentiable Proxies:
  title: 利用可微代理优化黑盒图像处理超参数
  tldr: 训练可微代理网络模拟黑盒硬件 ISP，再通过梯度下降调整 ISP 参数。
ISP IQ Tuning:
  title: 利用非线性优化自动调整 ISP 图像质量
  tldr: 以图像质量指标为目标，通过非线性优化自动调整 ISP 参数。
EMOVIS:
  title: EMOVIS：情绪优化的图像处理
  tldr: 将目标情绪映射为传统 16 比特 RAW ISP 的饱和度、亮度、对比度与色彩控制，并通过用户研究标定。
  note: 这是传统免训练 ISP 控制基线，并非神经 ISP；官方处理代码已公开，无需学习型模型检查点（核验日期：2026-10-28）。
PQDynamicISP:
  title: PQDynamicISP：追求感知质量、适配不同图像传感器的动态控制 ISP
  tldr: 为轻量传统 ISP 函数动态预测全局与局部参数，以提高不同传感器的感知质量。
  note: 属于依据图像内容自动控制，并未提供面向用户的编辑界面，因此归入 ISP 参数调优。2026-10-28 未找到官方实现。
BinRVR:
  title: 二值化高效 RAW 视频复原及其拓展
  tldr: BRVE 的扩展，采用二值化与多比特 RAW 视频复原，覆盖低光增强、去噪、去模糊和超分辨率。
  note: 仓库目前仅包含 README。
RawHDRV:
  title: 从单曝光 RAW 序列重建高动态范围视频
  tldr: 从单曝光 RAW 视频序列重建 HDR 视频。
Real-Time Raw2Raw Mobile Denoise:
  title: 面向移动设备极低光超高清视频的高效实时 RAW 到 RAW 去噪
  tldr: 在手机上对极低光 4K RAW 视频进行实时 RAW 到 RAW 去噪。
DarkVRAI:
  title: DarkVRAI：利用拍摄条件调制与连拍顺序选择性扫描进行低光 RAW 视频去噪
  tldr: 结合拍摄条件调制与连拍顺序选择性扫描，实现低光 RAW 视频去噪，是 AIM 2025 方案。
RViDeformer:
  title: RViDeformer：高效 RAW 视频去噪 Transformer 与更大规模基准数据集
  tldr: 提供通过屏幕重拍采集的更大规模 RAW 视频去噪数据集，并提出高效 Transformer。
  weight_labels:
  - RViDeformer 与 ISP 权重（Google Drive）
  - 镜像（百度网盘，提取码 4g5b）
Alignment-free Raw Video Demoire:
  title: 无需配准的 RAW 视频去摩尔纹
  tldr: 无需显式帧间配准即可去除 RAW 视频中的摩尔纹。
BRVE:
  title: 二值化低光 RAW 视频增强
  tldr: 采用分布感知二值卷积的 1 比特低光 RAW 视频增强网络。
