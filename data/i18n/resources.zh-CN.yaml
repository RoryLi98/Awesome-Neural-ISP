    capture: Sony IMX586 手机 RAW 与富士 GFX100 sRGB 配对
    size: 需要在 CodaLab 注册
    use: 手机 NPU 上的 ISP 训练与运行时间评测
  Fujifilm UltraISP:
    source: MicroISP / MAI 2022
    capture: 手机传感器 RAW 与富士 GFX100（1.02 亿像素）图像配对
