config:
  title: Awesome Neural ISP · 神经图像信号处理论文集
  tagline: 汇集神经相机 ISP 的论文、公开代码与预训练权重，并提供其所基于的经典成像流水线入门指南。
categories:
  e2e:
    title: 端到端 RAW→sRGB
    short: 端到端 ISP
    description: 学习从 RAW 到显示图像的完整映射；以弱光、多帧、视频或下游任务为主要目标的工作归入对应主分类。移动部署与可控能力按跨任务维度归集。
    intro: 学习从 RAW 到显示图像的完整映射。
  controllable:
    title: 可控神经 ISP
    short: 可控神经 ISP
    description: 学习式渲染中的显式用户参数、风格或参考控制、可替换学习模块与相机条件化输出。逐篇标明控制接口，区分交互式编辑与相机条件化。仅处理颜色的模块和传统参数调优基线保留在各自主分类。
    intro: 查看可编辑的学习式渲染与相机条件化 ISP；每篇论文单独标明控制接口。
  mobile:
    title: 移动端与高效 ISP
    short: 移动端 / 高效 ISP
    description: 明确针对移动端、边缘设备或传感器计算约束设计或评测的方法，跨越完整 ISP、去噪、去马赛克与视频。这里按部署条件归集，覆盖不同成像任务；不据少数论文推断整个领域的训练范式变化。
    intro: 跨任务查看面向移动端与传感器效率的方法；效率结论以各论文实际测试硬件为准。
  denoise:
    title: RAW 去噪与噪声建模
    short: 去噪与噪声
    description: 单幅 RAW 去噪，以及传感器噪声的标定、建模与合成。以亮度和成像恢复为主要目标的工作归入弱光增强，多帧与时序处理归入连拍或视频。
    intro: 单幅 RAW 去噪，以及传感器噪声的标定、建模与合成。
  lowlight:
    title: 弱光成像与曝光校正
    short: 弱光与曝光
    description: 以弱光 RAW 成像、亮度恢复和曝光校正为核心，也收录可解释的传统管线基线。仅研究噪声的工作归入去噪，多帧融合和视频时序方法分别归入连拍与视频。
    intro: 以弱光 RAW 成像、亮度恢复和曝光校正为核心，也收录可解释的传统管线基线。
  demosaic:
    title: 去马赛克与重马赛克
    short: 去马赛克 / 重马赛克
    description: 以 CFA 重建或排列转换为核心，涵盖联合去噪及 Bayer、Quad、Nona、HybridEVS 等模式。专门的超分辨率和其他 RAW 退化另设分类；仅用连拍训练不等于推理时进行多帧融合。
    intro: 以 CFA 重建或排列转换为核心，涵盖联合去噪及 Bayer、Quad、Nona、HybridEVS 等模式。
  burst:
    title: 连拍融合与 HDR 成像
    short: 连拍 / HDR
    description: 涵盖静态多帧融合复原、超分与 HDR，以及传感器域单次曝光 HDR 重建。弱光多帧融合归入此类，生成连续时序输出的方法归入视频。
    intro: 涵盖静态多帧融合复原、超分与 HDR，以及传感器域单次曝光 HDR 重建。
  video:
    title: RAW 视频
    short: RAW 视频
    description: 涵盖 RAW 视频去噪、增强、去摩尔纹、超分与 HDR 重建。连续时序输出及一致性要求与多帧生成单图的连拍任务不同；以识别为目标的视频工作归入机器视觉。
    intro: 涵盖 RAW 视频去噪、增强、去摩尔纹、超分与 HDR 重建。
  color:
    title: 颜色校正、色调与修图
    short: 色彩 / 色调 / 修图
    description: 颜色标定、调色、LUT、色调映射与摄影修图。部分方法处理已渲染 RGB，作为 ISP 后期模块或历史背景收录，不视为完整 RAW→RGB 管线。
    intro: 颜色标定、调色、LUT、色调映射与摄影修图。
  inverse:
    title: 逆向 ISP 与 RAW 合成
    short: 逆向 ISP / RAW 合成
    description: 涵盖 RGB→RAW 或线性色彩重建、RAW 生成和跨相机 RAW 映射，也包括不以学习式编码为核心的稀疏元数据方法。以熵编码或率失真优化为核心的工作归入压缩；双向模型按主要研究贡献归类。
    intro: 涵盖 RGB→RAW 或线性色彩重建、RAW 生成和跨相机 RAW 映射，也包括不以学习式编码为核心的稀疏元数据方法。
  task:
    title: 面向机器视觉的 ISP
    short: 机器视觉
    description: 面向检测、分割、识别、匹配、运动估计与机器人动作的 RAW 成像。以特定下游奖励选择管线的方法归入此类；同时支持多种目标的通用 ISP 搜索方法归入参数调优。
    intro: 面向检测、分割、识别、匹配、运动估计与机器人动作的 RAW 成像。
  tuning:
    title: ISP 参数与管线优化
    short: ISP 参数与管线优化
    description: 通过代理模型、搜索、强化学习或语言指导，优化或预测传统及可微 ISP 的参数与模块顺序，涵盖通用和多目标系统。可供用户编辑的学习式渲染还可进入可控神经 ISP。
    intro: 通过代理模型、搜索、强化学习或语言指导，优化或预测传统及可微 ISP 的参数与模块顺序，涵盖通用和多目标系统。
  report:
    title: 挑战报告、综述与评测
    short: 报告 / 综述 / 评测
    description: 挑战报告、综述、评测协议与观点论文。同一报告只计为一篇文献，单独发布的参赛实现作为该报告下的资源保留；数据集论文按其评测任务归类。
    intro: 挑战报告、综述、评测协议与观点论文。
  restoration:
    title: RAW 去模糊与其他复原
    short: 其他 RAW 复原
    description: 涵盖 RAW 去模糊、去雨、去反射、去摩尔纹、屏下成像及混合退化复原；以去马赛克、去噪或超分辨率为主要目标的工作归入对应分类。
    intro: 涵盖 RAW 去模糊、去雨、去反射、去摩尔纹、屏下成像及混合退化复原。
  super-resolution:
    title: RAW 超分辨率与重采样
    short: RAW 超分 / 重采样
    description: 单幅 RAW 超分辨率、真实退化建模与学习式 RAW 缩小；以分辨率变化为核心的联合去马赛克超分也归入此类。多帧超分分别归入连拍或视频。
    intro: 单幅 RAW 超分辨率、真实退化建模与学习式 RAW 缩小。
  white-balance:
    title: 白平衡与颜色恒常性
    short: 白平衡与颜色恒常性
    description: 光源估计、跨相机颜色恒常性、混合光照和拍摄后白平衡编辑，以及相关数据集。通用调色、LUT 增强与色调映射归入色彩与色调分类。
    intro: 光源估计、跨相机颜色恒常性、混合光照和拍摄后白平衡编辑，以及相关数据集。
  compression:
    title: RAW 压缩与联合编码
    short: RAW 压缩
    description: 无损或有损 RAW 编码、JPEG 加学习式元数据的重建，以及渲染与压缩联合优化。以码率、存储或熵编码为核心，区别于一般逆向 ISP。
    intro: 无损或有损 RAW 编码、JPEG 加学习式元数据的重建，以及渲染与压缩联合优化。
