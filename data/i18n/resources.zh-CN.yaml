# 中文内容覆盖；条目身份、链接与数值以英文源数据为准。
config:
  title: Awesome Neural ISP · 神经图像信号处理论文集
  tagline: 汇集神经相机 ISP 的论文、公开代码与预训练权重，并提供其所基于的经典成像流水线入门指南。
categories:
  e2e:
    title: 端到端 RAW-to-sRGB
    short: 端到端 ISP
    description: 用一个网络替代完整 ISP。早期方法主要基于 CNN（DeepISP、PyNET、LiteISPNet），近期引入扩散与自回归先验。RAW/sRGB 训练对的不精确对齐是持续难题。显式渲染控制、相机条件化与模块化编辑见“可控神经 ISP”。
  controllable:
    title: 可控神经 ISP
    short: 可控 ISP
    description: 通过显式控制信号或可替换阶段调节学习式成像。用户可编辑管线包括 CtrlISP 与 Modular Neural ISP；相机／风格条件化包括 ParamISP、MetaISP 与 Uni-ISP，但元数据条件化不必然提供用户编辑界面。NILUT 和白平衡编辑等局部模块仍归入“白平衡、颜色与色调”，编辑感知
      RAW 重建仍归入“逆向 ISP”。自动参数预测与传统 ISP 控制归入“ISP 参数调优”，面向下游任务奖励的优化归入“面向机器视觉的 ISP”。
  mobile:
    title: 移动端与轻量化 ISP
    short: 移动端 ISP
    description: 为手机 NPU 和 GPU 实时运行设计的 ISP，主要来自 Mobile AI（MAI）和 NTIRE 挑战赛。自 2025 年起，研究重心转向无需配对数据的训练。
  denoise:
    title: RAW 去噪与噪声建模
    short: RAW 去噪
    description: 位于成像流水线前端。主要研究脉络从泊松–高斯模型发展到基于物理成因的噪声建模（ELD）、暗帧采样、生成式噪声模型，以及免标定和盲去噪。
  lowlight:
    title: 弱光 RAW 增强
    short: 弱光 RAW
    description: 由 SID 开启的极弱光 RAW-to-sRGB 研究。方法从 U-Net 发展到解耦的两阶段结构（DNF）、Mamba 与扩散模型，近期也研究欠曝光与过曝光的联合校正。用户可调节的弱光成像（CtrlISP）见“可控神经 ISP”。
  demosaic:
    title: 去马赛克、联合复原与 RAW 超分辨率
    short: 去马赛克 / 超分
    description: 将 CFA 颜色插值与去噪、超分辨率联合建模，近年来扩展到 Quad、Nona、HybridEVS 等非标准 Bayer 传感器。
  burst:
    title: 连拍与 HDR
    short: 连拍 / HDR
    description: 对齐并融合多帧 RAW 图像，实现超分辨率、去噪和高动态范围成像。BurstSR 与 NTIRE 挑战赛是主要评测基准。
  video:
    title: RAW 视频
    short: RAW 视频
    description: RAW 视频的去噪、超分辨率与弱光增强，也包括 BRVE 和 BinRVR 两种二值化网络。
  color:
    title: 白平衡、颜色与色调
    short: 白平衡 / 颜色 / 色调
    description: 覆盖流水线中后段：光源估计（颜色恒常性）、sRGB 白平衡校正、颜色校正与三维查找表（3D LUT）、色调映射和图像润饰。跨相机泛化与元数据利用是近期重点。
  inverse:
    title: 逆向 ISP、RAW 重建与压缩
    short: 逆向 ISP
    description: 从 sRGB 恢复 RAW，用于合成训练数据、节省 RAW 存储空间或进行跨相机迁移；涵盖 Unprocessing、CycleISP、InvISP，以及 2025–2026 年的扩散与流匹配方法。
  task:
    title: 面向机器视觉的 ISP
    short: 机器视觉 ISP
    description: ISP 输出服务于检测器或分割器：包括联合训练的 ISP、直接在 RAW 上进行感知的方法、适配器，以及 RAW 目标检测数据集。
  tuning:
    title: ISP 参数调优
    short: ISP 调参
    description: 不替换 ISP，而是通过可微代理、演化策略、强化学习，以及自 2025 年起出现的多模态大模型评判器，自动调整硬件或可微 ISP 的参数。也保留 EMOVIS 等传统用户控制基线。学习式可编辑渲染归入“可控神经 ISP”，由检测奖励驱动的序列优化（POS-ISP）归入“面向机器视觉的
      ISP”。
  report:
    title: 挑战赛与综述
    short: 挑战赛 / 综述
    description: 汇集 AIM、Mobile AI、NTIRE、MIPI 挑战赛报告、综述、评测框架与观点论文，帮助快速了解各研究方向的方法、数据和开放问题。
