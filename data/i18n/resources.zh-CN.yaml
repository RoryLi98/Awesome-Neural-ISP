trends:
- title: 从 CNN 到生成式 ISP
  text: CNN 曾是截至 2023 年的主流。随后 Transformer 和 Mamba 进入弱光增强与去马赛克；从 2025 年起，扩散与流匹配同时用于正向 ISP 和 RGB-to-RAW。
  examples: PyNET → LiteISPNet → ISPDiffuser · LDM-ISP · RAW-Flow · SpiralDiff
- title: 训练数据仍是瓶颈
  text: 手机 RAW 与单反 sRGB 通常无法精确对齐，也存在颜色差异。应对方法从对齐感知损失发展到合成数据与跨相机 RAW 映射；2025–2026 年的挑战赛进一步转向完全非配对训练。
  examples: LiteISPNet · Unprocessing · Day-to-Night · Rawformer · NTIRE 2026 非配对 ISP
- title: 将相机元数据输入网络
  text: 显式编码 EXIF、ISO、颜色矩阵与拍摄时间，以支持跨相机泛化和可控渲染。
  examples: ParamISP · MetaISP · CCMNet · Time-Aware AWB · PMRID k-Sigma
- title: 部署：从挑战赛走向低比特网络
  text: MAI 挑战赛在手机 NPU 上测量提交方案的运行时间，催生了 MicroISP、PyNET-V2 等紧凑设计。显式量化与二值化研究主要集中在 RAW 视频和去马赛克。
  examples: MAI 2021/2022/2025 · MicroISP · BRVE · BinRVR · BMTNet · RAWDet-7
- title: 服务于机器感知的 ISP
  text: 自 2023 年起，RAW 检测数据集与方法快速增长，包括联合训练的 ISP、通过强化学习选择的 ISP 模块序列，以及直接接收 RAW 的适配器。
  examples: Dirty Pixels · AdaptiveISP · RAW-Adapter · TA-ISP · POS-ISP · RAWild
- title: 重新走向可控与模块化
  text: “可控神经 ISP”专题区分用户编辑与可替换处理阶段，以及相机／风格条件化。自动参数调优和任务驱动优化仍独立归类；NILUT 与编辑感知 RAW 重建则串联颜色模块和逆向成像。
  examples: CtrlISP · Modular Neural ISP（SIGGRAPH Asia 2026）· ParamISP · MetaISP · Uni-ISP
