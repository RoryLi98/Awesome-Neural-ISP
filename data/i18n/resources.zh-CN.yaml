trends:
- title: CNN、注意力与生成式 ISP
  text: 目录同时包含金字塔 CNN 管线、Transformer 与状态空间复原，以及扩散、流匹配和自回归渲染或重建。这些结构并存，分别应对质量、训练与部署约束。
  examples: PyNET · LiteISPNet · LDM-ISP · RAW-Flow · Retinex-RAWMamba · VAR-ISP
- title: 面对不完美或缺失的配对数据
  text: 跨相机 RAW 与 RGB 可能存在几何和颜色差异。对齐感知损失、合成训练数据与传感器域转换分别处理其中不同问题。MAI 2025 与 NTIRE 2026 包含明确的非配对手机 ISP 赛题。
  examples: LiteISPNet · Unprocessing · Day-to-Night · Rawformer · NTIRE 2026 Unpaired ISP
- title: 拍摄条件感知
  text: EXIF 设置、设备嵌入、标定颜色矩阵与拍摄时间提供不同条件信息；输入这些信息不自动意味着暴露了用户编辑控制。
  examples: ParamISP · MetaISP · Uni-ISP · CRISPnet · CCMNet · Time-Aware AWB
- title: 部署效率取决于硬件
  text: 移动 ISP 挑战评测目标设备上的执行，紧凑与二值化设计也出现在去噪、去马赛克和视频中。参数量、量化程度和实测延迟回答的是不同效率问题。
  examples: MicroISP · PyNET-V2 Mobile · PMRID · BRVE · BinRVR · BMTNet
- title: 面向感知与动作的成像
  text: 任务驱动渲染、直接 RAW 推理、学习式管线选择及输入适配器，为下游模型优化信息。基准涵盖检测、分割、匹配和机器人操作。
  examples: Dirty Pixels · AdaptiveISP · RAW-Adapter · TA-ISP · POS-ISP · RawVLA
- title: 区分不同可控能力
  text: 可控神经 ISP 分别标注用户参数、参考风格调整、可替换学习阶段与相机条件化。仅处理颜色的编辑、逆向重建和自动调优通过独立标签关联，保留各自主分类。
  examples: CtrlISP · Modular Neural ISP · DRIFT · Deep-FlexISP · Neural Photo-Finishing · ParamISP
