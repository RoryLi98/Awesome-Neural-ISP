    use: 用于立体 / 沉浸式视频处理与编码的相机原生 RAW 数据（CC BY-NC 4.0）
tools:
  rawpy:
    title: rawpy：LibRaw 的 Python 封装
    description: 读取几乎所有相机 RAW / DNG 文件，并执行基本后处理；是 RAW 数据集预处理的常用工具。
  fast-openISP:
    title: fast-openISP：openISP 的向量化 Python 重实现
    description: 完整传统 ISP 流水线，包括黑电平校正、坏点校正、去马赛克、自动白平衡、颜色校正矩阵、伽马、去噪与锐化，便于与学习式模型比较。
  openISP:
    title: openISP：开源传统 ISP
    description: 传统 ISP 的早期开源参考实现。
  Infinite-ISP:
    title: Infinite-ISP：面向硬件移植的完整 ISP 流水线
    description: 按硬件 ISP 模块组织传统算法，并计划加入学习式模块。
  simple-camera-pipeline:
    title: Simple Camera Pipeline（由 SIDD 作者提供）
    description: 轻量 RAW→sRGB 相机流水线，提供 MATLAB / Python 版本，常用于渲染 SIDD 及类似数据。
  mv-lab/AISP:
    title: AI 图像信号处理与计算摄影
    description: Marcos Conde 等开发的学习式 ISP 工具箱，包含 RAW 退化生成、挑战赛基线、LPIENet、NILUT 等。
  ISP-pipeline-hdrplus:
    title: ISP-pipeline-hdrplus（传统 ISP + HDR+，附中文文档）
    description: 传统 ISP 实现，包含 HDR+ 多帧融合和标定工具；测试图像与工具托管在百度网盘，提取码 aaaa。
  LibRaw:
    title: LibRaw：RAW 图像读取与处理库
    description: dcraw 的后继项目，可从几乎所有相机格式中提取 RAW 像素、CFA 排列、黑电平、白平衡和其他元数据。
  colour-demosaicing:
    title: Colour — 去马赛克
    description: 面向 Bayer 马赛克的经典 CFA 去马赛克算法，包括双线性插值、Malvar 2004 与 Menon 2007 DDFAPD。
  colour:
    title: Colour 色彩科学工具箱
    description: 色彩科学工具箱，包含颜色空间、色适应、色卡数据，以及 CIEDE2000 等色差指标。
  hdr-plus:
    title: 以 Halide 实现 HDR+
    description: HDR+ 连拍对齐与融合流水线的开放实现。
  darktable:
    title: darktable
    description: 开源 RAW 显影工具，采用模块化、基于场景亮度的处理流水线。
  RawTherapee:
    title: RawTherapee
    description: 开源 RAW 显影工具，提供多种去马赛克、去噪与色调映射选项。
resources:
  tutorials:
  - name: 理解相机内渲染流水线及 AI / 深度学习的作用
    by: Michael S. Brown (ICCV 2023 tutorial)
    url: http://www.eecs.yorku.ca/~mbrown/ICCV2023_Brown.html
    description: 介绍色彩科学、传统 ISP 阶段以及深度学习带来的变化；课件可在线获取。
  - name: 移动计算摄影导览
    by: Delbracio, Kelly, Brown, Milanfar (Annual Review of Vision Science 2021)
    url: https://doi.org/10.1146/annurev-vision-093019-115521
    description: 综述手机相机流水线，涵盖连拍融合到学习式处理。
  - name: 使用 MATLAB 处理 RAW 图像
    by: Rob Sumner
    url: https://rcsumner.net/raw_guide/RAWguide.pdf
    description: 附代码的逐步教程，从 RAW 文件生成可显示的图像。
  - name: 彩色图像处理流水线
    by: Ramanath, Snyder, Yoo, Drew (IEEE Signal Processing Magazine 2005)
    url: https://doi.org/10.1109/MSP.2005.1407713
    description: 数字静态相机成像流水线各阶段的经典综述。
  - name: 用于操控相机成像流水线的软件平台
    by: Karaimer and Brown (ECCV 2016)
    url: https://doi.org/10.1007/978-3-319-46448-0_26
    description: 开放相机流水线的每个阶段，可检查并修改中间结果。
  books:
  - name: 计算机视觉：算法与应用（第 2 版）
    by: Richard Szeliski (2022)
    url: https://szeliski.org/Book/
    description: 可免费在线阅读；第 2.3 节介绍数字相机与图像形成。
  - name: 数字静态相机的图像传感器与信号处理
    by: Junichi Nakamura (ed.), CRC Press
    url: https://doi.org/10.1201/9781420026856
    description: 介绍数字静态相机的传感器物理、噪声与处理链路。
  classic:
  - stage: 噪声
    items:
    - name: CCD 相机辐射定标与噪声估计
      by: Healey and Kondepudy, TPAMI 1994
      url: https://doi.org/10.1109/34.276126
    - name: 单幅 RAW 数据的实用泊松–高斯噪声建模与拟合
      by: Foi et al., TIP 2008
      url: https://doi.org/10.1109/TIP.2008.2001399
    - name: 基于稀疏三维变换域协同滤波的图像去噪（BM3D）
      by: Dabov et al., TIP 2007
      url: https://doi.org/10.1109/TIP.2007.901238
    - name: 泊松–高斯噪声广义 Anscombe 变换的最优逆变换
      by: Mäkitalo and Foi, TIP 2013
      url: https://doi.org/10.1109/TIP.2012.2202675
  - stage: 去马赛克
    items:
    - name: Bayer 排列彩色图像去马赛克的高质量线性插值
      by: Malvar, He and Cutler, ICASSP 2004
