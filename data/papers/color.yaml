  framework: PyTorch
  tldr: Uses reinforcement learning to iteratively adjust white balance in low-light night-time scenes.
  note: download.sh / download.bat are also provided for one-click download
- name: SAFE
  title: 'SAFE: Scene-Aware Feature Modulation for Color Constancy with Learned Color Space in Pure-Color Scenes'
  venue: arXiv
  year: 2026
  paper: https://arxiv.org/abs/2608.13967
  status: no-code
  tldr: Scene-aware color constancy for scenes dominated by large pure-color regions (same group as RL-AWB).
- name: VLM-CC
