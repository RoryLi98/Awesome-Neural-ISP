# color: one entry per paper; see CONTRIBUTING.md for the schema
- name: C2LUT
  title: Illuminant-Adaptive 3D Lookup Tables for Camera Color Correction
  venue: arXiv
  year: 2026
  paper: https://arxiv.org/abs/2607.11681
  code: https://github.com/claudiom4sir/C2LUT
  status: coming-soon
  tldr: Camera color correction with 3D LUTs that adapt to the scene illuminant.
  note: “The code will be released upon acceptance”
- name: Multispectral CC
  title: Leveraging Multispectral Sensors for Color Correction in Mobile Cameras
  venue: CVPR
  year: 2026
  paper: https://arxiv.org/abs/2512.08441
  code: https://github.com/LucaCogo/Mobile-Spectral-CC
  status: weights-in-repo
  weights:
  - label: pretrained/ (in repo, one folder per camera)
    url: https://github.com/LucaCogo/Mobile-Spectral-CC/tree/main/pretrained
  framework: PyTorch
  tldr: Uses an auxiliary multispectral sensor on smartphones to perform camera color correction.
  note: 'Dataset on HF: LucaCogo/MobileSpectralCCDataset'
- name: RL-AWB
  title: 'RL-AWB: Deep Reinforcement Learning for Auto White Balance Correction in Low-Light Night-time Scenes'
  venue: ECCV
  year: 2026
  paper: https://arxiv.org/abs/2601.05249
  code: https://github.com/BrianChen1120/RL-AWB
  status: weights
  weights:
  - label: NCC model (Dropbox)
