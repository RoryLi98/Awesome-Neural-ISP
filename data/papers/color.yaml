- name: DPED
  title: DSLR-Quality Photos on Mobile Devices with Deep Convolutional Networks
  venue: ICCV
  year: 2017
  paper: https://arxiv.org/abs/1704.02470
  code: https://github.com/aiff22/DPED
  status: weights-in-repo
  weights:
  - label: models_orig/{iphone,sony,blackberry}_orig (in repo)
    url: https://github.com/aiff22/DPED/tree/master/models_orig
  framework: TensorFlow
  tldr: To bridge phone-to-DSLR appearance differences, trains a residual CNN with content, color and adversarial texture
    losses on a multi-phone paired dataset; operates on processed photographs rather than RAW sensor measurements.
- name: Adaptive Color Grading
  title: Adaptive Color Grading
  venue: CIC
  year: 2026
  paper: https://arxiv.org/abs/2609.21169
  code: https://github.com/SamsungLabs/adaptive-color-grading
  status: code
  framework: Python (scikit-learn)
  tldr: To control shadows/highlights independently, predicts tonescale-region thresholds with K-nearest neighbors trained
    on annotated video frames; region-specific CIELAB adjustments compose into one deployable 3D LUT within an open grading
    tool.
  note: Example training data ships with the repository; the RAW HDR video dataset is to be hosted on the HDRVS page.
- name: PrefLUT
  title: 'PrefLUT: Reusable and Refinable Personalized Color Editing from Pairwise Preferences'
  venue: arXiv
  year: 2026
  paper: https://arxiv.org/abs/2609.34133
  code: https://github.com/LouckXu/PrefLUT
  status: weights-in-repo
  weights:
  - label: weights/preflut.pt (in repo)
    url: https://github.com/LouckXu/PrefLUT/tree/main/weights
  framework: PyTorch
  tldr: To retain preferences beyond a single reference, encodes preferred/nonpreferred pairs into a reusable, refinable
    profile conditioning LUT and strength prediction; introduces controlled preference-verification tests without per-user
    optimization.
- name: LoopLUT
  title: 'LoopLUT: 3D Lookup Tables with Progressive Region Refinement for Real-Time 4K Image Enhancement'
  venue: arXiv
  year: 2026
  paper: https://arxiv.org/abs/2609.33593
  status: no-code
  tldr: To add local adaptivity to fast LUT enhancement, cascades a global LUT with region-conditioned residual LUTs;
    low-resolution gates partition the image so high-resolution rendering needs only a small fixed number of lookups.
- name: FlowTool
  title: 'FlowTool: Controlling Tool Parameter in Image Retouching via Flow Matching'
  venue: arXiv
  year: 2026
  paper: https://arxiv.org/abs/2609.35673
  status: no-code
  tldr: To predict editable tool settings from images and instructions, models their joint distribution with conditional
    rectified flow using a vision-language backbone and diffusion Transformer; staged flow training plus reward post-training
    replaces sequential parameter reasoning.
- name: C2LUT
  title: Illuminant-Adaptive 3D Lookup Tables for Camera Color Correction
  venue: arXiv
  year: 2026
  paper: https://arxiv.org/abs/2607.11681
  code: https://github.com/claudiom4sir/C2LUT
  status: coming-soon
  tldr: To correct color across spectrally diverse illuminants, conditions nonlinear 3D LUTs on chromaticity-aware illumination
    features and compresses them with Tucker decomposition; contributes 1,473 illuminant spectra for evaluation.
  note: “The code will be released upon acceptance”
- name: Multispectral CC
  title: Leveraging Multispectral Sensors for Color Correction in Mobile Cameras
  venue: CVPR
  year: 2026
  paper: https://arxiv.org/abs/2512.08441
  code: https://github.com/LucaCogo/Mobile-Spectral-CC
  status: weights-in-repo
  weights:
  - label: pretrained/ (in repo, one folder per camera)
    url: https://github.com/LucaCogo/Mobile-Spectral-CC/tree/main/pretrained
  framework: PyTorch
  tldr: To resolve color ambiguity in RGB sensing, jointly processes high-resolution RGB and auxiliary low-resolution
    multispectral data in an end-to-end correction model; constructs training/evaluation data from spectral datasets
    and varied camera sensitivities.
  note: 'Dataset on HF: LucaCogo/MobileSpectralCCDataset'
- name: NILUT
  title: 'NILUT: Conditional Neural Implicit 3D Lookup Tables for Image Enhancement'
  venue: AAAI
  year: 2024
  paper: https://arxiv.org/abs/2306.11920
  code: https://github.com/mv-lab/nilut
  status: weights-in-repo
  weights:
  - label: models/nilutx3style.pt etc. (in repo)
    url: https://github.com/mv-lab/nilut/tree/main/models
  framework: PyTorch
  tldr: To store multiple color styles compactly, represents a continuous 3D color transform with a small neural implicit
    function; conditioning shares one model across LUT styles and enables continuous blending.
- name: LLF-LUT
  title: 'Lookup Table meets Local Laplacian Filter: Pyramid Reconstruction Network for Tone Mapping'
  venue: NeurIPS
  year: 2023
  paper: https://papers.nips.cc/paper_files/paper/2023/hash/b3a08d179347e33414badadf100e4e8d-Abstract-Conference.html
  code: https://github.com/fengzhang427/LLF-LUT
  status: weights
  weights:
  - label: TPAMI pretrained models (Google Drive)
    url: https://drive.google.com/file/d/1fkMj0peUbkX2ETC4rCxy0FAL7Gyxgg26/view?usp=sharing
  - label: Mirror (Baidu, code fegh)
    url: https://pan.baidu.com/s/1zPkdl0MG6nYNR4ZNC8fqoA?pwd=fegh
  framework: PyTorch
  tldr: To tone-map HDR efficiently while retaining local edges, predicts pixelwise basis-LUT weights with a low-resolution
    Transformer and refines high-frequency pyramid bands using a learned local Laplacian filter; avoids costly high-resolution
    convolutions.
  note: The NeurIPS version is not released due to company policy; only the TPAMI version is released.
- name: AdaInt
  title: 'AdaInt: Learning Adaptive Intervals for 3D Lookup Tables on Real-time Image Enhancement'
  venue: CVPR
  year: 2022
  paper: https://arxiv.org/abs/2204.13983
  code: https://github.com/ImCharlesY/AdaInt
  status: weights-in-repo
  weights:
  - label: pretrained/AiLUT-*.pth (in repo)
    url: https://github.com/ImCharlesY/AdaInt/tree/main/pretrained
  framework: PyTorch
  tldr: To allocate LUT samples where colors need them, learns nonuniform intervals in 3D color space with a differentiable
    adaptive-interval transform; adds content-adaptive sampling to existing real-time LUT enhancers.
- name: SepLUT
  title: 'SepLUT: Separable Image-adaptive Lookup Tables for Real-time Image Enhancement'
  venue: ECCV
  year: 2022
  paper: https://arxiv.org/abs/2207.08351
  code: https://github.com/ImCharlesY/SepLUT
  status: weights-in-repo
  weights:
  - label: pretrained/SepLUT-*.pth (in repo)
    url: https://github.com/ImCharlesY/SepLUT/tree/main/pretrained
  framework: PyTorch
  tldr: To reduce LUT size while retaining color interactions, factors enhancement into component-independent 1D LUTs
    followed by a component-correlated 3D LUT; learns image-dependent transforms in this separable cascade.
- name: 3D-LUT
  title: Learning Image-adaptive 3D Lookup Tables for High Performance Photo Enhancement in Real-time
  venue: IEEE TPAMI
  year: 2020
  paper: https://arxiv.org/abs/2009.14468
  code: https://github.com/HuiZeng/Image-Adaptive-3DLUT
  status: weights-in-repo
  weights:
  - label: pretrained_models/{sRGB,XYZ} (in repo)
    url: https://github.com/HuiZeng/Image-Adaptive-3DLUT/tree/master/pretrained_models
  framework: PyTorch
  tldr: To enhance high-resolution photos cheaply, jointly learns basis 3D LUTs and a small CNN predicting image-dependent
    fusion weights; applies the fused transform by lookup rather than dense per-pixel neural processing.
- name: CSRNet
  title: Conditional Sequential Modulation for Efficient Global Image Retouching
  venue: ECCV
  year: 2020
  paper: https://arxiv.org/abs/2009.10390
  code: https://github.com/hejingwenhejingwen/CSRNet
  status: weights-in-repo
  weights:
  - label: experiments/pretrain_models/csrnet.pth (in repo)
    url: https://github.com/hejingwenhejingwen/CSRNet/tree/master/experiments/pretrain_models
  framework: PyTorch
  tldr: To reproduce pixel-independent retouching efficiently, uses a per-pixel MLP modulated by global condition features;
    learns global color/tone operations with a compact base network and condition network.
- name: CURL
  title: 'CURL: Neural Curve Layers for Global Image Enhancement'
  venue: ICPR
  year: 2020
  paper: https://arxiv.org/abs/1911.13175
  code: https://github.com/sjmoran/CURL
  status: weights-in-repo
  weights:
  - label: pretrained_models/adobe_dpe (in repo)
    url: https://github.com/sjmoran/CURL
  framework: PyTorch
  tldr: To make learned enhancement interpretable, predicts adjustment curves jointly in RGB, HSV and CIELab with a multicolor-space
    loss; combines these global neural curve layers with a local multiscale backbone.
- name: DeepLPF
  title: 'DeepLPF: Deep Local Parametric Filters for Image Enhancement'
  venue: CVPR
  year: 2020
  paper: https://arxiv.org/abs/2003.13985
  code: https://github.com/sjmoran/DeepLPF
  status: weights-in-repo
  weights:
  - label: pretrained_models/adobe_dpe (in repo)
    url: https://github.com/sjmoran/DeepLPF
  framework: PyTorch
  tldr: To learn spatially local photo adjustments, regresses elliptical, graduated and polynomial filter parameters;
    applies these interpretable filters selectively instead of relying only on global transforms or unrestricted pixel
    synthesis.
- name: Exposure
  title: 'Exposure: A White-Box Photo Post-Processing Framework'
  venue: TOG
  year: 2018
  paper: https://arxiv.org/abs/1709.09602
  code: https://github.com/yuanming-hu/exposure
  status: weights
  weights:
  - label: exposure_models releases
    url: https://github.com/yuanming-hu/exposure_models/releases
  framework: TensorFlow
  tldr: To learn a preferred editing style without paired retouches, trains an RL agent to choose interpretable filters
    and settings with an adversarial objective; reproduces the style distribution of a reference photo collection.
  note: Running evaluate.py as described in the README uses the pretrained models
- name: HDRNet
  title: Deep Bilateral Learning for Real-Time Image Enhancement
  venue: SIGGRAPH (TOG)
  year: 2017
  paper: https://arxiv.org/abs/1707.02880
  code: https://github.com/google/hdrnet
  status: weights
  weights:
  - label: pretrained_models/download.py in the original TF repo (script download from MIT CSAIL)
    url: https://github.com/mgharbi/hdrnet/tree/master/pretrained_models
  framework: TensorFlow
  tldr: To approximate complex photographic operators on phones, predicts local affine coefficients in a low-resolution
    bilateral grid and slices them at full resolution; learns content-adaptive transforms from example edits.
  note: The google/hdrnet README still points to a pretrained_models folder that is no longer in that repository; the
    download script is in mgharbi/hdrnet.
