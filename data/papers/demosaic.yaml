- name: PyNET-QxQ
  title: 'PyNET-QxQ: An Efficient PyNET Variant for QxQ Bayer Pattern Demosaicing in CMOS Image Sensors'
  venue: IEEE Access
  year: 2023
  paper: https://arxiv.org/abs/2203.04314
  code: https://github.com/Minhyeok01/PyNET-QxQ
  status: code
  tldr: To support nonstandard QxQ Bayer sensors within mobile budgets, reduces the pyramidal PyNET architecture and
    trains it with progressive knowledge distillation; preserves edge/texture reconstruction with under 2.5% of the original
    parameter count.
  note: README says to place best_acc_model.pth but gives no download link
- name: JD3Net
  title: Efficient Deep Demosaicing with Spatially Downsampled Isotropic Networks
  venue: WACVW
  year: 2026
  paper: https://arxiv.org/abs/2601.00703
  code: https://github.com/cory-fan/jd3net
  status: code
  framework: PyTorch
  tldr: To reduce demosaicing cost, spatially downsamples before an isotropic fully convolutional network designed with
    mathematical architecture search; evaluates the efficiency/quality trade-off on demosaicing and joint denoising tasks.
- name: Pixel-bin Unified Demosaic
  title: An Extensible and Lightweight Unified Architecture for Demosaicing Pixel-bin Image Sensors
  venue: arXiv
  year: 2026
  paper: https://arxiv.org/abs/2606.13136
  status: no-code
  tldr: To avoid separate networks for each pixel-bin CFA, uses a modular lightweight shared demosaicing architecture
    and a training-free CFA identifier; supports extensible handling of Quad, Nona and related sensor layouts.
- name: SegDem
  title: 'SegDem: Segmentation helps Demosaicing'
  venue: arXiv
  year: 2026
  paper: https://arxiv.org/abs/2608.07916
  status: no-code
  tldr: To transfer scene structure into demosaicing, pretrains region/boundary representations with instance segmentation
    and transfers the decoder to RAW reconstruction; evaluates this strategy with CNN, Transformer and state-space backbones
    across Single/Quad Bayer.
- name: Structural Guidance JDD
  title: Structural Guidance for Unified Joint Demosaicing and Denoising
  venue: arXiv
  year: 2026
  paper: https://arxiv.org/abs/2608.09995
  status: no-code
  tldr: To guide noisy sparse-CFA restoration with pretrained structure, encodes mosaic, CFA masks and noise level as
    a unified observation; a trainable adapter bridges domains before residual fusion of structural and restoration features.
- name: BMTNet
  title: Binarized Mamba-Transformer for Lightweight Quad Bayer HybridEVS Demosaicing
  venue: CVPR
  year: 2025
  paper: https://arxiv.org/abs/2503.16134
  code: https://github.com/Clausy9/BMTNet
  status: weights
  weights:
  - label: pretrained models (Google Drive)
    url: https://drive.google.com/file/d/1bn7Pxt05H2bJd3MFVB600_UXbkECq9pg/view?usp=sharing
  framework: PyTorch
  tldr: To demosaic Quad Bayer HybridEVS efficiently, combines binarized Mamba projections with Swin Transformer blocks
    while keeping selective scanning full precision; captures global/local dependencies with lower edge-device compute.
- name: QB HybridEVS SSM
  title: Lightweight Quad Bayer HybridEVS Demosaicing via State Space Augmented Cross-Attention
  venue: arXiv
  year: 2025
  paper: https://arxiv.org/abs/2508.06058
  status: no-code
  tldr: To separate event-pixel holes from demosaicing, TSANet first inpaints then reconstructs color; a Cross-Swin State
    Block combines positional priors, cross-attention and linear-complexity state-space modeling for lightweight HybridEVS
    processing.
- name: QRNet
  title: Modeling Dual-Exposure Quad-Bayer Patterns for Joint Denoising and Deblurring
  venue: IEEE TIP
  year: 2025
  paper: https://arxiv.org/abs/2412.07256
  code: https://github.com/zhaoyuzhi/QRNet
  status: weights
  weights:
  - label: QRNet pretrained models (Baidu, code l5nw)
    url: https://pan.baidu.com/s/1H6aJr4uRnsrjm96T0XrSXQ?pwd=l5nw
  framework: PyTorch
  tldr: To combine short-exposure sharpness and long-exposure low noise within a sensor, models dual-exposure Quad Bayer
    acquisition and trains a hierarchical CNN; B2QB synthesis converts Bayer data into training observations.
  note: D2-Dataset is about 43.5GB, Baidu code 0fbf.
- name: Quad/Nona JDD
  title: Examining Joint Demosaicing and Denoising for Single-, Quad-, and Nona-Bayer Patterns
  venue: ICCP
  year: 2025
  paper: https://arxiv.org/abs/2504.07145
  code: https://github.com/SamsungLabs/unified-demosaicing
  status: weights-in-repo
  weights:
  - label: PyTorch/models/iso{400..3200}.pth (in repo)
    url: https://github.com/SamsungLabs/unified-demosaicing/tree/main/PyTorch/models
  framework: PyTorch
  tldr: To compare CFA-dependent joint restoration, benchmarks Single/Quad/Nona Bayer under a common denoising/demosaicing
    setup; introduces maskout training for dead pixels and a 638-image challenging RAW demosaicing dataset.
- name: Combine DM & DN
  title: How to Best Combine Demosaicing and Denoising?
  venue: Inverse Probl. Imaging
  year: 2024
  paper: https://arxiv.org/abs/2408.06684
  status: no-code
  tldr: To determine low-complexity restoration order, analyzes demosaiced-noise statistics and compares staged pipelines;
    recommends adapted post-demosaic denoising at moderate noise and partial pre-denoising plus a second denoiser at
    high noise.
- name: DemosaicFormer
  title: 'DemosaicFormer: Coarse-to-Fine Demosaicing Network for HybridEVS Camera'
  venue: CVPRW (MIPI)
  year: 2024
  paper: https://arxiv.org/abs/2406.07951
  code: https://github.com/QUEAHREN/DemosaicFormer
  status: weights
  weights:
  - label: model (Google Drive)
    url: https://drive.google.com/file/d/1Fc9LA5KRoprYMlQ8gZmsddKHdDQW0Z8z/view?usp=drive_link
  framework: PyTorch
  tldr: To restore HybridEVS color and defective pixels, cascades coarse demosaicing and pixel correction; a multiscale
    gating module exchanges features across resolutions for coarse-to-fine reconstruction.
- name: Inheriting Bayer's Legacy
  title: 'Inheriting Bayer''s Legacy: Joint Remosaicing and Denoising for Quad Bayer Image Sensor'
  venue: arXiv
  year: 2023
  paper: https://arxiv.org/abs/2303.13571
  status: no-code
  tldr: To reuse Bayer ISPs with Quad Bayer sensors, jointly remosaics and denoises without resolution loss using a dual-head
    network, Swin-based denoising and wavelet processing; hard-patch post-training targets moiré/zipper failures.
- name: JDD Double DIP
  title: Joint Demosaicing and Denoising with Double Deep Image Priors
  venue: arXiv
  year: 2023
  paper: https://arxiv.org/abs/2309.09426
  status: no-code
  tldr: To jointly denoise and demosaic without external training data, optimizes two deep-image-prior networks on a
    single RAW observation; evaluates reconstruction across multiple noise types and intensities.
- name: JDD Two-stage
  title: Joint Demosaicking and Denoising Benefits from a Two-stage Training Strategy
  venue: J. Comput. Appl. Math.
  year: 2023
  paper: https://arxiv.org/abs/2009.06205
  code: https://github.com/Yuguo-math/JDMDN-TwoStage
  status: weights-in-repo
  weights:
  - label: Demosaic/{lightweight,normal}.pkl + Denoise/ (in repo)
    url: https://github.com/Yuguo-math/JDMDN-TwoStage
  framework: PyTorch
  tldr: To preserve observed CFA values and stabilize learning, first trains a traditional-plus-residual-CNN demosaicer
    on clean data, then trains a second CNN on demosaiced noise; compares this staged strategy with joint end-to-end
    training.
- name: Moiré-Free Demosaick
  title: Toward Moiré-Free and Detail-Preserving Demosaicking
  venue: arXiv
  year: 2023
  paper: https://arxiv.org/abs/2305.08585
  status: no-code
  tldr: To reduce moiré without oversmoothing detail, separates spectral and spatial feature aggregation; strengthens
    global cross-color communication while retaining local spatial contrast for demosaicing and joint denoising.
- name: SDAT
  title: 'SDAT: Sub-Dataset Alternation Training for Improved Image Demosaicing'
  venue: IEEE OJSP
  year: 2023
  paper: https://arxiv.org/abs/2303.15792
  status: no-code
  tldr: To reduce demosaicing dataset bias without changing architecture, partitions training data into differently biased
    subsets and alternates them during optimization; evaluates the protocol across several reconstruction backbones.
- name: Unified Demosaicing (KD)
  title: Efficient Unified Demosaicing for Bayer and Non-Bayer Patterned Image Sensors
  venue: ICCV
  year: 2023
  paper: https://openaccess.thecvf.com/content/ICCV2023/html/Lee_Efficient_Unified_Demosaicing_for_Bayer_and_Non-Bayer_Patterned_Image_Sensors_ICCV_2023_paper.html
  status: no-code
  tldr: To share demosaicing across Bayer and non-Bayer sensors, KLAP adapts only a small set of CFA-specific filters;
    its inference-time meta-learning variant addresses unknown artifacts in real sensor data.
- name: CDLNet
  title: 'CDLNet: Noise-Adaptive Convolutional Dictionary Learning Network for Blind Denoising and Demosaicing'
  venue: IEEE OJSP
  year: 2022
  paper: https://arxiv.org/abs/2112.00913
  code: https://github.com/nikopj/CDLNet-OJSP
  status: weights-in-repo
  weights:
  - label: trained_nets/{CDLNet-s2030, JDD_CDLNet-s0120} (in repo)
    url: https://github.com/nikopj/CDLNet-OJSP/tree/HEAD/trained_nets
  framework: PyTorch
  tldr: To retain interpretability and noise adaptation, unfolds convolutional dictionary learning into a trainable network
    for denoising and joint demosaicing; evaluates small/large models and unsupervised training.
- name: RSTCANet
  title: Residual Swin Transformer Channel Attention Network for Image Demosaicing
  venue: EUVIP
  year: 2022
  paper: https://arxiv.org/abs/2204.07098
  code: https://github.com/xingwz/RSTCANet
  status: weights-in-repo
  weights:
  - label: dm_model_zoo/RSTCANet_{B,S,L}.pth (in repo)
    url: https://github.com/xingwz/RSTCANet/tree/master/dm_model_zoo
  framework: PyTorch
  tldr: To combine spatial attention with color-channel interactions, stacks residual Swin Transformer blocks and inserts
    channel attention between consecutive blocks; targets compact demosaicing with fewer trainable parameters.
- name: BJDD / PIPNet
  title: 'Beyond Joint Demosaicking and Denoising: An Image Processing Pipeline for a Pixel-bin Image Sensor'
  venue: CVPRW (NTIRE)
  year: 2021
  paper: https://arxiv.org/abs/2104.09398
  code: https://github.com/sharif-apu/BJDD_CVPR21
  status: weights
  weights:
  - label: Quad-Bayer weights (Google Drive)
    url: https://drive.google.com/drive/folders/1_ziIMjK9vGg-P_7Wxit96bnfHiO4_wQw?usp=sharinge
  - label: Bayer weights (Google Drive)
    url: https://drive.google.com/drive/folders/125hFTHR5qpJy4AKhtjxFhZJ5aPxQI4TE?usp=sharing
  framework: PyTorch
  tldr: To reconstruct noisy pixel-bin sensor images, combines depth/spatial attention with perceptual losses for joint
    denoising and demosaicing; extends the network into a smartphone reconstruction and enhancement pipeline.
- name: JDD in the Wild
  title: 'Joint Demosaicking and Denoising in the Wild: The Case of Training Under Ground Truth Uncertainty'
  venue: AAAI
  year: 2021
  paper: https://arxiv.org/abs/2101.04442
  status: no-code
  tldr: To train despite imperfect clean targets, models ground-truth uncertainty with a two-stage probabilistic degradation
    and conjugate prior, optimizing an ELBO; a weak-prior fine-tuning scheme improves out-of-distribution joint restoration.
- name: Joint DM + HDR
  title: Deep Joint Demosaicing and High Dynamic Range Imaging within a Single Shot
  venue: arXiv
  year: 2021
  paper: https://arxiv.org/abs/2111.07281
  status: no-code
  tldr: To recover full-color HDR from sparse spatially varying exposures, uses spatially varying convolution for Bayer
    structure and exposure guidance against clipped/dark pixels; jointly optimizes demosaicing and single-shot HDR reconstruction.
- name: Jointly Deblur-Demosaick-Denoise
  title: Learning to Jointly Deblur, Demosaick and Denoise Raw Images
  venue: arXiv
  year: 2021
  paper: https://arxiv.org/abs/2104.06459
  status: no-code
  tldr: To avoid separate-stage artifacts with known blur, introduces an interpretable joint demosaicing/deblurring module
    and trains on realistically unprocessed RAW; also corrects color-dependent optical point-spread blur in real captures.
- name: SAGAN (Nona-Bayer)
  title: 'SAGAN: Adversarial Spatial-asymmetric Attention for Noisy Nona-Bayer Reconstruction'
  venue: BMVC
  year: 2021
  paper: https://arxiv.org/abs/2110.08619
  code: https://github.com/sharif-apu/SAGAN_BMVC21
  status: code
  framework: PyTorch
  tldr: To suppress Nona-Bayer reconstruction artifacts, combines spatial-asymmetric attention for bidirectional transformation
    and large-kernel global context with adversarial learning; jointly denoises and reconstructs full-color output.
- name: DM-or-DN First
  title: 'A Review of an Old Dilemma: Demosaicking First, or Denoising First?'
  venue: CVPRW (NTIRE)
  year: 2020
  paper: https://openaccess.thecvf.com/content_CVPRW_2020/html/w31/Jin_A_Review_of_an_Old_Dilemma_Demosaicking_First_or_Denoising_CVPRW_2020_paper.html
  status: no-code
  tldr: To resolve restoration-order choices, reviews and benchmarks noisy-mosaic pipelines and analyzes demosaiced noise;
    specifies how classic denoisers must be adapted when demosaicing precedes denoising.
- name: SGNet (JDD)
  title: Joint Demosaicing and Denoising with Self Guidance
  venue: CVPR
  year: 2020
  paper: https://openaccess.thecvf.com/content_CVPR_2020/html/Liu_Joint_Demosaicing_and_Denoising_With_Self_Guidance_CVPR_2020_paper.html
  code: https://github.com/laulampaul/sgnet
  status: coming-soon
  tldr: To exploit Bayer's denser green sampling, first estimates green and uses it to guide missing-color recovery;
    density-map guidance handles varying spatial frequencies and extends joint restoration to super-resolution.
  note: The repo README contains only a TODO; code not released
- name: Deep Demosaicing for Edge
  title: Deep Demosaicing for Edge Implementation
  venue: ICIAR
  year: 2019
  paper: https://arxiv.org/abs/1904.00775
  status: no-code
  tldr: To reduce edge-device demosaicing cost while controlling zipper/false-color artifacts, develops a compact deep
    reconstruction model and analyzes artifact formation; evaluates reconstruction accuracy against computational requirements.
- name: JDD Burst Fine-tune
  title: Joint Demosaicking and Denoising by Fine-Tuning of Bursts of Raw Images
  venue: ICCV
  year: 2019
  paper: https://arxiv.org/abs/1905.05092
  status: no-code
  tldr: To bridge synthetic-training and real-sensor noise, learns joint demosaicing/denoising directly from mosaicked
    bursts without RGB truth; burst-specific self-supervised fine-tuning adapts the CNN to each capture.
- name: DMCNN
  title: Learning Deep Convolutional Networks for Demosaicing
  venue: arXiv
  year: 2018
  paper: https://arxiv.org/abs/1802.03769
  status: no-code
  tldr: To learn reconstruction for flexible CFA layouts, trains deep CNN demosaicers and jointly optimizes CFA design
    with reconstruction; extends evaluation to spatially varying exposure/color for single-shot HDR.
- name: Kokkinos Demosaick
  title: Deep Image Demosaicking using a Cascade of Convolutional Residual Denoising Networks
  venue: ECCV
  year: 2018
  paper: https://arxiv.org/abs/1803.05215
  status: no-code
  tldr: To make joint restoration interpretable and data-efficient, unrolls a regularized optimization process into cascaded
    convolutional residual denoisers; learns the prior while retaining an explicit iterative demosaicing structure.
- name: DemosaicNet
  title: Deep Joint Demosaicking and Denoising
  venue: SIGGRAPH Asia (TOG)
  year: 2016
  paper: https://groups.csail.mit.edu/graphics/demosaicnet/
  code: https://github.com/mgharbi/demosaicnet
  status: code
  framework: PyTorch
  tldr: To train robust joint denoising/demosaicing, mines difficult reconstruction examples at scale and learns a convolutional
    model from noisy mosaics; supports both Bayer and X-Trans sensor layouts.
  note: The PyTorch version does not implement the noise-aware model; see the older Caffe repo mgharbi/demosaicnet_caffe.
- name: StereoISP
  title: 'StereoISP: Rethinking Image Signal Processing for Dual Camera Systems'
  venue: arXiv
  year: 2022
  paper: https://arxiv.org/abs/2211.07390
  status: no-code
  tldr: To exploit a dual-camera system's additional measurements, uses inter-view disparity to combine stereo RAW inputs
    for joint denoising and demosaicing; evaluates the preliminary pipeline on synthesized stereo RAW pairs.
