# demosaic: one entry per paper; see CONTRIBUTING.md for the schema
- name: JD3Net
  title: Efficient Deep Demosaicing with Spatially Downsampled Isotropic Networks
  venue: WACVW
  year: 2026
  paper: https://arxiv.org/abs/2601.00703
  code: https://github.com/cory-fan/jd3net
  status: code
  framework: PyTorch
  tldr: Spatially downsamples first and then applies an isotropic network to reduce the compute cost of demosaicing.
