  venue: WACV
  year: 2026
  paper: https://arxiv.org/abs/2509.24022
  status: no-code
  tldr: Performs deraining and reconstruction directly in the Bayer domain.
- name: SegDem
  title: 'SegDem: Segmentation helps Demosaicing'
  venue: arXiv
  year: 2026
  paper: https://arxiv.org/abs/2608.07916
  status: no-code
