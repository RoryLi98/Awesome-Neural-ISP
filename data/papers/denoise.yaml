  venue: ICCP
  year: 2026
  paper: https://arxiv.org/abs/2607.11090
  status: no-code
  tldr: To address cross-camera color shifts in blind low-light denoising, identifies black-level estimation error as
    a key bias source and predicts it with a global bias-estimator network, reducing dependence on camera-specific calibration.
- name: GALOSH
  title: 'GALOSH: Blind, Training-Free Denoising of Raw Bayer and sRGB Images by Parallel-Friendly Local Shrinkage'
  venue: arXiv
  year: 2026
  paper: https://arxiv.org/abs/2607.03768
  code: https://github.com/luxgrain/GALOSH
  status: code
  framework: C++ / Python
  tldr: To avoid training data and expensive patch search, estimates Poisson–Gaussian noise per image, applies generalized
    Anscombe stabilization and local Walsh–Hadamard luminance shrinkage, then regresses chrominance from luminance; supports
    parallel, fixed-point RAW/sRGB denoising.
  note: Training-free method with no network weights; Releases provide a Windows executable.
