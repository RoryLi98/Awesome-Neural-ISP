- name: Edit-aware RAW
  title: Edit-aware RAW Reconstruction
  venue: CVPR
  year: 2026
  paper: https://arxiv.org/abs/2512.05859
  code: https://github.com/SamsungLabs/edit-aware-raw
  status: code
  framework: PyTorch
  tldr: To preserve editability rather than only default-render accuracy, trains with a modular differentiable ISP whose
    parameters are randomly sampled; the edit-aware loss penalizes reconstruction after varied realistic photographic
    adjustments.
  note: The repo includes NILUT and tone-curve auxiliary models; the main model must be trained yourself (S24 data).
- name: MERIT
  title: 'MERIT: Multi-domain Efficient RAW Image Translation'
  venue: CVPR
  year: 2026
  paper: https://arxiv.org/abs/2603.20836
  code: https://github.com/WJ-Huang/MERIT-Multi-domain-Efficient-RAW-Image-Translation
  status: code
  framework: PyTorch
  tldr: To avoid pairwise camera-specific translators, conditions a shared multi-domain RAW generator with multiscale
    large-kernel attention and a sensor-noise alignment loss; contributes five-sensor paired/unpaired MDRAW data.
- name: RAW-Flow
  title: 'RAW-Flow: Advancing RGB-to-RAW Image Reconstruction with Deterministic Latent Flow Matching'
  venue: AAAI (Oral)
  year: 2026
  paper: https://arxiv.org/abs/2601.20364
  code: https://github.com/liuzhen03/RAW-Flow
  status: weights
  weights:
  - label: nikon_d700 / canon_eos_5d weights (Google Drive)
    url: https://drive.google.com/drive/folders/1pUWOdyogxZSumnRCv9HcffCR4sl4Ue60?usp=sharing
  framework: PyTorch
  tldr: To address ambiguous RGB-to-RAW inversion, learns deterministic latent flow matching guided by cross-scale RGB
    context; a dual-domain autoencoder and feature alignment stabilize transport between RGB and RAW representations.
- name: RawGen
  title: 'RawGen: Learning Camera Raw Image Generation'
  venue: arXiv
  year: 2026
  paper: https://arxiv.org/abs/2604.00093
  code: https://github.com/SamsungLabs/RawGen
  status: weights
  weights:
  - label: kontext_lora.pt + vae_decoder_xyz.pt (Google Drive, author repo DY112/RawGen)
    url: https://drive.google.com/drive/folders/1OkODPg1XDHLRX4-kVDphTtT-CY8CK9-3
  framework: PyTorch (diffusers)
  tldr: To generate camera-specific linear data with pretrained image priors, adapts diffusion in latent/pixel spaces
    for text-to-RAW and sRGB inversion; many-to-one inverse-ISP training anchors diverse renderings to the same scene-referred
    target.
  note: The official repo contains no weights and points to the author's repo DY112/RawGen.
- name: SpiralDiff
  title: 'SpiralDiff: Spiral Diffusion with LoRA for RGB-to-RAW Conversion Across Cameras'
  venue: CVPR
  year: 2026
  paper: https://arxiv.org/abs/2603.14885
  code: https://github.com/Chuancy-TJU/SpiralDiff
  status: weights
  weights:
  - label: checkpoints.zip (Hugging Face dataset repo)
    url: https://huggingface.co/datasets/Chuancy/SpiralDiff/blob/main/checkpoints.zip
  framework: PyTorch
  tldr: To handle intensity-dependent inversion difficulty and multiple cameras, uses signal-dependent diffusion weighting
    plus camera-aware LoRA; adapts a shared RGB-to-RAW model with lightweight sensor-specific parameters.
  note: Apache-2.0. The README's model link (huggingface.co/Chuancy/SpiralDiff) returns 404; the checkpoints sit in the
    dataset repo next to the FiveK DNG data.
- name: Illum–Sensor Mapping
  title: Improved Mapping Between Illuminations and Sensors for RAW Images
  venue: JOSA A
  year: 2025
  paper: https://arxiv.org/abs/2508.14730
  code: https://github.com/SamsungLabs/illum-sensor-mapping
  status: code
  tldr: To map RAW across sensor spectra and illuminants, studies calibrated captures from 390 illuminations, four cameras
    and 18 scenes; improves illumination/sensor transfer and tests synthetic data for neural-ISP training.
- name: Physically-Informed Raw2Raw
  title: 'Beyond Calibration: Physically Informed Learning for Raw-to-Raw Mapping'
  venue: arXiv
  year: 2025
  paper: https://arxiv.org/abs/2506.08650
  status: no-code
  tldr: To maintain color across cameras and lighting, a lightweight Neural Physical Model simulates RAW under specified
    illumination to estimate device transformations; supports physical initialization and paired or unpaired learning.
- name: RAW-Diffusion
  title: 'RAW-Diffusion: RGB-Guided Diffusion Models for High-Fidelity RAW Image Generation'
  venue: WACV
  year: 2025
  paper: https://arxiv.org/abs/2411.13150
  code: https://github.com/SonyResearch/RAW-Diffusion
  status: code
  framework: PyTorch
  tldr: To synthesize sensor-specific RAW from labeled RGB collections, injects multiresolution RGB-guidance features
    into reverse-diffusion residual blocks; generates BDD100K-RAW/Cityscapes-RAW for data-efficient RAW object detection.
  note: The README does not provide weights.
- name: ReRAW
  title: 'ReRAW: RGB-to-RAW Image Reconstruction via Stratified Sampling for Efficient Object Detection on the Edge'
  venue: CVPR
  year: 2025
  paper: https://arxiv.org/abs/2503.03782
  code: https://github.com/SonyResearch/ReRAW
  status: code
  framework: PyTorch
  tldr: To synthesize training RAW for edge detectors, predicts gamma-space RAW candidates with a multi-head network
    and selects training samples by intensity strata; improves bright-pixel recovery before detector pretraining.
- name: Learnable CCM RAW Recon
  title: A Learnable Color Correction Matrix for RAW Reconstruction
  venue: BMVC
  year: 2024
  paper: https://arxiv.org/abs/2409.02497
  status: no-code
  tldr: To synthesize RAW cheaply for driving perception, approximates inverse ISP with a learnable color-correction
    matrix implemented as one convolutional layer; evaluates simulated RAW for pretraining object detectors.
- name: Prior Metadata RAW Recon
  title: 'Prior Metadata-Driven RAW Reconstruction: Eliminating the Need for Per-Image Metadata'
  venue: ACM MM
  year: 2024
  paper: https://doi.org/10.1145/3664647.3680819
  status: no-code
  tldr: To avoid per-image metadata, searches compact offline RAW references for similar pixels and feeds retrieved priors
    to a neural reconstructor; compresses the reference pool to reduce search/storage cost.
- name: Rawformer
  title: 'Rawformer: Unpaired Raw-to-Raw Translation for Learnable Camera ISPs'
  venue: ECCV
  year: 2024
  paper: https://arxiv.org/abs/2404.10700
  code: https://github.com/gosha20777/rawformer
  status: code
  framework: PyTorch
  tldr: To transfer an existing neural ISP to another sensor without paired captures, learns unpaired RAW-to-RAW translation
    using a Transformer encoder–decoder; maps new-camera measurements into the trained ISP's sensor domain.
  note: The README TODO item "upload pretrained models" has not been completed.
- name: SEL-CIE
  title: 'SEL-CIE: Knowledge-Guided Self-Supervised Learning Framework for CIE-XYZ Reconstruction from Non-Linear sRGB
    Images'
  venue: WSCG
  year: 2024
  paper: https://arxiv.org/abs/2405.12265
  status: no-code
  tldr: To reduce paired-data requirements for linear color reconstruction, combines knowledge-guided self-supervision
    with available paired sRGB/XYZ images; jointly reconstructs CIE XYZ and re-renders sRGB on the sRGB2XYZ benchmark.
- name: sRGB-to-RAW Video
  title: Leveraging Frame Affinity for sRGB-to-RAW Video De-rendering
  venue: CVPR
  year: 2024
  paper: https://openaccess.thecvf.com/content/CVPR2024/html/Zhang_Leveraging_Frame_Affinity_for_sRGB-to-RAW_Video_De-rendering_CVPR_2024_paper.html
  status: no-code
  tldr: To recover RAW consistently from video, extracts a temporal-affinity prior using motion and learns scene-/position-specific
    spatial mappings from prior frames; contributes a RAW-video de-rendering benchmark.
- name: Unsupervised Raw2Raw ISP
  title: Generalizing ISP Model by Unsupervised Raw-to-raw Mapping
  venue: ACM MM
  year: 2024
  paper: https://doi.org/10.1145/3664647.3681666
  status: code
  code: https://github.com/ydxxxx/Unsupervised-Raw-to-raw-Mapping
  framework: PyTorch
  tldr: To transfer an ISP without paired camera captures, predicts patchwise color-space transformation parameters with
    CSTPP and trains in a CycleGAN-style framework; maps sensor domains while handling spatially varying lighting.
- name: Graphics2RAW
  title: 'Graphics2RAW: Mapping Computer Graphics Images to Sensor RAW Images'
  venue: ICCV
  year: 2023
  paper: https://openaccess.thecvf.com/content/ICCV2023/html/Seo_Graphics2RAW_Mapping_Computer_Graphics_Images_to_Sensor_RAW_Images_ICCV_2023_paper.html
  code: https://github.com/SamsungLabs/graphics2raw
  status: code
  tldr: To turn graphics into sensor-matched training data, uses a few RAW-DNG examples to map each rendered scene to
    multiple cameras and illuminants; releases 292 realistic CG images for low-light training.
- name: Metadata RAW (INF)
  title: Metadata-Based RAW Reconstruction via Implicit Neural Functions
  venue: CVPR
  year: 2023
  paper: https://openaccess.thecvf.com/content/CVPR2023/html/Li_Metadata-Based_RAW_Reconstruction_via_Implicit_Neural_Functions_CVPR_2023_paper.html
  status: no-code
  tldr: To reconstruct RAW from sparse embedded samples without camera pretraining, fits an implicit neural function
    mapping coordinates and corresponding sRGB values to RAW; learns each image self-supervised from its metadata.
- name: SRISP
  title: Self-Supervised Reversed Image Signal Processing via Reference-Guided Dynamic Parameter Selection
  venue: arXiv
  year: 2023
  paper: https://arxiv.org/abs/2303.13916
  status: no-code
  tldr: To invert ISP without metadata or paired data, dynamically selects reversed-pipeline parameters from a reference
    RAW; generates RAW-like images matching the reference sensor/environment and tests their use in detection training.
- name: Content-Aware Metadata
  title: Learning sRGB-to-Raw-RGB De-rendering with Content-Aware Metadata
  venue: CVPR
  year: 2022
  paper: https://openaccess.thecvf.com/content/CVPR2022/html/Nam_Learning_sRGB-to-Raw-RGB_De-Rendering_With_Content-Aware_Metadata_CVPR_2022_paper.html
  code: https://github.com/SamsungLabs/content-aware-metadata
  status: code
  tldr: To spend reconstruction metadata where it matters, learns content-dependent sampling of original RAW values alongside
    a reconstruction network; online fine-tuning further adapts sRGB-to-RAW recovery to the stored samples.
  note: The dataset link in the README is empty.
- name: MBISPLD
  title: Model-Based Image Signal Processors via Learnable Dictionaries
  venue: AAAI
  year: 2022
  paper: https://arxiv.org/abs/2201.03210
  status: no-code
  tldr: To combine invertibility with interpretable ISP operations, learns rich parameter dictionaries inside a model-based
    bidirectional RAW/RGB pipeline; dictionary sampling supplies plausible augmentation even with few labeled captures.
  note: The mv-lab/AISP/mbispld directory contains only the paper PDF and figures.
- name: Overexposure Mask Fusion
  title: 'Overexposure Mask Fusion: Generalizable Reverse ISP Multi-Step Refinement'
  venue: ECCVW (AIM)
  year: 2022
  paper: https://arxiv.org/abs/2210.11511
  code: https://github.com/SenseBrainTech/overexposure-mask-reverse-ISP
  status: weights-in-repo
  weights:
  - label: trained_models/ (in repo, S7 data)
    url: https://github.com/SenseBrainTech/overexposure-mask-reverse-ISP/tree/master/trained_models
  framework: PyTorch
  tldr: To recover RAW from clipped RGB more reliably, predicts demosaiced RAW rather than Bayer and applies overexposure-mask-guided
    multistep refinement; permits perceptual supervision and reuse with other reconstruction backbones.
- name: Reverse Style Transfer ISP
  title: Reversing Image Signal Processors by Reverse Style Transferring
  venue: ECCVW
  year: 2022
  paper: https://arxiv.org/abs/2210.09074
  status: no-code
  tldr: To model ISP changes as removable style, RST-ISP-Net uses adaptive feature normalization in an end-to-end reverse-style-transfer
    architecture; investigates sRGB-to-RAW inversion in the AIM reversed-ISP setting.
- name: CIE XYZ Net
  title: 'CIE XYZ Net: Unprocessing Images for Low-Level Computer Vision Tasks'
  venue: IEEE TPAMI
  year: 2021
  paper: https://arxiv.org/abs/2006.12709
  code: https://github.com/mahmoudnafifi/CIE_XYZ_NET
  status: weights-in-repo
  weights:
  - label: PyTorch/models/model_sRGB-XYZ-sRGB.pth (in repo)
    url: https://github.com/mahmoudnafifi/CIE_XYZ_NET/tree/master/PyTorch/models
  framework: MATLAB / PyTorch
  tldr: To avoid sensor-specific RAW targets, learns to unprocess nonlinear sRGB into canonical CIE XYZ; provides a scene-referred
    representation for low-level restoration and color-related vision tasks.
  note: Paper results use the MATLAB version; the PyTorch weights are a convenience port.
- name: InvISP
  title: Invertible Image Signal Processing
  venue: CVPR
  year: 2021
  paper: https://openaccess.thecvf.com/content/CVPR2021/html/Xing_Invertible_Image_Signal_Processing_CVPR_2021_paper.html
  code: https://github.com/yzxing87/Invertible-ISP
  status: weights-in-repo
  weights:
  - label: pretrained/canon.pth, nikon.pth (in repo)
    url: https://github.com/yzxing87/Invertible-ISP/tree/main/pretrained
  framework: PyTorch
  tldr: To retain RAW editability without a separate full RAW file, uses an invertible neural RAW/sRGB pipeline and differentiable
    JPEG simulation; trains rendering and reconstruction jointly under compression distortion.
- name: Raw Bayer Synthesis for CV-ISP
  title: Raw Bayer Pattern Image Synthesis for Computer Vision-oriented Image Signal Processing Pipeline Design
  venue: arXiv
  year: 2021
  paper: https://arxiv.org/abs/2110.12823
  status: no-code
  tldr: To reuse labeled color datasets for RAW perception, constrains GAN-based RGB-to-Bayer generation through an additional
    demosaicing transformation; supports arbitrary image sizes and evaluates end-to-end detector training on synthesized
    RAW.
- name: Raw-to-Raw (Semi-Sup.)
  title: Semi-Supervised Raw-to-Raw Mapping
  venue: BMVC
  year: 2021
  paper: https://arxiv.org/abs/2106.13883
  code: https://github.com/mahmoudnafifi/raw2raw
  status: code
  framework: PyTorch
  tldr: To transfer sensor color spaces with few paired captures, jointly trains on a small paired subset and larger
    per-camera unpaired sets; contributes two-phone RAW data for semi-supervised mapping evaluation.
  note: Provides DNG data and precomputed mappings.
- name: Spatially Aware Metadata
  title: Spatially Aware Metadata for Raw Reconstruction
  venue: WACV
  year: 2021
  paper: https://openaccess.thecvf.com/content/WACV2021/html/Punnappurath_Spatially_Aware_Metadata_for_Raw_Reconstruction_WACV_2021_paper.html
  status: no-code
  tldr: To invert spatially varying tone mapping, stores spatially distributed RAW samples with the processed image and
    uses them for reconstruction; requires only a small sample fraction with little capture-time computation.
- name: CycleISP
  title: 'CycleISP: Real Image Restoration via Improved Data Synthesis'
  venue: CVPR
  year: 2020
  paper: https://arxiv.org/abs/2003.07761
  code: https://github.com/swz30/CycleISP
  status: weights
  weights:
  - label: all models (Google Drive)
    url: https://drive.google.com/drive/folders/1cHRfWPjFpTPrvBm7B4iTMEVZ4ABfjmxW?usp=sharing
  framework: PyTorch
  tldr: To synthesize realistic denoising pairs, learns forward and reverse camera mappings and adds sensor noise between
    them; generates consistent RAW/sRGB noisy-clean data rather than assuming simple noise in rendered images.
- name: SingleHDR
  title: Single-Image HDR Reconstruction by Learning to Reverse the Camera Pipeline
  venue: CVPR
  year: 2020
  paper: https://arxiv.org/abs/2004.01179
  code: https://github.com/alex04072000/SingleHDR
  status: weights
  weights:
  - label: ckpt (Google Drive)
    url: https://drive.google.com/file/d/1e9vP8YPEjGcvXCa0Bfqwxw7qks7dH-VE/view?usp=sharing
  framework: TensorFlow
  tldr: To recover information lost by LDR rendering, uses three specialized CNNs to reverse quantization, nonlinear
    camera response and clipping; joint fine-tuning limits errors across the physically structured HDR reconstruction
    stages.
- name: Camera Pipeline Simulation
  title: Generating Training Data for Denoising Real RGB Images via Camera Pipeline Simulation
  venue: arXiv
  year: 2019
  paper: https://arxiv.org/abs/1904.08825
  status: no-code
  tldr: To train JPEG denoisers with realistic noise, simulates RAW sensor noise and the subsequent camera pipeline;
    ablations identify the importance of realistic demosaicing and denoising during synthetic-data generation.
- name: Unprocessing
  title: Unprocessing Images for Learned Raw Denoising
  venue: CVPR
  year: 2019
  paper: https://arxiv.org/abs/1811.11127
  code: https://github.com/google-research/google-research/tree/master/unprocessing
  status: weights
  weights:
  - label: trained models (Google Drive)
    url: https://drive.google.com/file/d/1MTFr-uaIKv5aWe7nXlhTaHBestLUiDLZ/view?usp=sharing
  framework: TensorFlow
  tldr: To train RAW denoisers from ordinary photographs, reverses tone, color and gain processing, injects realistic
    sensor noise and evaluates losses through the forward ISP; makes training account for later photographic rendering.
  note: Lives in a subdirectory of the google-research monorepo.
- name: Scene-Dependent Imaging
  title: Modelling the Scene Dependent Imaging in Cameras with a Deep Neural Network
  venue: ICCV
  year: 2017
  paper: https://arxiv.org/abs/1707.08350
  status: no-code
  tldr: To model automatic-mode processing that varies with scene content, embeds global and local context using multiscale
    learnable histogram layers; learns both RAW-to-sRGB and sRGB-to-RAW mappings rather than a fixed radiometric curve.
