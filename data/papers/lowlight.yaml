- name: NPR Color Bias
  title: 'Beyond Pixel Fidelity: Minimizing Perceptual Distortion and Color Bias in Night Photography Rendering'
  venue: ICIP
  year: 2026
  paper: https://arxiv.org/abs/2604.28136
  status: no-code
  tldr: To reduce night-rendering color bias and perceptual artifacts, pHVI-ISPNet combines HVI-space processing, RAW
    features and wavelet propagation with exposure-dependent loss weights and a feature-distribution color-constancy
    loss.
- name: Back to the Future ISP
  title: 'Back to the Future: A Night Photography Rendering ISP Without Deep Learning'
  venue: CVPRW (NTIRE)
  year: 2023
  paper: https://openaccess.thecvf.com/content/CVPR2023W/NTIRE/html/Zini_Back_to_the_Future_A_Night_Photography_Rendering_ISP_Without_CVPRW_2023_paper.html
  status: no-code
  tldr: To avoid night-ISP training-data and compute demands, constructs a shallow, explainable conventional pipeline
    with few parameters and no learned network; evaluates perceptual rendering through the NTIRE night-photography challenge.
- name: CBUnet
  title: Rendering Nighttime Image Via Cascaded Color and Brightness Compensation
  venue: CVPRW (NTIRE)
  year: 2022
  paper: https://arxiv.org/abs/2204.08970
  code: https://github.com/njuvision/CBUnet
  status: weights
  weights:
  - label: stage-1 cube++.pth (Google Drive)
    url: https://drive.google.com/file/d/1K8CgwXp0Pk7yPNUWXOF6zbK9iHgpiVDS/view?usp=sharing
  framework: PyTorch
  tldr: To model night illumination explicitly, cascades color- and brightness-compensation networks instead of learning
    both together; contributes NR2R, a high-resolution night RAW–RGB dataset with expert white-balance and tone annotations.
  note: Stage-2 and other weights are listed in the README
- name: Day-to-Night
  title: Day-to-Night Image Synthesis for Training Nighttime Neural ISPs
  venue: CVPR
  year: 2022
  paper: https://openaccess.thecvf.com/content/CVPR2022/html/Punnappurath_Day-to-Night_Image_Synthesis_for_Training_Nighttime_Neural_ISPs_CVPR_2022_paper.html
  code: https://github.com/SamsungLabs/day-to-night
  status: code
  framework: PyTorch
  tldr: To reduce expensive nighttime training captures, converts daytime RAW into aligned clean/noisy nighttime pairs
    with controllable noise; mixing synthetic data with a small real subset trains nighttime neural ISPs.
  note: README references pretrained_* directories, but no weight files were found in the repo and the dataset link is
    empty
- name: Deep-FlexISP
  title: 'Deep-FlexISP: A Three-Stage Framework for Night Photography Rendering'
  venue: CVPRW (NTIRE)
  year: 2022
  paper: https://openaccess.thecvf.com/content/CVPR2022W/NTIRE/html/Liu_Deep-FlexISP_A_Three-Stage_Framework_for_Night_Photography_Rendering_CVPRW_2022_paper.html
  code: https://github.com/q935970314/Deep-FlexISP
  status: code
  tldr: To decouple night-rendering noise, color and brightness, cascades RAW denoising, white balance and Bayer-to-sRGB
    subnetworks; weakly coupled stages simplify training and allow style adjustments through the intermediate pipeline.
  note: The Docker image with the 2022 models (Google Drive) returns 404 (checked 2026-10-11); the repo's Night_Photography_2023
    folder ships checkpoints for the team's 2023 challenge entry instead.
- name: Shallow Night Pipeline
  title: Shallow Camera Pipeline for Night Photography Rendering
  venue: arXiv
  year: 2022
  paper: https://arxiv.org/abs/2204.08972
  status: no-code
  tldr: To render low-light photographs with few interpretable parameters, uses local light enhancement, global histogram
    adjustment and stronger denoising in dark regions; the handcrafted pipeline avoids requiring explicit training targets.
  note: The paper states code will be released upon acceptance; no repo found.
- name: Sky Optimization
  title: 'Sky Optimization: Semantically Aware Image Processing of Skies in Low-Light Photography'
  venue: CVPRW
  year: 2020
  paper: https://openaccess.thecvf.com/content_CVPRW_2020/html/w31/Liba_Sky_Optimization_Semantically_Aware_Image_Processing_of_Skies_in_Low-Light_CVPRW_2020_paper.html
  status: no-code
  tldr: To treat noisy night skies separately, trains a low-resolution sky-segmentation network from partially annotated
    masks, refines and upsamples masks with a weighted guided filter, then applies sky-specific white balance, tone and
    noise processing.
- name: CtrlISP
  title: 'CtrlISP: Rescuing Low-Light RAW Images via Controllable Neural ISP'
  venue: CVPR Findings
  year: 2026
  paper: https://openaccess.thecvf.com/content/CVPR2026F/html/Zhang_CtrlISP_Rescuing_Low-Light_RAW_Images_via_Controllable_Neural_ISP_CVPRF_2026_paper.html
  status: no-code
  tldr: 'To make extreme-low-light enhancement user-controllable, cascades differentiable ISP modules: DenoiseNet uses
    spatial interaction and guidance against dark-shading noise, while ColorNet predicts rendering parameters for adaptive
    color, brightness and style adjustment.'
- name: MeanFlow RAW
  title: 'When Extreme Darkness Meets Motion Blur: MeanFlow for Unified RAW Restoration'
  venue: arXiv
  year: 2026
  paper: https://arxiv.org/abs/2608.01720
  status: no-code
  tldr: To restore jointly dark and motion-blurred RAW, calibrates a shared RAW tokenizer across exposure domains and
    applies single-evaluation MeanFlow enhancement; physics-guided refinement and the SIDED benchmark address coupled
    motion/noise degradation.
- name: NEC-Diff
  title: 'NEC-Diff: Noise-Robust Event-RAW Complementary Diffusion for Seeing Motion in Extreme Darkness'
  venue: CVPR
  year: 2026
  paper: https://arxiv.org/abs/2603.20005
  code: https://github.com/jinghan-xu/NEC-Diff
  status: code
  tldr: To reconstruct motion under severe photon noise, uses a diffusion framework that combines complementary event
    and RAW measurements; contributes REAL with 47,800 pixel-aligned low-light RAW/event/reference samples spanning 0.001–0.8
    lux.
  note: Dataset is being uploaded in batches; no weights yet
- name: DarkDiff
  title: 'DarkDiff: Advancing Low-Light Raw Enhancement by Retasking Diffusion Models for Camera ISP'
  venue: arXiv
  year: 2025
  paper: https://arxiv.org/abs/2505.23743
  status: no-code
  tldr: To reduce oversmoothing from pixel-regression ISPs, retasks a pretrained generative diffusion model for low-light
    RAW processing; transfers learned image priors into the camera pipeline to recover perceptually sharper detail and
    color.
- name: ERIENet
  title: 'ERIENet: An Efficient RAW Image Enhancement Network under Low-Light Environment'
  venue: ICVISP
  year: 2025
  paper: https://arxiv.org/abs/2512.15186
  code: https://github.com/whiteknight-WJN/An-Efficient-RAW-Image-Enhancement-Network-under-Low-Light-Environment
  status: code
  framework: PyTorch
  tldr: To accelerate low-light RAW rendering, processes scales in parallel with channel-aware residual dense convolution
    blocks; a green-channel guidance branch exploits Bayer sampling redundancy to aid reconstruction with lower computational
    cost.
  note: The repo has training/testing code; no weights found.
- name: HiMA
  title: Hierarchical Mixing Architecture for Low-light RAW Image Enhancement
  venue: arXiv
  year: 2025
  paper: https://arxiv.org/abs/2510.15497
  code: https://github.com/Cynicarlos/HiMA
  status: weights
  weights:
  - label: pretrained (Google Drive)
    url: https://drive.google.com/drive/folders/196hPm0aLqpgsxLryKqKpE0UKgvXE_0ap?usp=drive_link
  - label: pretrained (Baidu, code 8fem)
    url: https://pan.baidu.com/s/146zs6nfFdNcTmA3ytsd7vQ?pwd=8fem
  framework: PyTorch
  tldr: To balance low-light quality and efficiency, mixes channel attention and Mamba in hierarchical large/small-scale
    blocks; local distribution adjustment learns regional luminance/contrast statistics, while multiprior fusion maintains
    domain-consistent features.
- name: ISP-driven LLIE Data
  title: Towards Realistic Low-Light Image Enhancement via ISP Driven Data Modeling
  venue: arXiv
  year: 2025
  paper: https://arxiv.org/abs/2504.12204
  status: no-code
  tldr: To synthesize realistic paired low-light data, unprocesses normal-light images to RAW, adds RAW-domain degradations
    and varies white balance, tone and gamma during re-rendering; validates data effectiveness with a convolutional U-Net
    baseline.
- name: LDM-ISP
  title: 'LDM-ISP: Enhancing Neural ISP for Low Light with Latent Diffusion Models'
  venue: ICRA
  year: 2025
  paper: https://arxiv.org/abs/2312.01027
  code: https://github.com/csqiangwen/LDM-ISP
  status: weights
  weights:
  - label: pretrained_models (OneDrive/SharePoint)
    url: https://hkustconnect-my.sharepoint.com/:f:/g/personal/qwenab_connect_ust_hk/EglycxTmf0RNqWc5C3uvRRcBGISUNq2rsOiOqx_fT23Scg?e=kb1BNY
  framework: PyTorch
  tldr: To reuse pretrained diffusion priors for extremely dark RAW, trains lightweight modules that modulate U-Net features
    with RAW cues; separates low-frequency latent generation from high-frequency preservation during decoding.
  note: Authors state the released model is a retrained version that scores slightly higher than the paper
- name: Reconstruction & Denoising in the Dark
  title: 'Rethinking Reconstruction and Denoising in the Dark: New Perspective, General Architecture and Beyond'
  venue: CVPR
  year: 2025
  paper: https://openaccess.thecvf.com/content/CVPR2025/html/Ma_Rethinking_Reconstruction_and_Denoising_in_the_Dark_New_Perspective_General_CVPR_2025_paper.html
  status: no-code
  tldr: To avoid weak coupling between restoration tasks, shares a chromaticity/noise-aware backbone with compact reconstruction
    and denoising heads; task-specific supervision and dual-head interaction exchange information beyond image-level
    cascades.
- name: Rectified-Flow LL RAW
  title: Physics-Guided Rectified Flow for Low-light RAW Image Enhancement
  venue: arXiv
  year: 2025
  paper: https://arxiv.org/abs/2509.08330
  status: no-code
  tldr: To capture spatial sensor-noise variation, combines additive/multiplicative physical noise with per-pixel calibration
    and synthesis, then trains a physics-guided rectified-flow enhancer; contributes the Sony A7S II indoor LLID benchmark.
- name: SIED
  title: Learning to See in the Extremely Dark
  venue: ICCV
  year: 2025
  paper: https://arxiv.org/abs/2506.21132
  code: https://github.com/JianghaiSCU/SIED
