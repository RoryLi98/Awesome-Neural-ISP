- name: Few-Shot LL RAW
  title: Few-Shot Domain Adaptation for Low Light RAW Image Enhancement
  venue: BMVC
  year: 2021
  paper: https://arxiv.org/abs/2303.15528
  status: no-code
  tldr: To transfer low-light enhancement to a new camera, combines labeled source-camera data with ten or fewer labeled
