# lowlight: one entry per paper; see CONTRIBUTING.md for the schema
- name: CtrlISP
  title: 'CtrlISP: Rescuing Low-Light RAW Images via Controllable Neural ISP'
  venue: CVPR 2026 (Findings)
  year: 2026
  paper: https://openaccess.thecvf.com/content/CVPR2026F/html/Zhang_CtrlISP_Rescuing_Low-Light_RAW_Images_via_Controllable_Neural_ISP_CVPRF_2026_paper.html
  status: no-code
  tldr: Controllable neural ISP that lets users adjust the brightness and style of low-light RAW.
- name: MeanFlow RAW
  title: 'When Extreme Darkness Meets Motion Blur: MeanFlow for Unified RAW Restoration'
  venue: arXiv
  year: 2026
  paper: https://arxiv.org/abs/2608.01720
  status: no-code
  tldr: RAW restoration that handles extreme darkness and motion blur jointly.
- name: NEC-Diff
  title: 'NEC-Diff: Noise-Robust Event-RAW Complementary Diffusion for Seeing Motion in Extreme Darkness'
  venue: CVPR
  year: 2026
  paper: https://arxiv.org/abs/2603.20005
  code: https://github.com/jinghan-xu/NEC-Diff
  status: code
  tldr: Diffusion model that combines complementary event-camera and RAW data for motion in extremely dark scenes.
  note: Dataset is being uploaded in batches; no weights yet
- name: RawMetaDiff
  title: 'RawMetaDiff: Unlocking Extreme Darkness from Dual-Exposure RAW with Meta-Guided Diffusion'
  venue: CVPR
  year: 2026
  paper: https://openaccess.thecvf.com/content/CVPR2026/html/Liu_RawMetaDiff_Unlocking_Extreme_Darkness_from_Dual-Exposure_RAW_with_Meta-Guided_Diffusion_CVPR_2026_paper.html
  status: no-code
  tldr: Metadata-guided diffusion on dual-exposure RAW for extremely dark scenes.
- name: DarkDiff
  title: 'DarkDiff: Advancing Low-Light Raw Enhancement by Retasking Diffusion Models for Camera ISP'
  venue: arXiv
  year: 2025
  paper: https://arxiv.org/abs/2505.23743
  status: no-code
  tldr: Repurposes a pretrained image diffusion model as a camera ISP for low-light RAW.
- name: ERIENet
  title: 'ERIENet: An Efficient RAW Image Enhancement Network under Low-Light Environment'
  venue: ICVISP
  year: 2025
  paper: https://arxiv.org/abs/2512.15186
  code: https://github.com/whiteknight-WJN/An-Efficient-RAW-Image-Enhancement-Network-under-Low-Light-Environment
  status: code
  framework: PyTorch
  tldr: Efficient low-light RAW→sRGB enhancement network emphasizing low parameter count and fast inference (ICVISP 2025 Best Paper).
  note: The repo has training/testing code; no weights found.
- name: HiMA
  title: Hierarchical Mixing Architecture for Low-light RAW Image Enhancement
  venue: arXiv
  year: 2025
  paper: https://arxiv.org/abs/2510.15497
  code: https://github.com/Cynicarlos/HiMA
  status: weights
  weights:
  - label: pretrained (Google Drive)
    url: https://drive.google.com/drive/folders/196hPm0aLqpgsxLryKqKpE0UKgvXE_0ap?usp=drive_link
  - label: pretrained (Baidu, code 8fem)
    url: https://pan.baidu.com/s/146zs6nfFdNcTmA3ytsd7vQ?pwd=8fem
  framework: PyTorch
  tldr: Low-light RAW enhancement network with hierarchical mixing of Transformer and Mamba (same authors as Retinex-RAWMamba).
- name: ISP-driven LLIE Data
  title: Towards Realistic Low-Light Image Enhancement via ISP Driven Data Modeling
  venue: arXiv
  year: 2025
  paper: https://arxiv.org/abs/2504.12204
  status: no-code
  tldr: Models the ISP pipeline to synthesize more realistic low-light training data.
- name: LDM-ISP
  title: 'LDM-ISP: Enhancing Neural ISP for Low Light with Latent Diffusion Models'
  venue: ICRA
  year: 2025
  paper: https://arxiv.org/abs/2312.01027
  code: https://github.com/csqiangwen/LDM-ISP
  status: weights
  weights:
  - label: pretrained_models (OneDrive/SharePoint)
    url: https://hkustconnect-my.sharepoint.com/:f:/g/personal/qwenab_connect_ust_hk/EglycxTmf0RNqWc5C3uvRRcBGISUNq2rsOiOqx_fT23Scg?e=kb1BNY
  framework: PyTorch
  tldr: Introduces latent diffusion priors into a neural ISP to recover detail and color in extremely low-light RAW.
  note: Authors state the released model is a retrained version that scores slightly higher than the paper
- name: Reconstruction & Denoising in the Dark
  title: 'Rethinking Reconstruction and Denoising in the Dark: New Perspective, General Architecture and Beyond'
  venue: CVPR
  year: 2025
  paper: https://openaccess.thecvf.com/content/CVPR2025/html/Ma_Rethinking_Reconstruction_and_Denoising_in_the_Dark_New_Perspective_General_CVPR_2025_paper.html
  status: no-code
  tldr: Revisits low-light RAW reconstruction and denoising by unifying them within a general architecture.
- name: Rectified-Flow LL RAW
  title: Physics-Guided Rectified Flow for Low-light RAW Image Enhancement
  venue: arXiv
  year: 2025
  paper: https://arxiv.org/abs/2509.08330
  status: no-code
  tldr: Low-light RAW enhancement using rectified flow guided by a physics-based noise model.
- name: SIED
  title: Learning to See in the Extremely Dark
  venue: ICCV
  year: 2025
  paper: https://arxiv.org/abs/2506.21132
  code: https://github.com/JianghaiSCU/SIED
  status: weights
  weights:
  - label: pre-trained model (OneDrive)
    url: https://1drv.ms/f/c/e379fe7c770e3033/Ekg7dQ-J7PxCuJ3_-FQ_uNsB0ZWvwL2HUK3dSFcogki0jA?e=XWToVn
  - label: Mirror (Baidu, code m9zp)
    url: https://pan.baidu.com/s/1m3pP50qopY8TRoGwt6wrjA
  framework: PyTorch
  tldr: Pushes low-light RAW enhancement to scenes darker than SID, releasing the SIED dataset and a corresponding enhancement method.
- name: TS-Diff
  title: 'TS-Diff: Two-Stage Diffusion Model for Low-Light RAW Image Enhancement'
  venue: IJCNN
  year: 2025
  paper: https://arxiv.org/abs/2505.04281
  code: https://github.com/CircccleK/TS-Diff
  status: code
  framework: PyTorch
  tldr: 'Two-stage diffusion: pretrains on multiple cameras, then quickly fine-tunes on the target camera.'
  note: The pretrained_models/ directory contains only placeholder files
- name: Retinex-RAWMamba
  title: 'Retinex-RAWMamba: Bridging Demosaicing and Denoising for Low-Light RAW Image Enhancement'
  venue: IEEE TCSVT
  year: 2024
  paper: https://arxiv.org/abs/2409.07040
  code: https://github.com/Cynicarlos/RetinexRawMamba
  status: weights
  weights:
  - label: Sony (Google Drive)
    url: https://drive.google.com/file/d/1eAgm5HHDH0CBUsl-czZ7Kdues3tAPy7W/view?usp=drive_link
  - label: Fuji (Google Drive)
    url: https://drive.google.com/file/d/1C9x-VcHdkFt-7MQONSkZAWtttu3Gtp12/view?usp=drive_link
  - label: MCR (Google Drive)
