    and color recovery.
- name: TS-Diff
  title: 'TS-Diff: Two-Stage Diffusion Model for Low-Light RAW Image Enhancement'
  venue: IJCNN
  year: 2025
  paper: https://arxiv.org/abs/2505.04281
  code: https://github.com/CircccleK/TS-Diff
  status: code
  framework: PyTorch
  tldr: To adapt diffusion enhancement across cameras, pretrains camera-feature-integration modules on virtual sensors,
    averages and fine-tunes them on limited target RAW data; a color corrector dynamically aligns global color distributions
    during diffusion.
  note: The pretrained_models/ directory contains only placeholder files
