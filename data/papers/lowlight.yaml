  venue: IEEE TIP
  year: 2022
  paper: https://arxiv.org/abs/2106.14844
  status: no-code
  tldr: To adapt joint brightness, color and denoising across cameras with less recollection, combines a coefficient-estimation
    branch and a joint enhancement/denoising branch; targets camera-specific processing of high-resolution RAW images.
- name: RAW LLE (TIP)
  title: Towards Low Light Enhancement with RAW Images
  venue: IEEE TIP
  year: 2022
  paper: https://arxiv.org/abs/2112.14022
  status: no-code
  tldr: To identify which RAW properties benefit enhancement, introduces a factorized enhancement model for controlled
