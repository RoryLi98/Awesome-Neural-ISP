  venue: arXiv
  year: 2025
  paper: https://arxiv.org/abs/2503.08673
  status: no-code
  tldr: Keypoint detection and description performed directly on Bayer RAW images.
- name: RAW-Bench
  title: 'RAW-Adapter: Adapting Pre-trained Visual Model to Camera RAW Images and A Benchmark'
  venue: arXiv
  year: 2025
  paper: https://arxiv.org/abs/2503.17027
  code: https://github.com/cuiziteng/ECCV_RAW_Adapter
  status: code
