# task: one entry per paper; see CONTRIBUTING.md for the schema
- name: Beyond Bayer
  title: 'Beyond Bayer: Task-Optimal Sensor Co-Design for Robust Autonomous-Driving Segmentation'
  venue: arXiv
  year: 2026
  paper: https://arxiv.org/abs/2606.24096
  status: no-code
  tldr: Jointly optimizes CFA design and a segmentation network to find a task-optimal sensor for autonomous-driving segmentation.
- name: FreqAdapt
  title: 'FreqAdapt: Frequency-Adaptive Processing for RAW Object Detection'
  venue: arXiv
  year: 2026
  paper: https://arxiv.org/abs/2608.03385
  status: no-code
  tldr: Frequency-adaptive preprocessing for RAW object detection.
- name: RAWDet-7
  title: 'RAWDet-7: A Multi-Scenario Benchmark for Object Detection and Description on Quantized RAW Images'
  venue: TMLR
  year: 2026
  paper: https://arxiv.org/abs/2602.03760
  code: https://github.com/Mishalfatima/RawDet-7
  status: code
  tldr: Benchmark for object detection and description on quantized RAW images, including low-bit RAW inputs.
  note: Benchmark code based on MMDetection
- name: RAWild
  title: 'RAWild: Sensor-Agnostic RAW Object Detection via Physics-Guided Curve and Grid Modeling'
  venue: NeurIPS
  year: 2026
  paper: https://arxiv.org/abs/2605.05941
  code: https://github.com/I2WM/RAWild
  status: weights
  weights:
  - label: Checkpoints Det/Seg (Google Drive)
    url: https://drive.google.com/drive/folders/1gJlPLMO7Ty0XszLQTJkoZUIxeqbOwKqd?usp=sharing
  framework: PyTorch
  tldr: Lightweight adapter using per-image Bezier tone curves and bilateral-grid color transforms for sensor-agnostic RAW perception.
- name: RawVLA
  title: 'RawVLA: Embodied Neural Image Signal Processor For Robotic Manipulation'
  venue: arXiv
  year: 2026
  paper: https://arxiv.org/abs/2609.37530
  status: no-code
  tldr: Learns a neural ISP that processes RAW directly for robotic vision-language-action (VLA) policies.
- name: SimROD
  title: 'SimROD: A Simple Baseline for Raw Object Detection with Global and Local Enhancements'
  venue: AAAI
  year: 2026
  paper: https://arxiv.org/abs/2503.07101
  code: https://github.com/ocean146/SimROD
  status: weights
  weights:
  - label: all weights (Baidu, code 2025)
    url: https://pan.baidu.com/s/17zEp6-Zz49M7q1O6e5cUfw
  - label: all weights (Google Drive)
