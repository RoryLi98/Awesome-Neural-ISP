  framework: PyTorch
  tldr: Simple RAW detection baseline combining global gamma enhancement with green-channel-based local detail enhancement.
- name: Synthetic RAW Aug (Person Det)
  title: 'Making the Discrete Continuous: Synthetic RAW Augmentations for Fine-Grained Evaluation of Person Detection Performance in Low Light'
  venue: CVPRW
  year: 2026
  paper: https://arxiv.org/abs/2605.22455
  status: no-code
  tldr: Synthesizes continuously varying low-light levels in the RAW domain for fine-grained evaluation of person detection degradation.
- name: TA-ISP
  title: Task-Aware Image Signal Processor for Advanced Visual Perception
  venue: CVPR
  year: 2026
  paper: https://arxiv.org/abs/2509.13762
  code: https://github.com/CVL-UESTC/TA-ISP
  status: weights
  weights:
  - label: pretrained models (GitHub Release v0.0)
    url: https://github.com/CVL-UESTC/TA-ISP/releases/tag/v0.0
  framework: PyTorch (mmdet/mmseg)
  tldr: Lightweight task-aware ISP that predicts multi-scale modulation operators to adapt RAW input to downstream detection/segmentation.
- name: UniISP
  title: 'UniISP: A Unified ISP Framework for Both Human and Machine Vision'
  venue: arXiv
  year: 2026
  paper: https://arxiv.org/abs/2605.07359
  status: no-code
  tldr: A single ISP that serves both human viewing and downstream vision tasks.
- name: AODRaw
  title: Towards RAW Object Detection in Diverse Conditions
  venue: CVPR
  year: 2025
  paper: https://arxiv.org/abs/2411.15678
  code: https://github.com/lzyhha/AODRaw
  status: code
  tldr: AODRaw, a RAW detection dataset spanning diverse weather and lighting (7785 images at 6000×4000), plus a study of RAW-domain pretraining.
  note: The README mainly covers dataset downloads (Baidu/TeraBox)
- name: APP (Beyond RGB)
  title: 'Beyond RGB: Adaptive Parallel Processing for RAW Object Detection'
  venue: ICCV
  year: 2025
  paper: https://arxiv.org/abs/2503.13163
  status: no-code
  tldr: Parallel multi-branch RAW processing whose outputs are adaptively fused before being fed to the detector.
- name: Bayer-Domain Video CV
  title: Efficient Bayer-Domain Video Computer Vision with Fast Motion Estimation and Learned Perception Residual
  venue: arXiv
  year: 2025
  paper: https://arxiv.org/abs/2508.05990
  status: no-code
  tldr: Skips the ISP to run video vision tasks directly in the Bayer domain, using fast motion estimation to reuse computation across adjacent frames.
  note: 'Related work from the same group: Leveraging Motion Estimation for Efficient Bayer-Domain Computer Vision (arXiv 2501.15119).'
- name: Dark-ISP
  title: 'Dark-ISP: Enhancing RAW Image Processing for Low-Light Object Detection'
  venue: ICCV
  year: 2025
  paper: https://arxiv.org/abs/2509.09183
  code: https://github.com/WildCoder566/Dark-ISP
  status: weights
  weights:
  - label: checkpoint (Baidu, code 2025)
    url: https://pan.baidu.com/s/1i9xUtQFjoFxC5mIbxJcq9A?pwd=2025
  framework: PyTorch (mmdet)
  tldr: Splits the traditional ISP into differentiable linear/nonlinear submodules optimized jointly with the detector for low-light RAW.
  note: README also has a Google Drive link; describes itself as the official implementation
- name: HDR Tone Mapping for Detection
