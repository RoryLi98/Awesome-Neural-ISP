  note: RAW-Bench is marked "coming soon".
- name: SFA RAW Detection
  title: Spatial-Frequency Aware for Object Detection in RAW Image
  venue: arXiv
  year: 2025
  paper: https://arxiv.org/abs/2508.01396
  status: no-code
  tldr: Spatial-frequency-aware object detection on RAW images.
- name: γ-Quant
  title: 'γ-Quant: Towards Learnable Quantization for Low-bit Pattern Recognition'
  venue: GCPR
  year: 2025
  paper: https://arxiv.org/abs/2509.22448
  code: https://github.com/Mishalfatima/Gamma-Quant
  status: code
  tldr: Learns non-linear low-bit quantization curves directly on RAW sensor data for recognition, replacing the ISP.
  note: Only the inertial-sensor part is released so far; vision experiment code is "coming later".
- name: AdaptiveISP
  title: 'AdaptiveISP: Learning an Adaptive Image Signal Processor for Object Detection'
  venue: NeurIPS
  year: 2024
  paper: https://arxiv.org/abs/2410.22939
  code: https://github.com/OpenImagingLab/AdaptiveISP
  status: weights
  weights:
  - label: ckpt-lod-df-1.0 (Release)
