    jointly learns spatial/temporal cues and evaluates against single-frame and temporal baselines.
- name: Unsupervised CC
  title: Unsupervised Learning for Color Constancy
  venue: arXiv
  year: 2017
  paper: https://arxiv.org/abs/1712.00436
  status: no-code
  tldr: To avoid calibrated illumination labels, first approximates unknown training illuminants and learns estimator
    parameters from them; extends the formulation to transfer parameters between sensors using uncalibrated images.
- name: Structured-Output CC
  title: Deep Structured-Output Regression Learning for Computational Color Constancy
  venue: ICPR
  year: 2016
  paper: https://arxiv.org/abs/1607.03856
  status: no-code
  tldr: To model correlated illuminant outputs, combines CNN feature learning with structured multi-output regression;
    learns dependencies between color dimensions rather than treating them as independent prediction targets.
- name: CCC
  title: Convolutional Color Constancy
  venue: ICCV
  year: 2015
  paper: https://arxiv.org/abs/1507.00410
  status: no-code
  tldr: To learn which color casts are plausible, treats illuminant estimation as 2D log-chroma localization and learns
    a discriminative convolutional model; scores correct versus incorrect white-balance hypotheses.
- name: Chroma from Luminance CC
  title: Color Constancy by Learning to Predict Chromaticity from Luminance
  venue: NeurIPS
  year: 2015
  paper: https://arxiv.org/abs/1506.02167
  status: no-code
  tldr: To estimate illumination without spatial/semantic context, learns natural-image chromaticity likelihoods conditioned
    on pixel luminance; end-to-end optimization adjusts these statistics to minimize scene-level illuminant errors.
- name: CNN CC (Bianco)
  title: Color Constancy Using CNNs
  venue: CVPRW
  year: 2015
  paper: https://arxiv.org/abs/1504.04548
  code: https://github.com/WhuEven/CNN_model_ColorConstancy
  status: unofficial
  tldr: To replace handcrafted illuminant features, trains a shallow patch CNN with convolution, max pooling and regression
    outputs; jointly learns spatial color features and illumination prediction, including preliminary local-light estimation.
  note: Third-party reimplementation.
