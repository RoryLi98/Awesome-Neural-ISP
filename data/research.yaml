  summary:
    en: White-balance models need to know the color of the illumination, but labeling its variation at every pixel is
      difficult, especially when several lights illuminate one scene. This work reuses 3D scenes and physically based
      rendering to generate images together with dense illuminant-chromaticity maps under controlled lighting. The resulting
      74,321-image synthetic set pretrains both single- and multi-illuminant estimators before real-data training. Its
      contribution is a reusable data-generation pipeline and pixel-level supervision that reduce dependence on scarce,
      manually measured illumination labels.
    zh-CN: 白平衡模型需要知道光源是什么颜色，但为真实照片的每个像素测量光源颜色很困难，多光源场景尤其如此。本文复用三维场景，通过基于物理的渲染控制灯光，并同步生成逐像素的光源色度标注。作者构建了 74,321 张合成图像，用来预训练单光源和多光源估计模型，再迁移到真实数据。贡献主要在可复用的数据生成管线与密集监督，帮助模型在真实标注较少时学习不同照明条件。
  summary_source: https://arxiv.org/abs/2610.06508
Reference-free ISP Evaluation:
  summary:
    en: Comparing ISP variants with PSNR, SSIM or LPIPS normally requires an aligned reference image, which is hard to
      obtain for real camera captures. Rather than directly regressing a quality score, this method predicts a proxy
      sRGB reference from the processed image and ISO metadata, then applies the standard full-reference metrics to that
      proxy. LoRA fine-tuning adapts the predictor when ISP components change. The contribution is a practical way to
      estimate reference-based quality and pipeline rankings without a real reference at evaluation time; the predicted
      reference remains an estimate, not measured ground truth.
    zh-CN: 比较不同 ISP 的 PSNR、SSIM 或 LPIPS，通常需要一张严格对齐的参考图，而真实相机很难提供这样的图像。本文输入处理后的 sRGB 图像和 ISO，先预测一张“代理参考图”，再按标准公式计算这些指标，而非直接输出一个质量分数。ISP
      组件变化时，可通过 LoRA 做轻量适配。贡献是让没有真实参考图的拍摄也能估计参考型指标、比较管线优劣；预测出的参考图仍是估计值，不能等同于真实测量。
  summary_source: https://arxiv.org/abs/2607.23321
RAW vs RGB Restoration Benchmark:
  summary:
    en: Should denoising and deblurring run before the ISP on RAW data, or after it on RGB images? This benchmark compares
      both placements around a fixed ISP across four smartphone device groups, two learned ISPs, and noise, blur and
      combined degradations. Crucially, it separates where restoration runs from whether its training accounts for the
      target ISP. RAW models outperform generic RGB restorers in the reported comparison, but ISP-aware RGB training
      gives the best overall results. The contribution is an experimental protocol showing why placement and supervision
      must be reported together rather than assuming RAW is always better.
    zh-CN: 去噪、去模糊应该放在 ISP 之前处理 RAW，还是放在之后处理 RGB？本文固定 ISP，在四组手机设备、两种学习式 ISP，以及噪声、模糊和二者混合的退化条件下进行比较，并区分“复原放在哪里”和“训练是否考虑目标
      ISP”这两个因素。实验中，RAW 方案优于通用 RGB 复原模型，但考虑 ISP 变换训练的 RGB 模型取得了更好的整体表现。贡献是建立公平比较协议，说明不能只凭 RAW 或 RGB 域就判断复原效果。
  summary_source: https://arxiv.org/abs/2609.02831
Beyond Bayer:
  summary:
    en: Most driving-perception work improves the downstream model; this paper asks whether the camera should measure
      a different signal in the first place. A differentiable RAW-to-segmentation pipeline jointly studies CFA spectral
      weights, optical blur and noise settings. In the tested simulation, learning a 2×2 CFA improves segmentation, while
      larger CFA tiles and jointly optimized blur do not give the same benefit. The contribution is a controlled sensor-to-task
      co-design study that identifies which camera variables matter under its assumptions, rather than a general claim
      that changing optics always improves perception.
    zh-CN: 自动驾驶通常通过改进分割网络提升感知，本文把问题前移到相机：传感器最初应该采集什么颜色信息？作者构建可微的 RAW 到语义分割管线，分别研究 CFA 光谱权重、光学模糊和噪声设置的作用。在文中的仿真条件下，学习
      2×2 CFA 权重能改善分割，而增大 CFA 单元或联合优化光学模糊未带来同样收益。贡献是通过受控实验找出哪些传感器设计变量真正有用；结论需要结合其仿真和输入表示假设理解。
  summary_source: https://arxiv.org/abs/2606.24096
Edit-aware RAW:
  summary:
    en: 'A RAW reconstructed from an sRGB image may have low pixel error yet behave poorly when the user changes its
      tone or color. This work adds an edit-aware loss to existing reconstruction networks: both predicted and reference
      RAW are rendered through a modular differentiable ISP whose parameters are randomly sampled to represent different
      photographic edits. The loss compares those edited sRGB outputs, teaching the reconstruction to remain useful under
      varied renderings. Its contribution is a plug-in training objective for editing fidelity, not a requirement to
      replace every RAW-reconstruction architecture.'
    zh-CN: 从 sRGB 重建的 RAW 即使像素误差很小，后续调整色调或颜色时仍可能出现明显偏差。本文给现有重建网络加入编辑感知损失：将预测 RAW 和真实 RAW 同时送入模块化可微 ISP，随机采样各模块参数以模拟不同修图操作，再比较编辑后的
      sRGB 结果。这样训练关注的不只是 RAW 数值是否接近，也关注修图后能否得到正确外观。贡献是可接入现有模型的损失函数，提高重建 RAW 的后期编辑适用性。
  summary_source: https://arxiv.org/abs/2512.05859
FreqAdapt:
  summary:
    en: An ISP optimized for attractive pictures may discard information useful for object detection, especially in low
      light or poor weather. FreqAdapt predicts task-adaptive ISP parameters by jointly encoding Fourier amplitude, phase
      and spatial RAW features, and assigns operations to suitable domains according to their properties. A learnable
      frequency-aware fusion combines the enhanced features before detection. The contribution is a lightweight, interpretable
      RAW enhancement module that can be inserted into existing detectors, with the processing objective tied to recognition
      rather than only display appearance.
    zh-CN: 为人眼观感优化的 ISP 不一定保留目标检测需要的信息，弱光或恶劣天气下尤其明显。FreqAdapt 联合编码傅里叶幅度、相位及 RAW 空间特征，预测面向检测任务的 ISP 参数，并根据操作性质分配到适合的处理域；随后通过可学习的频率感知融合汇合增强特征。贡献是可接入现有检测器的轻量
      RAW 增强模块，让成像调整服务于识别目标，同时保留一定物理可解释性。
  summary_source: https://arxiv.org/abs/2608.03385
