2-Shots in the Dark:
  bibtex: "@misc{lu20252shotsdarklowlightdenoising,\n      title={2-Shots in the Dark: Low-Light Denoising with Minimal\
    \ Data Acquisition}, \n      author={Liying Lu and Raphaël Achddou and Sabine Süsstrunk},\n      year={2025},\n \
    \     eprint={2512.03245},\n      archivePrefix={arXiv},\n      primaryClass={cs.CV},\n      url={https://arxiv.org/abs/2512.03245},\
    \ \n}"
  bibtex_source: https://arxiv.org/bibtex/2512.03245
  summary:
    en: Training a low-light denoiser usually requires many clean/noisy image pairs, which are difficult to capture without
      motion or illumination changes. This work instead synthesizes training noise from just one noisy image and one
      dark frame per ISO setting. Poisson sampling models noise caused by photon arrivals, while Fourier-domain spectral
      sampling reproduces the spatial patterns and statistics of signal-independent sensor noise. The contribution is
      a practical data-acquisition and noise-synthesis procedure that supplies varied, realistic training examples without
      collecting a large paired dataset.
    zh-CN: 弱光去噪网络通常需要大量“干净图—噪声图”配对数据，但拍摄时的运动和光照变化使这类数据很难采集。本文在每个 ISO 下只需一张噪声图和一张暗帧：用泊松采样模拟光子到达带来的噪声，再用傅里叶频谱采样保留与信号无关的传感器噪声的空间纹理和统计特征。核心贡献是降低采集成本的噪声合成方法，能生成多样、接近真实传感器的训练样本；这里的“两张”是每个
      ISO 的采集量。
  summary_source: https://arxiv.org/abs/2512.03245
