DRIFT:
  signal:
  - burst
  evidence:
    burst: To combine mobile multi-frame restoration with controllable tone rendering, a perceptually trained MFP network
      aligns, denoises, demosaics and super-resolves RAW bursts; a separate tone-mapping network provides reference-consistent,
      tunable high-resolution output.
    user-parameters: To combine mobile multi-frame restoration with controllable tone rendering, a perceptually trained
      MFP network aligns, denoises, demosaics and super-resolves RAW bursts; a separate tone-mapping network provides
      reference-consistent, tunable high-resolution output.
    reference-style: To combine mobile multi-frame restoration with controllable tone rendering, a perceptually trained
      MFP network aligns, denoises, demosaics and super-resolves RAW bursts; a separate tone-mapping network provides
      reference-consistent, tunable high-resolution output.
  collections:
  - controllable
  - mobile
  control:
  - user-parameters
  - reference-style
  reading:
    en:
      challenge: Mobile bursts require restoration and high-resolution tone mapping while preserving reference appearance
        and tunability.
      method: An adversarially trained multi-frame network aligns, denoises, demosaics and super-resolves RAW; a separate
        tone-mapping network supplies tone tunability and reference consistency.
      contribution: Combines burst reconstruction with a separable, controllable finishing stage for a mobile camera
        pipeline.
      limits: Classify by multi-frame reconstruction, with controllable and mobile collection tags. Hardware speed claims
        require the original resolution and device protocol.
    zh-CN:
      challenge: 移动端连拍需要同时完成复原与高分辨率色调映射，并保持参考外观及可调性。
      method: 以对抗感知目标训练多帧网络，联合对齐、去噪、去马赛克与超分；另用色调映射网络提供可调色调和参考一致性。
      contribution: 将连拍重建与可分离、可调控的后期阶段组合为移动相机管线。
      limits: 按多帧重建归入主分类，同时标注可控与移动端专题；速度结论必须对应原文的分辨率和设备协议。
  bibtex: "@InProceedings{Majee_2026_CVPR,\n    author    = {Majee, Soumendu and Ebenezer, Joshua Peter and Venkataramanan,\
    \ Abhinau K. and Liu, Weidi and Balke, Thilo and Nadir, Zeeshan and Chandran, Sreenithy and Lee, Seok-Jun and Sheikh,\
    \ Hamid Rahim},\n    title     = {DRIFT: Deep Restoration, ISP Fusion, and Tone-mapping},\n    booktitle = {Proceedings\
    \ of the IEEE/CVF Conference on Computer Vision and Pattern Recognition (CVPR) Workshops},\n    month     = {June},\n\
    \    year      = {2026},\n    pages     = {2183-2192}\n}"
  bibtex_source: https://openaccess.thecvf.com/content/CVPR2026W/NTIRE/html/Majee_DRIFT_Deep_Restoration_ISP_Fusion_and_Tone-mapping_CVPRW_2026_paper.html
  summary:
    en: 'A mobile camera must reconstruct detail from handheld RAW bursts and render high-resolution output with consistent,
      adjustable tone. DRIFT separates these jobs: an adversarially/perceptually trained Multi-Frame Processing network
      performs alignment, denoising, demosaicing and super-resolution, then a dedicated tone-mapping network finishes
      the image. The second stage supports tone adjustment and consistency with a reference pipeline. The contribution
      is a mobile-oriented reconstruction-and-rendering pipeline whose finishing stage can be controlled separately;
      runtime comparisons still depend on the tested device and image resolution.'
    zh-CN: 手机需要从手持 RAW 连拍中恢复细节，还要对高分辨率结果进行稳定、可调的色调渲染。DRIFT 将这两部分分开：多帧处理网络通过对抗与感知目标训练，联合完成对齐、去噪、去马赛克和超分辨率；随后由独立色调映射网络完成渲染，并保持与参考管线的色调一致性。贡献是面向移动相机组合重建与后期处理，使色调调节可以独立于多帧复原；速度表现需结合原文设备和分辨率理解。
  summary_source: https://openaccess.thecvf.com/content/CVPR2026W/NTIRE/html/Majee_DRIFT_Deep_Restoration_ISP_Fusion_and_Tone-mapping_CVPRW_2026_paper.html
