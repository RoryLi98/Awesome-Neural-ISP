NPR Color Bias:
  bibtex: "@misc{kınlı2026pixelfidelityminimizingperceptual,\n      title={Beyond Pixel Fidelity: Minimizing Perceptual\
    \ Distortion and Color Bias in Night Photography Rendering}, \n      author={Furkan Kınlı},\n      year={2026},\n\
    \      eprint={2604.28136},\n      archivePrefix={arXiv},\n      primaryClass={cs.CV},\n      url={https://arxiv.org/abs/2604.28136},\
    \ \n}"
  bibtex_source: https://arxiv.org/bibtex/2604.28136
  summary:
    en: Night scenes contain very dark regions beside bright point lights, so optimizing pixel fidelity alone can leave
      poor color and perceptual quality. The proposed pHVI-ISPNet performs RAW-to-RGB rendering in HVI color space, using
      RAW features and wavelet-based propagation to retain fine detail. Sample-dependent loss weights handle exposure
      differences, while a feature-distribution loss encourages color constancy. Its contribution is to address detail,
      exposure variation and color bias together, evaluated with both fidelity and perceptual/color-difference measures
      on the NTIRE night-rendering data.
    zh-CN: 夜景里常同时存在大面积暗部和强点光源，只追求像素误差小，仍可能出现偏色和不自然的观感。本文提出基于 HVI 颜色空间的 pHVI-ISPNet：在 RAW 域处理特征，借助小波特征传播保留细节；根据样本曝光情况动态调整损失权重，并通过特征分布损失约束颜色一致性。贡献是同时处理细节损失、曝光差异和颜色偏差，在
      NTIRE 夜景渲染数据上结合保真、感知和色差指标评估结果。
  summary_source: https://arxiv.org/abs/2604.28136
