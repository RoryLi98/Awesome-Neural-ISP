JD3Net:
  architecture:
  - cnn
  evidence:
    cnn: To reduce demosaicing cost, spatially downsamples before an isotropic fully convolutional network designed with
      mathematical architecture search; evaluates the efficiency/quality trade-off on demosaicing and joint denoising
      tasks.
  bibtex: "@misc{fan2026efficientdeepdemosaicingspatially,\n      title={Efficient Deep Demosaicing with Spatially Downsampled\
    \ Isotropic Networks}, \n      author={Cory Fan and Wenchao Zhang},\n      year={2026},\n      eprint={2601.00703},\n\
    \      archivePrefix={arXiv},\n      primaryClass={cs.CV},\n      url={https://arxiv.org/abs/2601.00703}, \n}"
  bibtex_source: https://arxiv.org/bibtex/2601.00703
  summary:
    en: 'Many demosaicing networks keep all features at full spatial resolution to protect detail, but that makes mobile
      inference expensive. This paper studies the opposite design choice: substantial spatial downsampling before processing
      with a simple isotropic fully convolutional network. A mathematical architecture-design procedure adapted from
      DeepMAD guides the comparison, and the downsampled JD3Net is evaluated on demosaicing and joint denoising/demosaicing
      tasks. The contribution is evidence that a carefully designed low-resolution feature path can improve the efficiency-quality
      balance rather than full-resolution processing being mandatory.'
    zh-CN: 许多去马赛克网络为了保留细节，始终在原分辨率处理特征，但这会带来较高的手机端计算成本。本文研究相反的设计：先明显降低空间分辨率，再使用结构均匀的全卷积网络处理。作者借鉴 DeepMAD 的数学架构设计方法比较不同结构，并在去马赛克、联合去噪与去马赛克任务上评估下采样版本
      JD3Net。贡献是说明合理设计的低分辨率特征路径可以兼顾质量和效率，不必始终保留全分辨率计算。
  summary_source: https://arxiv.org/abs/2601.00703
Pixel-bin Unified Demosaic:
  architecture:
  - classical
  evidence:
    classical: To avoid separate networks for each pixel-bin CFA, uses a modular lightweight shared demosaicing architecture
      and a training-free CFA identifier; supports extensible handling of Quad, Nona and related sensor layouts.
  collections:
  - mobile
  bibtex: "@misc{kumar2026extensiblelightweightunifiedarchitecture,\n      title={An Extensible and Lightweight Unified\
    \ Architecture for Demosaicing Pixel-bin Image Sensors}, \n      author={Saurabh Kumar and Nutan Sairam Yenneti},\n\
    \      year={2026},\n      eprint={2606.13136},\n      archivePrefix={arXiv},\n      primaryClass={cs.CV},\n    \
    \  url={https://arxiv.org/abs/2606.13136}, \n}"
  bibtex_source: https://arxiv.org/bibtex/2606.13136
  summary:
    en: Quad and Nona pixel-bin sensors place same-color samples farther apart than Bayer sensors, making missing-color
      reconstruction harder. Training a different demosaicing network for every color-filter array also increases model
      storage and maintenance. This paper proposes a lightweight modular architecture that shares processing across pixel-bin
      patterns, together with a training-free module that identifies the input CFA. Its contribution is a unified, extensible
      demosaicing design that reduces dependence on separate sensor-specific models and supports plug-and-play pattern
      handling.
    zh-CN: Quad、Nona 等像素合并传感器的不同颜色采样间距比 Bayer 更大，补全缺失颜色更困难；每种排列单独训练网络，也会增加手机端的存储和维护成本。本文设计轻量、模块化的统一去马赛克网络，让不同像素排列共享处理结构，并加入无需训练的
      CFA 识别模块，自动判断输入的颜色滤波阵列类型。贡献是在统一模型中兼顾重建质量、扩展性和部署成本，减少为每种传感器分别维护模型的需要。
  summary_source: https://arxiv.org/abs/2606.13136
