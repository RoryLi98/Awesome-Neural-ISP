      weighting plus camera-aware LoRA; adapts a shared RGB-to-RAW model with lightweight sensor-specific parameters.
    rgb-raw: To handle intensity-dependent inversion difficulty and multiple cameras, uses signal-dependent diffusion
      weighting plus camera-aware LoRA; adapts a shared RGB-to-RAW model with lightweight sensor-specific parameters.
Physically-Informed Raw2Raw:
