Exposure:
  control:
  - user-parameters
  evidence:
    user-parameters: To learn a preferred editing style without paired retouches, trains an RL agent to choose interpretable
      filters and settings with an adversarial objective; reproduces the style distribution of a reference photo collection.
EMOVIS:
  control:
  - user-parameters
  evidence:
    user-parameters: To support expressive rather than solely fidelity-driven rendering, maps four target emotions to
      saturation, local tone, sharpness and other ISP controls using a calibration study; integrates these adjustments
      into conventional hardware stages.
  summary:
    en: A conventional ISP aims for faithful reproduction, but video creators may want a scene to feel happy, calm, angry
      or sad. EMOVIS uses a calibration user study to map those four targets to existing ISP controls, including saturation,
      local tone mapping and sharpness. The resulting control framework runs through standard ISP hardware and is assessed
      with blind A/B preference tests. Its contribution is an experimentally grounded mapping from expressive intent
      to capture-time rendering parameters; it is a conventional control method and does not require training neural
      rendering weights.
    zh-CN: 常规 ISP 倾向于忠实还原场景，但视频创作者有时希望画面传达快乐、平静、愤怒或悲伤。EMOVIS 通过用户标定实验，将这四种情绪目标映射到饱和度、局部色调映射和锐度等已有 ISP 参数，并在标准 ISP 硬件中执行，通过盲测比较观众偏好。贡献是建立有实验依据的“表达意图—拍摄渲染参数”关系。它属于传统
      ISP 控制方法，无需训练神经渲染模型或下载学习型权重。
  summary_source: https://arxiv.org/abs/2605.03131
