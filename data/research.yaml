BinRVR:
  signal:
  - video
  evidence:
    video: To reduce RAW-video restoration cost, models spatial/temporal information with a binarized interaction module
      and uses activation-distribution-aware binary convolution to limit quantization error; supports multibit trade-offs
      and several restoration tasks.
  collections:
  - mobile
  summary:
    en: Binary networks can save computation, but directly applying them to RAW video loses temporal information and
      introduces large quantization errors. BinRVR uses a Binarized Information Interaction Module to exchange spatial
      and temporal features, plus Distribution-Aware Binarized Convolution that uses full-precision activation statistics
      to reduce those errors. It also supports multi-bit variants for different hardware budgets. The contribution is
      a video-oriented binary restoration design covering low-light enhancement, denoising, deblurring and super-resolution,
      with explicit quality-versus-efficiency choices.
    zh-CN: 二值网络能降低计算量，但直接用于 RAW 视频时，容易丢失帧间信息，并因量化造成明显误差。BinRVR 设计二值信息交互模块，联合交换空间与时间特征；再利用全精度激活的分布统计指导二值卷积，减轻量化失真。同时提供多比特配置，让设备按算力预算选择质量与效率。贡献是面向视频特点设计二值复原方法，并在弱光增强、去噪、去模糊和超分辨率等任务中验证。
  summary_source: https://arxiv.org/abs/2608.16756
RawHDRV:
