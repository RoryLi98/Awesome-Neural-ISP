        and feature alignment to stabilize transport.
      contribution: Formulates RAW reconstruction as guided transport between learned RGB/RAW latent representations.
      limits: Recovered RAW is an estimate, not proof of recovery of all original sensor measurements. Compare within
        a specified camera and rendering protocol.
    zh-CN:
      challenge: 渲染丢失信息并改变颜色表示，使 RGB→RAW 逆向重建具有歧义。
      method: 用跨尺度 RGB 引导确定性潜空间流匹配，通过双域自编码器和特征对齐稳定域间传输。
      contribution: 把 RAW 重建建模为学习式 RGB/RAW 潜表示之间的有引导传输。
      limits: 重建 RAW 是估计结果，不证明恢复了全部原始传感器测量；比较应限定相机与渲染协议。
RawGen:
