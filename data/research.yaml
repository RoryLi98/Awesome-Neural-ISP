    \      archivePrefix={arXiv},\n      primaryClass={cs.CV},\n      url={https://arxiv.org/abs/2512.08564}, \n}"
  bibtex_source: https://arxiv.org/bibtex/2512.08564
CtrlISP:
  collections:
  - controllable
  control:
  - user-parameters
  evidence:
    user-parameters: 'To make extreme-low-light enhancement user-controllable, cascades differentiable ISP modules: DenoiseNet
      uses spatial interaction and guidance against dark-shading noise, while ColorNet predicts rendering parameters
      for adaptive color, brightness and style adjustment.'
  reading:
    en:
      challenge: Extreme-low-light restoration needs noise suppression and adjustable color/brightness without hiding
        all controls in one mapping.
      method: 'Cascades differentiable stages: DenoiseNet uses spatial interaction and guidance for dark-shading noise;
        ColorNet predicts adjustable rendering parameters.'
      contribution: Connects low-light restoration with explicit control of color, brightness and style in a neural ISP.
      limits: Its primary task is low-light rendering; controllability is a second dimension. Public implementation status
        is recorded separately from the paper’s claimed capabilities.
    zh-CN:
      challenge: 极弱光复原既需要抑制噪声，也需要可调的颜色与亮度，不能把所有控制都隐藏在单一映射中。
      method: 串联可微阶段：DenoiseNet 通过空间交互与引导处理暗场阴影噪声，ColorNet 预测可调渲染参数。
      contribution: 将弱光复原与颜色、亮度、风格的显式调控结合到神经 ISP 中。
      limits: 主任务是弱光成像，可控性是第二个维度。实现是否公开与论文描述的能力分别记录。
  bibtex: "@InProceedings{Zhang_2026_CVPR,\n    author    = {Zhang, Chi and Li, Yachun and Du, Hang and Yang, Shicai\
    \ and Xie, Di and Zhu, Jiang and Yang, Yang},\n    title     = {CtrlISP: Rescuing Low-Light RAW Images via Controllable\
    \ Neural ISP},\n    booktitle = {Proceedings of the IEEE/CVF Conference on Computer Vision and Pattern Recognition\
    \ (CVPR) Findings},\n    month     = {June},\n    year      = {2026},\n    pages     = {4888-4897}\n}"
  bibtex_source: https://openaccess.thecvf.com/content/CVPR2026F/html/Zhang_CtrlISP_Rescuing_Low-Light_RAW_Images_via_Controllable_Neural_ISP_CVPRF_2026_paper.html
  summary:
    en: 'Simply brightening an extremely dark RAW image amplifies noise and color errors, while a fixed end-to-end output
      gives the user little control. CtrlISP cascades differentiable ISP stages and assigns distinct roles to two networks:
      DenoiseNet uses spatial interaction and guidance to suppress dark-shading noise without laborious calibration;
      ColorNet predicts color-related rendering parameters. Those parameters allow brightness, color and style adjustments
      after restoration. The contribution is to connect low-light recovery with explicit rendering control, so one RAW
      capture can support different preferred appearances.'
    zh-CN: 极暗 RAW 直接提亮会同时放大噪声和偏色，而固定输出的端到端网络又难以满足不同用户的审美。CtrlISP 串联可微 ISP 模块，并分工处理：DenoiseNet 通过空间信息交互和引导抑制暗场阴影噪声，减少繁琐标定；ColorNet
      预测颜色相关的渲染参数，用来调整亮度、色彩和风格。核心贡献是把弱光复原与显式成像控制结合，让同一份 RAW 在恢复可见内容后，还能按偏好产生不同外观。
  summary_source: https://openaccess.thecvf.com/content/CVPR2026F/html/Zhang_CtrlISP_Rescuing_Low-Light_RAW_Images_via_Controllable_Neural_ISP_CVPRF_2026_paper.html
ParamISP:
  collections:
  - controllable
  control:
  - camera-conditioned
  evidence:
    camera-conditioned: To model ISP variations with capture settings, ParamNet embeds EXIF parameters such as ISO and
      exposure into control features for forward/inverse ISP networks; enables parameter-aware reconstruction, RAW editing
      and camera-to-camera transfer.
  reading:
    en:
      challenge: Capture settings change the camera mapping, while image-only models can miss this variation.
      method: ParamNet embeds EXIF capture parameters, including ISO and exposure, into features conditioning learned
        forward and inverse ISP networks.
      contribution: Connects capture-aware rendering, RAW reconstruction and camera transfer in one parameter-conditioned
        formulation.
      limits: Conditioning variables describe acquisition. Evaluate manipulation of those variables separately from intuitive
        user-facing editing controls.
    zh-CN:
      challenge: 不同拍摄设置会改变相机映射，仅依赖图像的模型可能忽略这种变化。
      method: ParamNet 将 ISO、曝光等 EXIF 拍摄参数编码为条件特征，调制正向与逆向 ISP 网络。
      contribution: 在参数条件化框架中联结拍摄感知渲染、RAW 重建与相机迁移。
      limits: 条件变量首先描述采集设置；修改这些变量的能力，需要与直观的用户编辑滑杆分别评估。
  bibtex: "@misc{kim2024paramisplearnedforwardinverse,\n      title={ParamISP: Learned Forward and Inverse ISPs using\
    \ Camera Parameters}, \n      author={Woohyeok Kim and Geonu Kim and Junyong Lee and Seungyong Lee and Seung-Hwan\
    \ Baek and Sunghyun Cho},\n      year={2024},\n      eprint={2312.13313},\n      archivePrefix={arXiv},\n      primaryClass={eess.IV},\n\
    \      url={https://arxiv.org/abs/2312.13313}, \n}"
  bibtex_source: https://arxiv.org/bibtex/2312.13313
MetaISP:
  collections:
  - controllable
  control:
  - camera-conditioned
  evidence:
    camera-conditioned: To reproduce device-specific color rather than only DSLR-like detail, uses cross-covariance-inspired
      attention for global semantics and conditions rendering on device metadata, with illuminant estimation when metadata
      is missing.
  reading:
    en:
      challenge: Matching detail alone does not reproduce the scene-dependent color choices of different devices.
      method: Uses global semantic features with cross-covariance-inspired attention and device metadata; estimates illuminants
        when metadata is unavailable.
      contribution: Models multi-device color rendition explicitly instead of treating all devices as one target style.
      limits: Device-conditioned output is documented; an interactive editor is not implied by metadata input.
    zh-CN:
      challenge: 仅匹配局部细节不足以复现不同设备随场景变化的颜色选择。
      method: 结合带交叉协方差启发式注意力的全局语义特征与设备元数据，在元数据缺失时估计光源。
      contribution: 显式建模多设备颜色表现，避免将所有设备视为同一种目标风格。
      limits: 原文支持设备条件化输出；输入元数据本身不代表提供交互式编辑器。
  bibtex: "@misc{souza2024metaispexploitingglobal,\n      title={MetaISP -- Exploiting Global Scene Structure for Accurate\
    \ Multi-Device Color Rendition}, \n      author={Matheus Souza and Wolfgang Heidrich},\n      year={2024},\n    \
    \  eprint={2401.03220},\n      archivePrefix={arXiv},\n      primaryClass={cs.CV},\n      doi={https://doi.org/10.2312/vmv.20231236},\n\
    \      url={https://arxiv.org/abs/2401.03220}, \n}"
  bibtex_source: https://arxiv.org/bibtex/2401.03220
Uni-ISP:
  collections:
  - controllable
  control:
  - camera-conditioned
  evidence:
    camera-conditioned: To avoid a separate neural ISP for every camera, conditions jointly learned forward/inverse mappings
      on device embeddings; releases synchronized FiveCam RAW–sRGB pairs and evaluates adaptation to new devices and
      cross-camera rendering.
  reading:
    en:
      challenge: Training and maintaining an independent neural ISP for every mobile camera is expensive.
      method: Conditions jointly learned forward and inverse mappings on device embeddings and trains across synchronized
        multi-camera RAW/sRGB data.
      contribution: Introduces FiveCam and evaluates shared ISP learning, adaptation and cross-camera rendering.
      limits: Device selection and adaptation are different from free-form user editing. Keep Uni-ISP distinct from the
        separate human/machine-vision paper UniISP.
    zh-CN:
      challenge: 为每台移动相机单独训练和维护神经 ISP 的成本较高。
      method: 用设备嵌入作为条件，联合学习正向与逆向映射，并利用同步的多相机 RAW/sRGB 数据训练。
      contribution: 提出 FiveCam 数据集，评估共享 ISP 学习、新设备适配与跨相机渲染。
      limits: 设备选择和适配不同于自由用户编辑；也应与另一篇面向人类和机器视觉的 UniISP 区分。
  bibtex: "@misc{li2026uniispunifyinglearningisps,\n      title={Uni-ISP: Toward Unifying the Learning of ISPs from Multiple\
