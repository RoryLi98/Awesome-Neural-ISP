  signal:
  - burst
  evidence:
    diffusion: To add realistic texture to burst SR, augments a conventional reconstructor with multiframe diffusion
      priors, degradation-aware conditioning and an sRGB-to-linear inverter; controls generative detail while retaining
      linear-domain fidelity.
    burst: To add realistic texture to burst SR, augments a conventional reconstructor with multiframe diffusion priors,
      degradation-aware conditioning and an sRGB-to-linear inverter; controls generative detail while retaining linear-domain
      fidelity.
  bibtex: "@misc{huo2026burstgpenhancingrawburst,\n      title={BurstGP: Enhancing Raw Burst Image Super Resolution with\
    \ Generative Priors}, \n      author={Dong Huo and Tristan Aumentado-Armstrong and Samrudhdhi B. Rangrej and Maitreya\
    \ Suin and Angela Ning Ye and Zhiming Hu and Amanpreet Walia and Amirhossein Kazerouni and Konstantinos G. Derpanis\
    \ and Iqbal Mohomed and Alex Levinshtein},\n      year={2026},\n      eprint={2604.23508},\n      archivePrefix={arXiv},\n\
    \      primaryClass={cs.CV},\n      url={https://arxiv.org/abs/2604.23508}, \n}"
  bibtex_source: https://arxiv.org/bibtex/2604.23508
  summary:
    en: Burst super-resolution combines several low-resolution frames, but conventional reconstruction often smooths
      away complex textures. BurstGP builds a multi-frame-aware diffusion model on top of a conventional burst restorer
      to add priors from pretrained generative models. Degradation-aware conditioning adjusts detail synthesis to the
      input quality, and an sRGB-to-linear-RGB inverter makes display-image priors usable with RAW input and linear output.
      The contribution is to bring multi-frame generative texture recovery into the linear camera pipeline while explicitly
      balancing perceptual detail against reconstruction fidelity.
    zh-CN: 连拍超分辨率利用多张低分辨率图恢复细节，但常规重建容易把复杂纹理抹平。BurstGP 在传统连拍复原结果上引入感知多帧信息的扩散模型，使用预训练生成模型的图像先验补充纹理。退化感知条件根据输入质量调节细节生成，sRGB
      到线性 RGB 的逆变换则把显示图像先验接入 RAW 输入、线性输出的流程。贡献是将多帧生成先验用于相机连拍重建，并明确权衡视觉细节与对原始观测的忠实程度。
  summary_source: https://arxiv.org/abs/2604.23508
DEBIR:
  signal:
  - burst
  evidence:
    burst: To adapt burst acquisition to motion and lighting, BAENet predicts per-frame exposure from a preview, motion
      and gain; a differentiable burst simulator and staged training jointly optimize capture and restoration.
  bibtex: "@misc{kim2026dynamicexposureburstimage,\n      title={Dynamic Exposure Burst Image Restoration}, \n      author={Woohyeok\
    \ Kim and Jaesung Rim and Daeyeon Kim and Sunghyun Cho},\n      year={2026},\n      eprint={2603.21784},\n      archivePrefix={arXiv},\n\
    \      primaryClass={cs.CV},\n      url={https://arxiv.org/abs/2603.21784}, \n}"
  bibtex_source: https://arxiv.org/bibtex/2603.21784
  summary:
    en: Long exposures collect more light but increase motion blur, so using manually fixed settings for every burst
      can limit restoration quality. DEBIR first uses BAENet to predict each frame’s exposure time from a preview image,
      motion magnitude and gain, then reconstructs the adaptively captured burst. A differentiable burst simulator and
      three-stage training procedure allow the capture policy and restorer to be optimized together. The contribution
      is to treat exposure selection as part of burst restoration rather than a fixed preprocessing choice, with validation
      on a real camera system.
    zh-CN: 曝光越长通常越亮，但运动模糊也越明显，因此一套固定连拍曝光不一定适合所有场景。DEBIR 的 BAENet 根据预览图、运动幅度和增益，为连拍中的每帧预测曝光时间，再由复原网络融合这些自适应采集的图像。作者构建可微连拍模拟器，并用三阶段训练联合优化拍摄策略与复原模型。贡献是将“怎么拍”纳入复原过程，而非把曝光当作固定前提，并通过真实相机系统验证。
  summary_source: https://arxiv.org/abs/2603.21784
