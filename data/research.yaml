      without pixel-aligned references.
    automatic: To tune color despite viewpoint and field-of-view mismatch, establishes region-level color correspondences
      and searches a dedicated 3D-LUT parameter space with multiple objectives; enables interpretable subjective color
      tuning without pixel-aligned references.
  control:
