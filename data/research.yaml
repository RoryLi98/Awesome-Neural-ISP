  summary:
    en: Using a DSLR photograph as an ISP color reference is attractive, but viewpoint and field-of-view differences
      make pixel-wise matching unreliable. ChameleonTuner establishes region-level color correspondences, then performs
      multi-objective optimization in a dedicated 3D-LUT search space. This lets color tuning compare corresponding scene
      regions without requiring exact geometric alignment. The contribution is an interpretable, controllable LUT-calibration
      workflow for subjective appearance targets, evaluated on both misaligned reference images and aligned retouching
      data.
    zh-CN: 用单反照片作为手机 ISP 的颜色参考很有吸引力，但视角和视野不同，逐像素比较往往不可靠。ChameleonTuner 先建立区域级颜色对应关系，再在专门设计的 3D LUT 参数空间中进行多目标搜索，依据对应场景区域调整颜色，而不要求两张照片严格对齐。贡献是面向主观外观目标的可解释调色流程，兼顾控制灵活性，并在存在几何错位的参考图和对齐修图数据上评估。
  summary_source: https://openaccess.thecvf.com/content/WACV2026/html/Tan_ChameleonTuner_Automatic_ISP_Color_Tuning_in_Subjective_Scenarios_WACV_2026_paper.html
