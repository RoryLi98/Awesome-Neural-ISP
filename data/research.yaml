    diffusion: To synthesize sensor-specific RAW from labeled RGB collections, injects multiresolution RGB-guidance features
      into reverse-diffusion residual blocks; generates BDD100K-RAW/Cityscapes-RAW for data-efficient RAW object detection.
Learnable CCM RAW Recon:
  architecture:
  - cnn
