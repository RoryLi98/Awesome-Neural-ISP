Adaptive Color Grading:
  architecture:
  - lut
  signal:
  - video
  evidence:
    lut: To control shadows/highlights independently, predicts tonescale-region thresholds with K-nearest neighbors trained
      on annotated video frames; region-specific CIELAB adjustments compose into one deployable 3D LUT within an open
      grading tool.
    video: To control shadows/highlights independently, predicts tonescale-region thresholds with K-nearest neighbors
      trained on annotated video frames; region-specific CIELAB adjustments compose into one deployable 3D LUT within
      an open grading tool.
  summary:
    en: Adjusting shadows and highlights independently requires choosing where each tonal region begins and ends; a single
      fixed threshold does not suit every image. The authors build an open grading tool and annotate video frames with
      these thresholds, then use K-nearest-neighbor prediction to select them for new content. Color adjustments in CIELAB
      are applied to the corresponding tonal regions and combined into a deployable 3D LUT. The contribution is an adaptive,
      compact parameter-based grading workflow, together with the tool and annotations, that keeps the main creative
      controls understandable.
    zh-CN: 给暗部和亮部分别调色，首先要确定这些区域的明暗分界，而固定阈值难以适应所有图像。作者开发开放调色工具，为视频帧标注明暗区域阈值，再用 K 近邻方法为新图像预测合适的分界。在 CIELAB 空间对各明暗区域进行颜色调整后，将结果组合成可部署的三维查找表（3D
      LUT）。贡献是围绕少量、可理解参数建立自适应调色流程，并提供工具和标注数据，方便保留创作者对效果的控制。
  summary_source: https://arxiv.org/abs/2609.21169
FlowTool:
  architecture:
  - transformer
  - diffusion
  - flow
  evidence:
    transformer: To predict editable tool settings from images and instructions, models their joint distribution with
      conditional rectified flow using a vision-language backbone and diffusion Transformer; staged flow training plus
      reward post-training replaces sequential parameter reasoning.
    diffusion: To predict editable tool settings from images and instructions, models their joint distribution with conditional
      rectified flow using a vision-language backbone and diffusion Transformer; staged flow training plus reward post-training
      replaces sequential parameter reasoning.
    flow: To predict editable tool settings from images and instructions, models their joint distribution with conditional
      rectified flow using a vision-language backbone and diffusion Transformer; staged flow training plus reward post-training
      replaces sequential parameter reasoning.
    user-parameters: To predict editable tool settings from images and instructions, models their joint distribution
      with conditional rectified flow using a vision-language backbone and diffusion Transformer; staged flow training
      plus reward post-training replaces sequential parameter reasoning.
    rgb: To predict editable tool settings from images and instructions, models their joint distribution with conditional
      rectified flow using a vision-language backbone and diffusion Transformer; staged flow training plus reward post-training
      replaces sequential parameter reasoning.
  control:
  - user-parameters
  signal:
  - rgb
  summary:
    en: 'Instruction-based retouching agents often predict tools and numerical settings token by token, which can be
      slow. FlowTool instead models the joint distribution of editing parameters with conditional rectified flow: a vision-language
      backbone interprets the image and instruction, while a Diffusion Transformer turns Gaussian noise into an editable
      tool plan. Training combines a staged supervised flow-matching curriculum with reward-based post-training. The
      contribution is to generate structured, continuous tool settings directly, improving editing efficiency while retaining
      an explicit plan that can be applied through image-processing tools.'
    zh-CN: 按文字指令修图的智能体常逐个词元生成工具及数值参数，执行较慢。FlowTool 将问题改为编辑参数的联合生成：视觉语言骨干理解图像与指令，Diffusion Transformer 通过条件整流流，将高斯噪声转换成可执行、可编辑的工具参数计划。训练包括分阶段监督流匹配和基于奖励的后训练。贡献是直接建模连续参数之间的关系，减少逐步生成的开销，同时保留明确的修图工具计划。
  summary_source: https://arxiv.org/abs/2609.35673
