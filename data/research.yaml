FourierISP:
  reading:
    en:
      challenge: Cross-camera training couples geometric reconstruction with differences in style and color.
      method: Separates Fourier phase enhancement, amplitude refinement and color adaptation into subnetworks before
        fusing their outputs.
      contribution: Provides a frequency-domain decomposition for learning structure and appearance with distinct processing
        paths.
      limits: Separate style/structure branches do not automatically constitute an interactive editor. Check alignment
        and color-supervision assumptions in comparisons.
    zh-CN:
      challenge: 跨相机训练会把几何结构重建与风格、颜色差异耦合起来。
      method: 将傅里叶相位增强、幅度细化和颜色适配分成子网络，再融合各分支输出。
      contribution: 提供频域分解方式，让结构与外观通过不同路径学习。
      limits: 分开风格与结构分支不自动等于提供交互编辑器；对比时需检查对齐条件与颜色监督假设。
  bibtex: "@misc{he2024enhancingrawtosrgbdecoupledstyle,\n      title={Enhancing RAW-to-sRGB with Decoupled Style Structure\
    \ in Fourier Domain}, \n      author={Xuanhua He and Tao Hu and Guoli Wang and Zejin Wang and Run Wang and Qian Zhang\
    \ and Keyu Yan and Ziyi Chen and Rui Li and Chenjun Xie and Jie Zhang and Man Zhou},\n      year={2024},\n      eprint={2401.02161},\n\
    \      archivePrefix={arXiv},\n      primaryClass={cs.CV},\n      url={https://arxiv.org/abs/2401.02161}, \n}"
  bibtex_source: https://arxiv.org/bibtex/2401.02161
LED:
  reading:
    en:
      challenge: Explicit per-camera noise calibration is expensive and synthetic noise can differ from the target sensor.
      method: Pretrains a denoiser across virtual camera noise models, then uses a small target-camera adaptation set
        to calibrate the denoiser rather than explicitly fit a noise model.
      contribution: Moves calibration effort into model adaptation and reduces dependence on an elaborate target-sensor
        noise-fitting procedure.
      limits: Reduced calibration does not mean zero target-camera data. Keep adaptation data, ISO coverage and test-camera
        overlap explicit.
    zh-CN:
      challenge: 逐相机显式标定噪声成本较高，合成噪声也可能与目标传感器不一致。
      method: 先在虚拟相机噪声模型上预训练去噪器，再用少量目标相机样本适配模型，把标定对象从噪声模型转为去噪器。
      contribution: 将标定工作转移到模型适配，降低对复杂目标传感器噪声拟合流程的依赖。
      limits: 减少标定不等于完全不需要目标相机数据；适配样本、ISO 覆盖和测试相机重叠应明确记录。
  bibtex: "@misc{jin2023makeexplicitcalibrationimplicit,\n      title={Make Explicit Calibration Implicit: Calibrate\
    \ Denoiser Instead of the Noise Model}, \n      author={Xin Jin and Jia-Wen Xiao and Ling-Hao Han and Chunle Guo\
    \ and Xialei Liu and Chongyi Li and Ming-Ming Cheng},\n      year={2023},\n      eprint={2308.03448},\n      archivePrefix={arXiv},\n\
    \      primaryClass={cs.CV},\n      url={https://arxiv.org/abs/2308.03448}, \n}"
  bibtex_source: https://arxiv.org/bibtex/2308.03448
ReconfigISP:
  reading:
    en:
      challenge: Optimizing parameters alone cannot choose which conventional ISP operations should be present or how
        to arrange them.
      method: Trains differentiable proxies of conventional ISP modules and applies differentiable architecture search,
        with proxy tuning during optimization.
      contribution: Optimizes pipeline structure and settings for different sensors, objectives and efficiency constraints.
      limits: A neural proxy used for search is distinct from replacing the deployed pipeline with a neural renderer.
        Proxy accuracy affects optimization reliability.
    zh-CN:
      challenge: 仅优化参数无法决定传统 ISP 应包含哪些操作以及如何组织。
      method: 训练传统 ISP 模块的可微代理，结合可微架构搜索，并在优化中调整代理。
      contribution: 针对不同传感器、任务与效率约束，同时优化管线结构和参数。
      limits: 用于搜索的神经代理不等于部署时以神经网络替换整个 ISP；代理误差会影响优化结果的可靠性。
