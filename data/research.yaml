  - video
  evidence:
    video: To recover HDR from single-exposure RAW sequences, aligns Bayer channels separately, weights fusion by exposure
      and restores saturation using an exposure-complementarity mask; contributes mobile RAW video with per-frame HDR
      references.
Real-Time Raw2Raw Mobile Denoise:
