Fourier Unpaired ISP:
  architecture:
  - transformer
  supervision:
  - unpaired
  evidence:
    transformer: To prevent unpaired color learning from damaging geometry, stabilizes and freezes FourierISP's structural
      branch, then trains color with a blurred-image ViT discriminator, inverse-cycle consistency and VGG perceptual
      losses under a staged curriculum.
    unpaired: To prevent unpaired color learning from damaging geometry, stabilizes and freezes FourierISP's structural
      branch, then trains color with a blurred-image ViT discriminator, inverse-cycle consistency and VGG perceptual
      losses under a staged curriculum.
  collections:
  - mobile
  bibtex: "@InProceedings{Kim_2026_CVPR,\n    author    = {Kim, Jaemin and Kim, Jinwoo and Kim, Seon Joo},\n    title\
    \     = {Freeze the Structure, Free the Color: Fourier-Domain Training for Unpaired Smartphone ISP},\n    booktitle\
    \ = {Proceedings of the IEEE/CVF Conference on Computer Vision and Pattern Recognition (CVPR) Workshops},\n    month\
    \     = {June},\n    year      = {2026},\n    pages     = {1980-1988}\n}"
  bibtex_source: https://openaccess.thecvf.com/content/CVPR2026W/NTIRE/html/Kim_Freeze_the_Structure_Free_the_Color_Fourier-Domain_Training_for_Unpaired_CVPRW_2026_paper.html
  summary:
    en: Unpaired RAW-to-sRGB training must learn target colors without letting adversarial supervision distort scene
      geometry. Built on FourierISP’s phase, amplitude and color branches, this method first stabilizes the structural
      pathway with self-supervised identity losses and freezes it. A Vision Transformer discriminator examines blurred
      images for color alignment, while an inverse network supplies cycle consistency and VGG-19 features provide perceptual
      supervision. The contribution is a staged training strategy that protects structure while adapting appearance without
      aligned RAW/RGB pairs, rather than a wholly new ISP backbone.
