      low-frequency artifacts.
  bibtex: "@misc{weligampola2026genmfsrgenerativemultiframeimage,\n      title={GenMFSR: Generative Multi-Frame Image\
    \ Restoration and Super-Resolution}, \n      author={Harshana Weligampola and Joshua Peter Ebenezer and Weidi Liu\
    \ and Abhinau K. Venkataramanan and Sreenithy Chandran and Seok-Jun Lee and Hamid Rahim Sheikh},\n      year={2026},\n\
    \      eprint={2603.19187},\n      archivePrefix={arXiv},\n      primaryClass={eess.IV},\n      url={https://arxiv.org/abs/2603.19187},\
    \ \n}"
  bibtex_source: https://arxiv.org/bibtex/2603.19187
  summary:
    en: Handheld RAW bursts contain small subpixel shifts that can help recover resolution, but conventional adversarial
      training remains limited by its target-image quality. GenMFSR aligns multiple RAW frames and introduces foundation-model
      image priors into joint denoising, demosaicing and super-resolution. A RAW-domain loss restricts generative changes
      to high-frequency regions, reducing low-frequency artifacts while allowing texture synthesis. The contribution
      is a generative multi-frame RAW-to-RGB reconstruction pipeline that combines measured cross-frame information with
      learned detail priors.
    zh-CN: 手持 RAW 连拍中的亚像素位移能帮助恢复分辨率，但常规对抗训练的细节质量仍受参考图限制。GenMFSR 先对齐多张 RAW，再引入基础模型的图像先验，联合完成去噪、去马赛克和超分辨率。为减少生成模型改变整体外观的问题，作者在
      RAW 域加入损失，将生成变化限制在高频区域，抑制低频伪影。贡献是把真实帧间观测与生成细节先验结合到多帧 RAW 到 RGB 重建中。
  summary_source: https://arxiv.org/abs/2603.19187
