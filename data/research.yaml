NILUT:
  control:
  - user-parameters
  evidence:
    user-parameters: To store multiple color styles compactly, represents a continuous 3D color transform with a small
      neural implicit function; conditioning shares one model across LUT styles and enables continuous blending.
    rgb: To store multiple color styles compactly, represents a continuous 3D color transform with a small neural implicit
      function; conditioning shares one model across LUT styles and enables continuous blending.
    implicit: To store multiple color styles compactly, represents a continuous 3D color transform with a small neural
      implicit function; conditioning shares one model across LUT styles and enables continuous blending.
  signal:
  - rgb
  reading:
    en:
      challenge: Fixed sampled LUTs constrain color-transform flexibility and smooth style blending.
      method: Uses a conditional implicit neural representation as a continuous color lookup function, with style conditioning
        rather than only a fixed discrete 3D grid.
      contribution: Supports continuous color transformations and controllable blending for enhancement within a compact
        learned representation.
      limits: This is a color-rendering module for RGB data, not a complete RAW ISP. Its user control is searchable without
        moving it into the full-pipeline collection.
    zh-CN:
      challenge: 固定采样的 LUT 限制了颜色变换的表达与平滑风格混合。
      method: 用带风格条件的隐式神经表示构建连续颜色查找函数，而非只依赖固定离散三维网格。
      contribution: 以紧凑学习式表示支持连续颜色变换与可控风格混合。
      limits: 这是处理 RGB 的颜色渲染模块，不是完整 RAW ISP；可通过控制标签检索，但不混入完整管线专题。
  architecture:
  - implicit
