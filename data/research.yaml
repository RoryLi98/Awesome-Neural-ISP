Deep-FlexISP:
  signal:
  - raw-rgb
  evidence:
    raw-rgb: To decouple night-rendering noise, color and brightness, cascades RAW denoising, white balance and Bayer-to-sRGB
      subnetworks; weakly coupled stages simplify training and allow style adjustments through the intermediate pipeline.
    reference-style: To decouple night-rendering noise, color and brightness, cascades RAW denoising, white balance and
      Bayer-to-sRGB subnetworks; weakly coupled stages simplify training and allow style adjustments through the intermediate
      pipeline.
  collections:
  - controllable
  control:
  - reference-style
  reading:
    en:
      challenge: Night rendering couples noise, color and brightness, making a single mapping hard to optimize or personalize.
      method: Cascades RAW denoising, white balance and Bayer-to-sRGB subnetworks as weakly coupled tasks.
      contribution: Task decomposition supports training and adjustment of rendering styles to personal preferences.
      limits: A modular design alone is not proof of user controls; this paper explicitly discusses style adjustment.
        Its linked 2022 model download and later repository checkpoints are different resources.
    zh-CN:
      challenge: 夜景渲染中的噪声、颜色与亮度相互耦合，单一映射难以优化或按偏好调整。
      method: 把 RAW 去噪、白平衡、Bayer→sRGB 子网络串联为弱耦合任务。
      contribution: 通过任务分解帮助训练，并支持按个人偏好调整渲染风格。
      limits: 模块化本身不证明用户可控；此文明确讨论风格调整。2022 年模型下载与仓库中的后续参赛权重应分开看待。
