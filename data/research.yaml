GALOSH:
  bibtex: "@misc{sato2026galoshblindtrainingfreedenoising,\n      title={GALOSH: Blind, Training-Free Denoising of Raw\
    \ Bayer and sRGB Images by Parallel-Friendly Local Shrinkage}, \n      author={Yoshiro Sato},\n      year={2026},\n\
    \      eprint={2607.03768},\n      archivePrefix={arXiv},\n      primaryClass={eess.IV},\n      url={https://arxiv.org/abs/2607.03768},\
    \ \n}"
  bibtex_source: https://arxiv.org/bibtex/2607.03768
  summary:
    en: 'Traditional denoisers spend substantial time searching for similar patches, while neural denoisers need training
      and may fail on unfamiliar sensors. GALOSH removes both the patch search and learned model: it estimates Poisson–Gaussian
      noise per image, stabilizes it with a generalized Anscombe transform, then applies local Walsh–Hadamard shrinkage
      to luminance and luminance-guided regression to chroma. Separate controls set the strengths of the two treatments.
      The contribution is a regular, parallel-friendly denoising pipeline for RAW Bayer and sRGB/YUV, including a fixed-point
      realization for constrained hardware.'
    zh-CN: 传统去噪器搜索相似图块的开销较大，神经去噪器则需要训练，换传感器后也可能失效。GALOSH 无需训练或图块搜索：逐图估计泊松—高斯噪声，经广义 Anscombe 变换稳定噪声后，对亮度做局部 Walsh–Hadamard
      收缩，对色度做亮度引导回归，并分别控制二者强度。贡献是规则、易并行的去噪流程，同一核心支持 RAW Bayer 和 sRGB/YUV，还提供定点实现，便于受限硬件部署。
  summary_source: https://arxiv.org/abs/2607.03768
