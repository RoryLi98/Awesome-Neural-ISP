Neural Photo-Finishing:
  signal:
  - video
  evidence:
    video: To retain fine-grained controls while enabling gradients, concatenates tailored neural proxies of individual
      legacy finishing steps; supports image/video style transfer, ISP slider regression and photography-driven neural
      demosaicing.
    modular: To retain fine-grained controls while enabling gradients, concatenates tailored neural proxies of individual
      legacy finishing steps; supports image/video style transfer, ISP slider regression and photography-driven neural
      demosaicing.
    user-parameters: To retain fine-grained controls while enabling gradients, concatenates tailored neural proxies of
      individual legacy finishing steps; supports image/video style transfer, ISP slider regression and photography-driven
      neural demosaicing.
    reference-style: To retain fine-grained controls while enabling gradients, concatenates tailored neural proxies of
      individual legacy finishing steps; supports image/video style transfer, ISP slider regression and photography-driven
      neural demosaicing.
  collections:
  - controllable
  control:
  - modular
  - user-parameters
  - reference-style
  reading:
    en:
      challenge: Legacy photo-finishing stages provide controls but are difficult to differentiate end to end.
      method: Builds tailored neural proxies of individual finishing operations and concatenates them into a differentiable
        rendering pipeline.
      contribution: Preserves module-specific controls while enabling style transfer, slider regression and photography-driven
        neural demosaicing.
      limits: These learned proxies approximate legacy operations. Evaluate approximation fidelity and editing control
        separately from restoration quality.
    zh-CN:
      challenge: 传统后期处理阶段提供精细控制，但难以端到端求导。
      method: 为各个后期操作构建专门的神经代理，再拼接成可微渲染管线。
      contribution: 保留阶段控制，同时支持风格迁移、滑杆参数回归及面向摄影效果的神经去马赛克。
      limits: 神经代理近似的是传统操作；近似精度、控制效果与图像复原质量需要分别评估。
  bibtex: '@article{Tseng_2022, title={Neural Photo-Finishing}, volume={41}, ISSN={1557-7368}, url={http://dx.doi.org/10.1145/3550454.3555526},
