BRACE:
  bibtex: "@misc{zhou2026brickerbracebracketexposure,\n      title={Bricker to BRACE: A Bracket Exposure RAW Dataset\
    \ and Restoration Model for Flicker-Banding}, \n      author={Zihan Zhou and Libo Zhu and Jue Gong and Zhiyi Zhou\
    \ and Jiezhang Cao and Yong Guo and Yulun Zhang},\n      year={2026},\n      eprint={2606.29845},\n      archivePrefix={arXiv},\n\
    \      primaryClass={cs.CV},\n      url={https://arxiv.org/abs/2606.29845}, \n}"
  bibtex_source: https://arxiv.org/bibtex/2606.29845
  summary:
    en: Photographing a display can produce flicker bands when its brightness modulation interacts with a rolling shutter;
      those bands can resemble real texture. BRACE combines RAW frames taken at bracketed exposures, using a frequency-aware
      banding prior and multi-scale spatial cross-attention to select complementary information across exposures. The
      paper also introduces Bricker, a synthetic/real bracketed dataset, and Stripe Frequency Consistency for evaluation.
      Its contribution combines a multi-frame restoration method, data and a banding-specific metric instead of relying
      only on a simplified single-frame stripe model.
    zh-CN: 相机拍摄屏幕时，屏幕亮度调制与滚动快门相互作用，会产生闪烁条带，而且这些条带可能与真实纹理混淆。BRACE 联合处理不同曝光的 RAW 帧，用频率感知的条带先验定位干扰，再通过多尺度空间交叉注意力融合各曝光的互补信息。论文同时构建包含合成和真实采集数据的
      Bricker 数据集，并提出条纹频率一致性指标。贡献覆盖复原模型、包围曝光数据和针对条带的评测方式。
  summary_source: https://arxiv.org/abs/2606.29845
