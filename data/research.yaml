  bibtex: "@InProceedings{Tan_2026_WACV,\n    author    = {Tan, Zijie and Yue, Yuxin and Rashidi, Bahador},\n    title\
    \     = {ChameleonTuner: Automatic ISP Color Tuning in Subjective Scenarios},\n    booktitle = {Proceedings of the\
