  - user-parameters
  evidence:
    modular: To expose controls hidden by monolithic neural ISPs, separates denoising, color processing, photofinishing
      and upsampling into replaceable learned stages; supports style-specific modules and repeated RAW re-rendering through
      an interactive editor.
    reference-style: To expose controls hidden by monolithic neural ISPs, separates denoising, color processing, photofinishing
      and upsampling into replaceable learned stages; supports style-specific modules and repeated RAW re-rendering through
      an interactive editor.
    user-parameters: To expose controls hidden by monolithic neural ISPs, separates denoising, color processing, photofinishing
      and upsampling into replaceable learned stages; supports style-specific modules and repeated RAW re-rendering through
      an interactive editor.
  reading:
    en:
      challenge: A monolithic RAW-to-RGB network makes individual rendering stages difficult to replace or edit.
      method: Separates denoising, color processing, photofinishing and upsampling into learned modules, with style-specific
        photofinishing and an interactive RAW editor.
      contribution: Exposes reusable stages and repeated rendering of a RAW capture instead of requiring one fixed end-to-end
        appearance.
      limits: Replaceable modules and the released editor are direct editing evidence. Module availability does not establish
        unrestricted cross-sensor compatibility.
    zh-CN:
      challenge: 单一 RAW→RGB 网络把处理阶段耦合在一起，难以单独替换模块或编辑成像效果。
      method: 将去噪、颜色处理、后期渲染和上采样分成学习模块，提供针对不同风格的后期模块与交互式 RAW 编辑器。
      contribution: 让同一份 RAW 可重复渲染并复用、替换阶段，使可编辑性成为管线设计的一部分。
      limits: 模块替换与已发布编辑器是直接的编辑能力依据；存在模块接口不等于已经验证任意传感器间的兼容性。
