Rawformer:
  architecture:
  - transformer
  supervision:
  - unpaired
  signal:
  - raw-raw
  evidence:
    transformer: To transfer an existing neural ISP to another sensor without paired captures, learns unpaired RAW-to-RAW
      translation using a Transformer encoder–decoder; maps new-camera measurements into the trained ISP's sensor domain.
    unpaired: To transfer an existing neural ISP to another sensor without paired captures, learns unpaired RAW-to-RAW
      translation using a Transformer encoder–decoder; maps new-camera measurements into the trained ISP's sensor domain.
    raw-raw: To transfer an existing neural ISP to another sensor without paired captures, learns unpaired RAW-to-RAW
      translation using a Transformer encoder–decoder; maps new-camera measurements into the trained ISP's sensor domain.
  reading:
    en:
      challenge: An ISP trained for one camera cannot directly consume another sensor’s RAW distribution, and paired
        captures are costly.
      method: Uses a Transformer encoder–decoder for unpaired RAW-to-RAW translation, mapping a new sensor into the domain
        expected by an existing ISP.
      contribution: Transfers an existing learned ISP through sensor-domain translation rather than retraining it from
        paired RGB targets.
      limits: The learned translator is a sensor-domain mapping, not itself a full RAW-to-display renderer.
    zh-CN:
      challenge: 一台相机训练的 ISP 难以直接接受另一传感器的 RAW 分布，而配对采集成本高。
      method: 用 Transformer 编码器—解码器学习非配对 RAW→RAW 映射，把新传感器转换到已有 ISP 的输入域。
      contribution: 通过传感器域转换迁移已有神经 ISP，减少重新采集 RAW/RGB 配对监督的需求。
      limits: 该网络承担传感器域映射，本身不是完整的 RAW→显示图像渲染器。
