      and power constraints for real-time RAW-to-RAW video.
    video: To integrate UHD low-light denoising into commercial ISPs, combines a sensor-diverse data protocol, mobile-specific
      low-complexity architecture and post-training reparameterization, restructuring and quantization; evaluates latency
      and power constraints for real-time RAW-to-RAW video.
  collections:
  - mobile
  bibtex: "@InProceedings{Pochimireddy_2026_CVPR,\n    author    = {Pochimireddy, Charantej and Sahoo, Subhasmita and\
    \ Verma, Apoorva and Shyam, Palavalli and Malviya, Swapnil and Sarvesh, Sarvesh and Gadde, Raj},\n    title     =\
    \ {Efficient Real-Time Raw-to-Raw Denoising for Extreme Low-Light Ultra HD Video on Mobile Devices},\n    booktitle\
    \ = {Proceedings of the IEEE/CVF Conference on Computer Vision and Pattern Recognition (CVPR)},\n    month     =\
    \ {June},\n    year      = {2026},\n    pages     = {1376-1385}\n}"
  bibtex_source: https://openaccess.thecvf.com/content/CVPR2026/html/Pochimireddy_Efficient_Real-Time_Raw-to-Raw_Denoising_for_Extreme_Low-Light_Ultra_HD_Video_CVPR_2026_paper.html
  summary:
    en: 'Extreme-low-light UHD video must suppress noise within a strict frame-time and power budget, which makes many
      large denoisers impractical on phones. This work presents an end-to-end development procedure: build data across
      sensors, train a low-complexity RAW-to-RAW network, then apply reparameterization, restructuring and quantization
      for mobile deployment. The denoised RAW feeds the existing downstream ISP. The contribution is a sensor-portable
      integration and optimization workflow covering data, model and deployment constraints; timing and power results
      should be read with the reported hardware configuration.'
    zh-CN: 极弱光 UHD 视频既要抑制噪声，又要满足逐帧时延和功耗限制，大型去噪网络很难直接用于手机。本文给出完整开发流程：构建覆盖不同传感器的数据，训练低复杂度 RAW 到 RAW 去噪网络，再通过重参数化、结构调整和量化适配移动计算单元。输出继续交给已有
      ISP 处理。贡献覆盖数据、模型与部署优化，让弱光去噪能接入商业相机栈；具体速度和功耗需要结合原文硬件配置比较。
  summary_source: https://openaccess.thecvf.com/content/CVPR2026/html/Pochimireddy_Efficient_Real-Time_Raw-to-Raw_Denoising_for_Extreme_Low-Light_Ultra_HD_Video_CVPR_2026_paper.html
