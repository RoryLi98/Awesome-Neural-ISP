- title: CNNs, attention and generative ISPs
  text: The library includes pyramidal CNN pipelines, Transformer and state-space restoration, and diffusion, flow-matching
    or autoregressive rendering/reconstruction. These families coexist and address different quality, training and deployment
    constraints.
  examples: PyNET · LiteISPNet · LDM-ISP · RAW-Flow · Retinex-RAWMamba · VAR-ISP
- title: Learning with imperfect or missing pairs
  text: Cross-camera RAW and RGB captures can differ in geometry and color. Alignment-aware losses, synthetic training
    data and sensor-domain translation address different parts of this problem. MAI 2025 and NTIRE 2026 include explicit
    unpaired smartphone-ISP settings.
  examples: LiteISPNet · Unprocessing · Day-to-Night · Rawformer · NTIRE 2026 Unpaired ISP
- title: Capture-aware conditioning
  text: EXIF settings, device embeddings, calibrated color matrices and capture time provide different conditioning signals.
    Their presence does not automatically imply exposed user editing controls.
  examples: ParamISP · MetaISP · Uni-ISP · CRISPnet · CCMNet · Time-Aware AWB
- title: Deployment depends on hardware
  text: Mobile ISP challenges evaluate target-device execution, while compact and binarized designs also appear in denoising,
    demosaicing and video. Parameter counts, quantization and measured latency answer different efficiency questions.
  examples: MicroISP · PyNET-V2 Mobile · PMRID · BRVE · BinRVR · BMTNet
- title: Imaging for perception and action
  text: Task-driven rendering, direct RAW inference, learned pipeline selection and input adapters optimize information
    for downstream models. Benchmarks span detection, segmentation, matching and robotic manipulation.
  examples: Dirty Pixels · AdaptiveISP · RAW-Adapter · TA-ISP · POS-ISP · RawVLA
- title: Different meanings of controllability
  text: User parameters, reference-style adjustment, replaceable learned stages and camera conditioning are labeled separately
    in the controllable collection. Color-only editing, inverse reconstruction and automatic tuning remain connected
    through independent tags.
  examples: CtrlISP · Modular Neural ISP · DRIFT · Deep-FlexISP · Neural Photo-Finishing · ParamISP
